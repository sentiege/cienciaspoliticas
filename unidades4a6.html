body{margin:0;font-family:'Segoe UI',Roboto,Inter,sans-serif;background:var(--bg);color:var(--text);display:grid;grid-template-columns:250px 1fr 320px;height:100vh;overflow:hidden;}
header{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--brand);color:#fff;}

.rp-q{padding:9px 10px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--bg);}

.close{float:right;cursor:pointer;color:var(--muted);font-size:11px;}

.nav-back{display:block;margin-top:12px;font-size:11px;color:var(--muted);text-decoration:none;}

<script>
const UNITS = [{"id": "u4", "title": "Unidad IV", "subtitle": "Estado, gobierno y nación", "sections": [{"h": "1. Tres conceptos que no son sinónimos", "p": ["Estado, gobierno y nación son conceptos fundamentales de las ciencias políticas, pero en el lenguaje cotidiano suelen utilizarse como si fueran equivalentes. Esta confusión dificulta comprender fenómenos básicos: un cambio de gobierno no implica la desaparición del Estado; una nación puede existir sin contar con un Estado propio; y un mismo Estado puede contener diversas identidades nacionales.", "El Estado responde a la pregunta sobre cuál es la organización institucional y jurídica que ejerce autoridad, con relativa permanencia institucional. El gobierno responde a quién conduce temporalmente esa organización, con temporalidad y dirección política. La nación responde a quiénes se reconocen como una comunidad con vínculos de pertenencia e identidad colectiva."], "q": {"t": "Si mañana cambia completamente el gobierno paraguayo, el Estado paraguayo no desaparece. Sus instituciones, territorio, población, orden jurídico y personalidad internacional continúan existiendo. Tampoco desaparece la comunidad nacional.", "c": "Manual de Unidad IV"}}, {"h": "2. El Estado: territorio, población, poder político y orden jurídico", "p": ["El Estado moderno se caracteriza por la concentración e institucionalización del poder: la autoridad deja de depender exclusivamente de relaciones personales y se organiza mediante normas, cargos y burocracias relativamente permanentes. Esta institucionalización permite que el Estado continúe existiendo aunque cambien las personas que ocupan el gobierno.", "El territorio es el espacio geográfico dentro del cual el Estado ejerce su autoridad; posee una dimensión física y también jurídica y política. La población está constituida por las personas sometidas al orden jurídico estatal, y no debe confundirse automáticamente con la nación: incluye ciudadanos, extranjeros y residentes con diferentes derechos y obligaciones. El poder político es la capacidad de adoptar decisiones obligatorias y asegurar su cumplimiento; en el Estado moderno se institucionaliza y se ejerce mediante cargos definidos por el orden jurídico.", "La soberanía expresa la existencia de una autoridad política superior dentro del territorio estatal, con una dimensión interna (autoridad sobre población y territorio) y una externa (independencia frente a otros Estados). En los Estados constitucionales contemporáneos, soberanía no significa poder ilimitado del gobierno: la autoridad está sometida a la Constitución, los derechos fundamentales y la división de poderes."]}, {"h": "3. Funciones del Estado", "p": ["Las funciones estatales han cambiado históricamente y no existe una lista universal e inmutable. Entre las funciones fundamentales se encuentran mantener el orden y la seguridad, garantizar la vigencia del Derecho, administrar justicia, proteger el territorio, representar internacionalmente a la comunidad política y organizar la administración pública. Los Estados contemporáneos también prestan servicios públicos en educación, salud, infraestructura y protección social, y promueven cohesión social reduciendo desigualdades."], "tb": [["Función", "Contenido"], ["Orden y seguridad", "Protección de personas, bienes y convivencia social"], ["Justicia y legalidad", "Aplicación de normas y resolución de conflictos"], ["Servicios públicos", "Educación, salud, infraestructura"], ["Representación internacional", "Relaciones diplomáticas y tratados"], ["Cohesión social", "Protección social y reducción de desigualdades"]]}, {"h": "4-4.1. El gobierno y la administración pública", "p": ["El gobierno es el conjunto de autoridades que dirige y administra temporalmente el Estado. A diferencia del Estado, que posee continuidad institucional, el gobierno tiene una duración limitada y puede ser reemplazado mediante los mecanismos previstos por el régimen político. Gobernar significa orientar la acción estatal: establecer prioridades, tomar decisiones e impulsar políticas públicas.", "Gobierno y administración pública tampoco son exactamente lo mismo. El gobierno posee una función principalmente política: define orientaciones y prioridades. La administración pública ejecuta políticas, presta servicios y desarrolla tareas técnicas de manera relativamente permanente. Una administración profesional evita que cada cambio de gobierno implique reconstruir completamente el aparato estatal."]}, {"h": "5. Formas de gobierno: presidencialismo, parlamentarismo y semipresidencialismo", "p": ["En el presidencialismo, el presidente es elegido independientemente del Poder Legislativo y ejerce la jefatura del Poder Ejecutivo por un período determinado, reuniendo habitualmente las funciones de jefe de Estado y jefe de gobierno. Su mandato tiene duración fija. Paraguay, al igual que la mayoría de los países latinoamericanos, adopta una forma presidencial de gobierno.", "En el parlamentarismo, el gobierno surge de la mayoría parlamentaria y necesita conservar su confianza para permanecer en funciones; el jefe de gobierno suele ser un primer ministro. Si el gobierno pierde apoyo parlamentario, puede ser reemplazado sin esperar el final de un mandato fijo.", "El semipresidencialismo combina elementos presidenciales y parlamentarios: existe un presidente elegido popularmente y, al mismo tiempo, un primer ministro y un gabinete que dependen de la confianza parlamentaria. Cuando el presidente y la mayoría legislativa pertenecen a fuerzas diferentes puede producirse una situación de cohabitación."], "tb": [["Modelo", "Ejecutivo", "Relación con el Legislativo"], ["Presidencialismo", "Presidente elegido separadamente", "Mandato fijo e independencia de origen"], ["Parlamentarismo", "Primer ministro de mayoría parlamentaria", "Gobierno depende de confianza parlamentaria"], ["Semipresidencialismo", "Presidente + primer ministro", "Ejecutivo dual"]]}, {"h": "6. La nación y su relación con el Estado", "p": ["La nación es una comunidad humana que desarrolla un sentido de pertenencia colectiva, vinculado con historia, cultura, lengua, tradiciones, símbolos y memoria. Posee una dimensión subjetiva: existe en la medida en que un conjunto de personas se reconoce como parte de una comunidad. El nacionalismo es la ideología que coloca a la nación como comunidad política fundamental, pero nación y nacionalismo no son conceptos idénticos.", "Estado y nación pueden coincidir, pero no necesariamente. El ideal del Estado-nación supone que las fronteras estatales coinciden con una comunidad nacional, pero numerosos Estados contienen diferentes identidades nacionales, culturales o étnicas. También existen naciones sin Estado soberano propio, lo que puede producir demandas de autonomía, federalismo o independencia."]}, {"h": "7. Del Estado liberal clásico al Estado de Bienestar", "p": ["Durante el desarrollo del liberalismo clásico se consolidó una concepción de Estado limitado, centrada en garantizar seguridad, propiedad, contratos y libertades individuales, como reacción al absolutismo. Sin embargo, la industrialización planteó nuevos problemas: la igualdad jurídica coexistía con desigualdades económicas, condiciones laborales precarias y ausencia de protección frente a enfermedad o desempleo.", "El Estado de Bienestar amplía las responsabilidades estatales en salud, educación, seguridad social y políticas sociales, bajo la premisa de que ciertos riesgos no deben depender exclusivamente de la capacidad económica individual. Existen diferentes modelos: algunos se apoyan en sistemas universales financiados mediante impuestos, otros en contribuciones laborales, y otros focalizan la asistencia en sectores de menores ingresos."]}, {"h": "8-9. Transformación de la ciudadanía y el debate sobre la intervención estatal", "p": ["La ciudadanía moderna se vinculó primero con derechos civiles (libertad personal, propiedad, igualdad ante la ley); luego se expandieron los derechos políticos (sufragio, participación); y con el Estado social se incorporaron los derechos sociales (educación, salud, seguridad social) como componentes de una ciudadanía efectiva.", "La expansión estatal genera un debate permanente: quienes defienden mayor intervención sostienen que el mercado no garantiza por sí solo igualdad de oportunidades; quienes cuestionan una expansión excesiva señalan costo fiscal, burocratización e ineficiencia. El debate contemporáneo se desplaza hacia la calidad de la intervención: qué problema resuelve, cómo se financia y qué resultados y controles produce."], "tb": [["Dimensión de ciudadanía", "Ejemplos"], ["Derechos civiles", "Libertad personal, propiedad, igualdad ante la ley"], ["Derechos políticos", "Sufragio, participación, representación"], ["Derechos sociales", "Educación, salud, seguridad social"]]}, {"h": "11. El caso paraguayo", "p": ["Paraguay permite observar claramente la diferencia entre Estado, gobierno y nación. La República del Paraguay constituye el Estado: posee territorio, población, soberanía, Constitución e instituciones. Los gobiernos se suceden dentro de ese marco. La nación paraguaya remite a una identidad colectiva construida históricamente. La Constitución de 1992 organiza jurídicamente al Estado paraguayo bajo un modelo presidencial, y el análisis del caso permite observar la ampliación de responsabilidades estatales en educación, salud y programas sociales."]}], "glossary": [["Estado", "Organización política y jurídica soberana sobre población y territorio."], ["Gobierno", "Autoridades que dirigen temporalmente el Estado."], ["Nación", "Comunidad con vínculos de pertenencia e identidad."], ["Soberanía", "Autoridad política superior dentro del territorio."], ["Presidencialismo", "El presidente tiene mandato propio e independiente del Legislativo."], ["Parlamentarismo", "El Ejecutivo depende de la confianza parlamentaria."], ["Estado de Bienestar", "Amplía responsabilidades estatales en derechos sociales."]], "repaso": [["¿Por qué Estado, gobierno y nación no son sinónimos?", "Responden a preguntas distintas: organización permanente, autoridades temporales, y comunidad de identidad."], ["¿Elementos fundamentales del Estado?", "Territorio, población, poder político o soberanía, y orden jurídico."], ["¿Diferencia entre poder político y soberanía?", "Poder político: capacidad de decidir obligatoriamente. Soberanía: autoridad superior interna y externa."], ["¿Por qué el Estado permanece aunque cambie el gobierno?", "Sus instituciones y orden jurídico tienen continuidad independiente de quién gobierna."], ["¿Funciones del Estado contemporáneo?", "Orden, justicia, servicios públicos, representación internacional, desarrollo económico y cohesión social."], ["¿Diferencia entre gobierno y administración pública?", "Gobierno define prioridades políticas; administración ejecuta y presta servicios técnicos."], ["¿Presidencialismo, parlamentarismo y semipresidencialismo?", "Presidencial: mandato fijo. Parlamentario: depende de confianza legislativa. Semipresidencial: combina ambos."], ["¿Por qué una nación puede existir sin Estado propio?", "Su dimensión es subjetiva e histórica (identidad, cultura), no depende de instituciones soberanas."], ["¿Puede un Estado contener varias identidades nacionales?", "Sí, muchos Estados son plurinacionales o multiculturales."], ["¿Características del Estado liberal clásico?", "Limitado, garantiza seguridad, propiedad y libertades civiles, como reacción al absolutismo."], ["¿Por qué se amplian funciones con el Estado de Bienestar?", "La igualdad jurídica no bastaba frente a desigualdades económicas de la industrialización."], ["¿Cómo cambia la ciudadanía con derechos sociales?", "Se añade una dimensión social (educación, salud) junto a derechos civiles y políticos."], ["¿Argumentos a favor y en contra de mayor intervención estatal?", "A favor: reduce desigualdad. En contra: costo fiscal, burocratización e ineficiencia."], ["¿Por qué el debate no es solo 'más o menos Estado'?", "Lo relevante es la calidad de la intervención: qué resuelve y cómo se financia."], ["¿Cómo aplicar Estado, gobierno y nación al caso paraguayo?", "Paraguay es el Estado con Constitución; los gobiernos se suceden; la nación es la identidad compartida."]]}, {"id": "u5", "title": "Unidad V", "subtitle": "Sistema político", "sections": [{"h": "1. El Estado como organización política y la definición de Weber", "p": ["El sistema político es el espacio en el que instituciones, actores, normas, demandas sociales y decisiones públicas se relacionan de manera permanente. El Estado es una de las instituciones fundamentales de la política moderna, aunque no existe una única forma histórica de Estado. Una aproximación básica identifica tres componentes clásicos: población, territorio y poder soberano.", "Una de las definiciones más influyentes es la de Max Weber, quien no define al Estado por las funciones que realiza sino por el medio específico del que dispone: la coerción física legítima. En esta perspectiva, el Estado es una organización política cuyos funcionarios reclaman con éxito el monopolio legítimo de la violencia dentro de un territorio determinado."], "q": {"t": "La coerción no es necesariamente el recurso cotidiano ni el primero que utiliza el Estado. Es el recurso de última instancia.", "c": "Manual de Unidad V"}}, {"h": "1.2-2. Soberanía y formación del Estado moderno", "p": ["La soberanía es una característica central del Estado moderno, aunque hoy no debe pensarse como una capacidad absoluta e ilimitada: la interdependencia económica, los organismos internacionales y los procesos de integración regional muestran que la capacidad efectiva de los Estados varía. El Estado moderno no apareció de manera instantánea: fue el resultado de un proceso histórico de centralización del poder, delimitación territorial y desarrollo de burocracias, vinculado a guerras y competencia territorial en Europa. La Paz de Westfalia de 1648 suele utilizarse como referencia simbólica del sistema internacional moderno basado en Estados soberanos."]}, {"h": "3-3.1. Del Estado al sistema político: David Easton", "p": ["El enfoque de sistema político amplía la mirada del Estado y observa las relaciones dinámicas entre el Estado, la sociedad y los diferentes actores que intervienen en la vida política: partidos, movimientos sociales, grupos de interés, medios de comunicación y ciudadanía. David Easton definió al sistema político como el conjunto de interacciones mediante las cuales se realiza la asignación autoritativa de valores en una sociedad.", "El modelo de Easton representa el sistema político como un proceso de entradas, conversión, salidas y retroalimentación. Las entradas o inputs son demandas y apoyos provenientes del entorno social; las instituciones políticas procesan esas entradas y producen outputs (leyes, políticas públicas); la retroalimentación o feedback ocurre cuando las decisiones generan reacciones en la sociedad, que vuelven a ingresar al sistema."], "tb": [["Elemento", "Contenido", "Ejemplo"], ["Inputs", "Demandas y apoyos provenientes de la sociedad", "Reclamo ciudadano por mayor seguridad"], ["Procesamiento", "Instituciones transforman demandas en decisiones", "Debate legislativo y diseño de una política"], ["Outputs", "Decisiones y políticas públicas", "Ley, presupuesto, programa público"], ["Feedback", "Respuesta social a las decisiones", "Apoyo, protesta, nuevas demandas o voto"]]}, {"h": "4. Régimen político, democracia, autoritarismo y totalitarismo", "p": ["El régimen político refiere al conjunto de reglas e instituciones que determinan cómo se accede al poder, cómo se ejerce y cuáles son los límites de la autoridad. En una democracia, la competencia política, el pluralismo y la alternancia constituyen elementos centrales; en los regímenes autoritarios, el poder se concentra y la competencia se encuentra limitada.", "Una dictadura concentra el poder en una persona o grupo reducido y elimina los controles institucionales. El autoritarismo es una categoría analítica que describe regímenes con pluralismo limitado; puede mantener ciertas instituciones o elecciones, pero limita la competencia real. El totalitarismo supone una pretensión de control y transformación mucho más extensa de la sociedad, mediante ideología oficial y movilización intensa. La estabilidad autoritaria no depende exclusivamente de la represión: puede combinar coerción con clientelismo, control de medios y legitimación ideológica."], "tb": [["Autoritarismo", "Totalitarismo"], ["Pluralismo limitado", "Pretensión de eliminación del pluralismo"], ["Movilización baja, controlada o selectiva", "Movilización intensa y permanente"], ["Ideología débil, pragmática o limitada", "Ideología oficial fuerte y totalizante"], ["Busca obediencia y estabilidad", "Busca transformar integralmente sociedad e individuo"]]}, {"h": "5. Análisis de los sistemas autoritarios", "p": ["Los sistemas autoritarios presentan gran diversidad y pueden analizarse observando variables como el número de actores que ejercen el poder (liderazgo personalista o coalición dominante), la justificación ideológica (fuerte o pragmática), el nivel de movilización social y el grado de institucionalización (desde un liderazgo personal hasta partidos dominantes y burocracias estables)."]}, {"h": "6-6.1. Golpe de Estado: condiciones y factores asociados", "p": ["El golpe de Estado es una forma de ruptura del orden político mediante la cual un grupo relativamente reducido desplaza de manera rápida e ilegal a las autoridades existentes y se apodera de los centros decisivos del poder. Históricamente, las Fuerzas Armadas han tenido un papel central, aunque también pueden intervenir actores civiles. El golpe debe distinguirse de una revolución, que supone una movilización social más amplia y busca transformar profundamente el orden político, social o económico.", "No existe una causa única de los golpes de Estado. Entre los factores que pueden contribuir se encuentran crisis económicas, desigualdad, debilidad institucional, polarización política, pérdida de legitimidad y conflictos entre élites. En América Latina, los golpes militares del siglo XX se vincularon con frecuencia a conflictos distributivos, polarización ideológica y contextos internacionales como la Guerra Fría."]}, {"h": "7-8. Formas de gobierno autoritarias y transición política", "p": ["Entre las formas de gobierno autoritarias estudiadas se encuentran regímenes tradicionales (apoyados en estructuras históricas o patrimoniales), teocráticos (legitimidad vinculada a una doctrina religiosa), militares (las Fuerzas Armadas ocupan directamente el gobierno), cívico-militares (combinan actores civiles y militares) y de partido único (concentran el poder en una organización partidaria).", "Una transición política es un proceso de cambio de un régimen hacia otro, no un acontecimiento instantáneo. Las transiciones pueden dirigirse hacia una democracia, hacia un nuevo autoritarismo o hacia formas híbridas. Suelen comenzar cuando un régimen pierde capacidad para reproducir sus reglas: pérdida de legitimidad, divisiones dentro de la élite gobernante, crisis económica o movilización social."]}, {"h": "8.2-9. Liberalización, democratización y consolidación democrática", "p": ["Liberalización y democratización no son sinónimos: la liberalización consiste en una apertura parcial del régimen autoritario (ampliar libertades, tolerar cierta oposición) sin aceptar todavía una competencia plenamente democrática. La democratización implica un cambio más profundo en las reglas de acceso y ejercicio del poder: elecciones libres, pluralismo partidario y posibilidad real de alternancia.", "La caída de un régimen autoritario y la celebración de elecciones no significan automáticamente que una democracia esté consolidada. La instauración democrática refiere a la construcción inicial de nuevas instituciones; la consolidación comienza cuando esas estructuras se fijan y aumentan su aceptación social. Leonardo Morlino destaca que la consolidación debe analizarse tanto en el nivel institucional como en la relación entre régimen y sociedad civil: una democracia se consolida cuando aumenta la legitimidad de las reglas democráticas como mecanismo para resolver pacíficamente los conflictos."], "tb": [["Liberalización", "Democratización"], ["Apertura parcial de derechos y libertades", "Transformación de las reglas de acceso al poder"], ["Puede mantenerse la élite autoritaria", "Competencia política efectiva"], ["No garantiza democracia", "Implica construcción de un régimen democrático"]]}, {"h": "11. Aplicación al caso paraguayo", "p": ["La dictadura de Alfredo Stroessner, entre 1954 y 1989, constituyó un régimen autoritario de fuerte liderazgo personalista, sostenido por la articulación entre Presidencia, Fuerzas Armadas y Partido Colorado, con severa restricción de la oposición y las libertades políticas. La caída de Stroessner en febrero de 1989 abrió un proceso de transición que incluyó reformas institucionales y culminó con la Constitución de 1992. Desde la perspectiva de la consolidación, el análisis no termina con la aprobación de una Constitución: debe observarse la calidad de las instituciones, la independencia de los poderes y la capacidad del sistema para resolver conflictos sin recurrir a rupturas autoritarias."]}], "glossary": [["Sistema político", "Interacciones por las que se procesan demandas y decisiones."], ["Monopolio legítimo de la violencia", "Uso legítimo de la coerción física dentro de un territorio (Weber)."], ["Régimen político", "Reglas que organizan el acceso y ejercicio del poder."], ["Golpe de Estado", "Toma no constitucional del poder mediante ruptura rápida."], ["Liberalización", "Apertura parcial de libertades sin plena democratización."], ["Democratización", "Establecimiento de competencia y derechos democráticos."], ["Consolidación democrática", "Estabilización y legitimación de las reglas democráticas."]], "repaso": [["¿Qué aporta la definición de Estado de Max Weber?", "Define al Estado por el monopolio legítimo de la coerción física, no por sus funciones."], ["¿Por qué Estado y sistema político no son sinónimos?", "El Estado es la estructura permanente; el sistema político incluye las interacciones dinámicas con la sociedad."], ["¿Modelo de inputs, outputs y feedback de Easton?", "Demandas ingresan (inputs), se procesan en decisiones (outputs), generando feedback social."], ["¿Diferencia entre régimen democrático, autoritario y totalitario?", "Democrático: pluralismo y alternancia. Autoritario: poder concentrado. Totalitario: control total de la sociedad."], ["¿Por qué la represión no es el único sostén autoritario?", "Se combina con clientelismo, control de medios y legitimación ideológica."], ["¿Variables para analizar sistemas autoritarios?", "Número de actores, justificación ideológica, movilización e institucionalización."], ["¿Diferencia entre golpe de Estado y revolución?", "El golpe es una ruptura rápida por un grupo reducido; la revolución implica movilización social amplia."], ["¿Factores que favorecen rupturas autoritarias?", "Crisis económica, desigualdad, debilidad institucional y polarización, sin ser causas únicas."], ["¿Diferencia entre liberalización y democratización?", "Liberalización: apertura parcial de libertades. Democratización: cambio real de las reglas de acceso al poder."], ["¿Qué actores intervienen en una transición política?", "Sectores duros y blandos del régimen, oposición moderada y radical, Fuerzas Armadas y ciudadanía."], ["¿Diferencia entre instauración, consolidación y persistencia?", "Instauración crea instituciones; consolidación las legitima; persistencia es mantenerse en el tiempo."], ["¿Por qué la legitimidad es clave para la consolidación?", "Los actores deben aceptar resolver disputas dentro de las instituciones democráticas, aun perdiendo."], ["¿Cómo aplicar transición y consolidación al caso paraguayo?", "La dictadura de Stroessner (1954-1989) dio paso a la transición y la Constitución de 1992."]]}, {"id": "u6", "title": "Unidad VI", "subtitle": "Ideologías políticas", "sections": [{"h": "1. Ideología y pensamiento político", "p": ["Una ideología política es un conjunto relativamente organizado de ideas, valores, principios y expectativas sobre la sociedad, el poder, el Estado, la economía y la forma en que debería organizarse la convivencia colectiva. Toda ideología ofrece una interpretación de la realidad y, al mismo tiempo, una propuesta normativa: describe qué considera injusto, qué debe conservarse y qué medios resultan legítimos para transformar un orden político.", "Las ideologías modernas se consolidan especialmente a partir de las grandes transformaciones de los siglos XVIII y XIX: la crisis del absolutismo, la Revolución Francesa, la expansión del capitalismo y la Revolución Industrial. Una ideología política suele tener cuatro dimensiones: una visión de la naturaleza humana, una visión del poder, una visión del Estado y una visión del cambio social (gradual, revolucionario o reformista)."]}, {"h": "2. Liberalismo: bases filosóficas, Hobbes, Locke y Kant", "p": ["El liberalismo surge como reacción frente al absolutismo, los privilegios estamentales y el feudalismo. Frente a ese mundo, afirma que el individuo posee derechos y libertades que no dependen de la voluntad del gobernante. Su núcleo fundamental es la limitación del poder, vinculándose con el constitucionalismo, la división de poderes, los derechos individuales y la igualdad ante la ley.", "Thomas Hobbes y John Locke son autores fundamentales para comprender la transición del absolutismo al pensamiento moderno. Para Hobbes, el problema central es la inseguridad: en ausencia de un poder común, los individuos viven sometidos al miedo, por lo que transfieren poder a un soberano fuerte. Locke, en cambio, es una figura central del liberalismo político: los individuos poseen derechos anteriores al Estado —vida, libertad y propiedad— y el gobierno se crea para proteger esos derechos, no para anularlos; si se vuelve arbitrario, pierde legitimidad.", "Immanuel Kant aporta una concepción jurídica y moral de la libertad: la libertad no significa ausencia de reglas, sino sometimiento a leyes racionales que puedan valer para todos. Esto se traduce en la idea de Estado de Derecho: el poder debe estar jurídicamente limitado por una Constitución, derechos fundamentales y mecanismos de control."], "q": {"t": "Antes de ser una doctrina económica, el liberalismo es una doctrina política orientada a impedir que el poder estatal sea arbitrario.", "c": "Manual de Unidad VI"}}, {"h": "2.4-2.5. Liberalismo económico y su evolución", "p": ["El liberalismo económico se asocia principalmente con Adam Smith y la defensa de la economía de mercado: propiedad privada, división del trabajo, libre competencia. La idea de la mano invisible expresa que la búsqueda del interés individual puede contribuir, mediante el intercambio, a resultados socialmente beneficiosos, aunque el Estado conserva funciones esenciales como garantizar seguridad y contratos.", "El liberalismo clásico del siglo XIX se centró en limitar el poder político y proteger la propiedad privada. Durante el siglo XX, el liberalismo social incorporó una pregunta distinta: ¿puede una persona ser realmente libre si carece de educación, salud o trabajo? Por eso acepta mayor intervención estatal para reducir desigualdades. Hoy conviven liberalismo clásico, liberalismo social, neoliberalismo (que enfatiza el mercado) y liberalismo progresista (que combina libertades individuales con pluralismo y protección de minorías)."]}, {"h": "3. Conservadurismo: Edmund Burke, tradición y democracia", "p": ["El conservadurismo surge como reacción frente a las revoluciones modernas, especialmente la Revolución Francesa. No debe entenderse como apego irracional al pasado: es una forma de pensamiento que valora la continuidad histórica y la prudencia frente a proyectos de transformación radical, sosteniendo que las instituciones políticas son el resultado de experiencias acumuladas.", "Edmund Burke es el gran referente del conservadurismo moderno. Para él, la sociedad puede entenderse como una comunidad entre los vivos, los muertos y los que están por nacer: una generación no debería destruir irresponsablemente la herencia institucional recibida. Las reformas son posibles, pero deben ser prudentes y orgánicas, sin fundar el orden político exclusivamente en principios racionales abstractos.", "Históricamente, algunas corrientes conservadoras desconfiaron de la democracia de masas y el sufragio universal, temiendo que la movilización destruyera el orden social. Sin embargo, el conservadurismo evolucionó y se integró en sistemas democráticos, manteniendo énfasis en orden, autoridad, propiedad y tradición."]}, {"h": "4. Socialismo: orígenes, corrientes y socialdemocracia", "p": ["El socialismo surge entre fines del siglo XVIII y el siglo XIX como respuesta a las desigualdades producidas por la industrialización y el capitalismo. A diferencia del liberalismo clásico, que pone el acento en la libertad individual, el socialismo pregunta si puede existir libertad real en una sociedad marcada por pobreza y explotación. Es una familia amplia que incluye socialismo utópico, anarquismo, socialismo inglés, marxismo y socialdemocracia.", "El socialismo utópico (Owen, Fourier) imaginó modelos alternativos basados en cooperación y comunidad. El anarquismo (Bakunin, Kropotkin) comparte la crítica a la desigualdad pero rechaza el Estado como forma de dominación, aspirando a una sociedad de asociaciones libres. La socialdemocracia representa una corriente reformista que sostiene que la transformación social puede realizarse mediante democracia, elecciones y políticas públicas, impulsando el Estado de Bienestar, los derechos laborales y la seguridad social."]}, {"h": "5. Marxismo: materialismo histórico, plusvalor y alienación", "p": ["El marxismo es una corriente específica dentro del socialismo, desarrollada por Karl Marx y Friedrich Engels, que aporta una crítica estructural del capitalismo y una teoría de la historia basada en el conflicto entre clases sociales. El materialismo histórico sostiene que la historia está atravesada por conflictos vinculados al modo en que se organiza la producción; la lucha de clases —entre burguesía y proletariado— es el motor de la historia.", "El plusvalor es central en la crítica marxista: el trabajador produce un valor mayor que el salario que recibe, y esa diferencia es apropiada por el capitalista, lo que constituye la explotación capitalista. La alienación describe la pérdida de control del trabajador sobre su propia actividad: no controla el producto de su trabajo ni el proceso productivo, quedando reducido a una pieza del sistema.", "En la teoría marxista, el socialismo aparece como una etapa de transición hacia el comunismo: una sociedad sin clases, sin explotación y sin propiedad privada de los medios de producción. Es fundamental distinguir socialismo y marxismo: todo marxismo es socialista, pero no todo socialismo es marxista (una socialdemocracia que defiende el Estado de Bienestar es socialista sin ser necesariamente marxista)."]}, {"h": "6. Nacionalismo: formas y evolución", "p": ["El nacionalismo se vincula estrechamente con el Estado moderno y sostiene que la nación debe expresar su voluntad política, ya sea mediante un Estado propio, autonomía o reconocimiento. A diferencia del liberalismo o el socialismo, no responde a cuánto Estado o mercado debe existir, sino a quién constituye la comunidad política: su respuesta es la nación.", "Puede distinguirse la nación política (basada en ciudadanía e instituciones comunes), la nación cultural (lengua, tradiciones, símbolos) y la dimensión jurídico-estatal (pertenencia formal a un Estado). Durante el siglo XIX, el nacionalismo impulsó la unificación de territorios (Italia, Alemania); en el siglo XX fue utilizado por movimientos anticoloniales y también por regímenes autoritarios y expansionistas."], "tb": [["Forma", "Características"], ["Nacionalismo cívico o político", "Ciudadanía, instituciones y voluntad política común"], ["Nacionalismo cultural", "Lengua, memoria y símbolos compartidos"], ["Nacionalismo anticolonial", "Reclama autodeterminación frente a dominación extranjera"], ["Nacionalismo conservador", "Vincula nación con tradición, orden o religión"], ["Nacionalismo excluyente", "Define la nación con criterios cerrados, riesgo de discriminación"]]}, {"h": "7-8. Otras tradiciones ideológicas: anarquismo, fascismo y democracia cristiana", "p": ["El anarquismo rechaza el Estado y las formas coercitivas de autoridad, proponiendo formas de organización voluntaria y autogestión. El fascismo es una ideología autoritaria, ultranacionalista y antiliberal que rechaza el pluralismo político y exalta el liderazgo fuerte; sus ejemplos más conocidos son el fascismo italiano y el nazismo alemán. La democracia cristiana se inspira en el pensamiento social cristiano, defendiendo la dignidad de la persona, la subsidiariedad y una economía social de mercado.", "El ecologismo introduce la cuestión ambiental como problema político central, cuestionando modelos de desarrollo y consumo. Los feminismos cuestionan las desigualdades de género y las estructuras patriarcales, con corrientes liberal, socialista, radical e interseccional. El populismo no es necesariamente una ideología completa, sino una lógica política que construye una oposición entre el pueblo y las élites, pudiendo combinarse con ideologías de izquierda o derecha."]}, {"h": "9-10. Izquierda, derecha y nuevos ejes de conflicto ideológico", "p": ["El espectro izquierda-derecha nació en el contexto de la Revolución Francesa y hoy se usa para analizar partidos y discursos. La izquierda suele asociarse con igualdad y redistribución; la derecha, con orden, propiedad y tradición; el centro, con moderación y pragmatismo. Sin embargo, esta clasificación es insuficiente si se usa rígidamente: un partido puede ser liberal en economía, conservador en temas culturales y nacionalista en política exterior.", "Los conflictos contemporáneos combinan varios ejes analíticos: el eje económico opone mayor intervención estatal a mayor libertad de mercado; el eje sociocultural distingue posiciones progresistas y conservadoras; el eje territorial contrapone globalización o integración frente a soberanía y nacionalismo; y el eje político-institucional distingue compromiso democrático frente a tendencias autoritarias o iliberales."], "tb": [["Eje", "Polo 1", "Polo 2"], ["Económico", "Mayor intervención estatal", "Mayor libertad de mercado"], ["Sociocultural", "Progresismo", "Conservadurismo cultural"], ["Territorial", "Globalismo/integración", "Nacionalismo/soberanía"], ["Institucional", "Democracia pluralista", "Autoritarismo/iliberalismo"]]}], "glossary": [["Ideología", "Conjunto organizado de ideas que interpreta la realidad política."], ["Estado de Derecho", "El poder público está sometido a normas jurídicas."], ["Plusvalor", "Diferencia entre valor producido y salario, apropiada por el capitalista (Marx)."], ["Alienación", "Pérdida de control del trabajador sobre su propio trabajo."], ["Socialdemocracia", "Corriente socialista reformista que impulsa el Estado de Bienestar."], ["Nacionalismo", "Ideología que coloca a la nación como comunidad política fundamental."], ["Populismo", "Lógica política que opone al pueblo frente a las élites."]], "repaso": [["¿Por qué el liberalismo es una doctrina de limitación del poder?", "Busca impedir el poder arbitrario del Estado, vinculándose al constitucionalismo y la división de poderes."], ["¿Diferencia entre igualdad jurídica e igualdad social?", "Jurídica: igual sometimiento a la ley. Social: condiciones materiales más equitativas."], ["¿Diferencia entre Hobbes y Locke sobre el Estado?", "Hobbes: soberano fuerte contra la inseguridad. Locke: Estado limitado para proteger derechos previos."], ["¿Por qué el conservadurismo valora la tradición?", "Considera que las instituciones condensan experiencia histórica acumulada."], ["¿Qué distingue al socialismo del marxismo?", "El socialismo es amplio y puede ser reformista; el marxismo explica la historia por la lucha de clases."], ["¿Qué son plusvalor y alienación en Marx?", "Plusvalor: diferencia entre valor producido y salario. Alienación: pérdida de control sobre el propio trabajo."], ["¿Por qué el nacionalismo puede ser de izquierda o derecha?", "Responde a quién constituye la comunidad política, combinándose con otras ideologías."], ["¿Diferencia entre nación política, cultural y jurídica?", "Política: ciudadanía común. Cultural: lengua y tradiciones. Jurídica: pertenencia formal a un Estado."], ["¿Por qué el eje izquierda-derecha es insuficiente?", "Los conflictos actuales combinan ejes económico, sociocultural, territorial e institucional."], ["¿Nuevos ejes de conflicto ideológico contemporáneo?", "Económico (Estado/mercado), sociocultural, territorial (soberanía/globalismo) e institucional (democracia/autoritarismo)."]]}];
let cur=0;
function renderNav(){
  document.getElementById('nav').innerHTML = UNITS.map((u,i)=>`<div class="nav-unit ${i===cur?'active':''}" onclick="load(${i})">${u.title}: ${u.subtitle}</div>`).join('');
}
function render(){
  const u=UNITS[cur];
  let html = `<h1>${u.title}: ${u.subtitle}</h1>`;
  u.sections.forEach(s=>{
    html += `<h2>${s.h}</h2>`;
    if(s.p) s.p.forEach(p=>html+=`<p>${p}</p>`);
    if(s.q) html += `<blockquote>"${s.q.t}"<span>— ${s.q.c}</span></blockquote>`;
    if(s.tb){
      html += '<table><tr>'+s.tb[0].map(h=>`<th>${h}</th>`).join('')+'</tr>';
      s.tb.slice(1).forEach(r=>html+='<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>');
      html += '</table>';
    }
  });
  document.getElementById('frame').innerHTML = html;
  hide();
}
function load(i){cur=i;renderNav();render();}
function showTool(k){
  hide();
  const u=UNITS[cur];
  if(k==='g'){document.getElementById('pg').style.display='block';document.getElementById('lg').innerHTML=u.glossary.map(g=>`<div class="pill" onclick="alert('${g[0].replace(/'/g,"\\'")}: ${g[1].replace(/'/g,"\\'")}')">🔑 ${g[0]}</div>`).join('');}
  else if(k==='f'){document.getElementById('pf').style.display='block';document.getElementById('lf').innerHTML=u.glossary.map((g,i)=>`<div class="card" id="c${i}" data-t="${g[0]}" data-d="${g[1].replace(/"/g,'&quot;')}" data-fl="0" onclick="flip(${i})">${g[0]}</div>`).join('');}
  else if(k==='r'){document.getElementById('pr').style.display='block';document.getElementById('lr').innerHTML=`<div class="cnt">${u.repaso.length} preguntas — ${u.title}</div>`+u.repaso.map((qa,i)=>`<div class="rp"><div class="rp-q" onclick="tg(${i})">${i+1}. ${qa[0]}</div><div class="rp-a" id="a${i}">${qa[1]}</div></div>`).join('');}
}
function tg(i){document.getElementById('a'+i).classList.toggle('open');}
function hide(){['pg','pf','pr'].forEach(id=>document.getElementById(id).style.display='none');}
function flip(i){const el=document.getElementById('c'+i);const fl=el.getAttribute('data-fl')==='1';el.innerHTML=fl?el.getAttribute('data-t'):el.getAttribute('data-d');el.setAttribute('data-fl',fl?'0':'1');}
renderNav();render();
</script>
