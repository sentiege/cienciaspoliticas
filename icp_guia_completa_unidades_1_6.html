<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ICP · Guía Completa I-VI · 95 Preguntas de Repaso</title>
<style>
:root{--bg:#F8F9FA;--card:#fff;--text:#212529;--brand:#0F172A;--accent:#1E3A8A;--soft:#EFF6FF;--border:#E2E8F0;--muted:#64748B;}
[data-theme="dark"]{--bg:#1A202C;--card:#232B3A;--text:#E2E8F0;--brand:#0B1220;--accent:#60A5FA;--soft:#1E293B;--border:#334155;--muted:#94A3B8;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Roboto,Inter,sans-serif;background:var(--bg);color:var(--text);display:grid;grid-template-columns:260px 1fr 320px;height:100vh;overflow:hidden;}
header{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--brand);color:#fff;}
header button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;}
.layout{grid-column:1/4;display:grid;grid-template-columns:260px 1fr 320px;overflow:hidden;}
aside.left{background:var(--card);border-right:1px solid var(--border);padding:18px;overflow-y:auto;}
.nav-unit{padding:10px;border-radius:6px;cursor:pointer;font-size:13px;margin-bottom:6px;color:var(--text);}
.nav-unit:hover{background:var(--soft);}
.nav-unit.active{background:var(--accent);color:#fff;font-weight:600;}
main{overflow-y:auto;padding:36px 50px;}
.frame{max-width:720px;margin:0 auto;}
.frame h1{font-family:Georgia,serif;color:var(--accent);font-size:28px;margin-bottom:6px;}
.frame p{font-size:17px;line-height:1.65;margin-bottom:18px;}
aside.right{background:var(--card);border-left:1px solid var(--border);padding:18px;overflow-y:auto;}
.tool-title{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;}
.btn{display:block;width:100%;padding:9px;margin-bottom:8px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;}
.pill{background:var(--soft);border:1px solid var(--border);color:var(--accent);padding:7px 9px;border-radius:6px;font-size:12px;margin-bottom:6px;cursor:pointer;}
.card{background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:14px;min-height:70px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:12.5px;margin-bottom:8px;}
.rp{border:1px solid var(--border);border-radius:8px;margin-bottom:6px;overflow:hidden;}
.rp-q{padding:9px 10px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--bg);}
.rp-a{padding:0 10px;font-size:12px;color:var(--muted);max-height:0;overflow:hidden;background:var(--soft);transition:max-height .2s,padding .2s;}
.rp-a.open{padding:9px 10px;max-height:260px;}
.panel{display:none;}
.close{float:right;cursor:pointer;color:var(--muted);font-size:11px;}
.cnt{font-size:11px;color:var(--muted);margin-bottom:8px;}
</style>
</head>
<body data-theme="light">
<header>
  <div>📚 Introducción a las Ciencias Políticas — Guía Completa (Unidades I-VI)</div>
  <button onclick="document.body.setAttribute('data-theme', document.body.getAttribute('data-theme')==='dark'?'light':'dark')">🌙 Modo Noche</button>
</header>
<div class="layout">
  <aside class="left"><div id="nav"></div></aside>
  <main><div class="frame" id="frame"></div></main>
  <aside class="right">
    <div class="tool-title">🎯 Herramientas</div>
    <button class="btn" onclick="showTool('g')">🔑 Glosario</button>
    <button class="btn" style="background:#059669" onclick="showTool('f')">💡 Flashcards</button>
    <button class="btn" style="background:#D97706" onclick="showTool('r')">❓ Preguntas de Repaso</button>
    <div class="panel" id="pg"><span class="close" onclick="hide()">✕</span><div class="tool-title">Glosario</div><div id="lg"></div></div>
    <div class="panel" id="pf"><span class="close" onclick="hide()">✕</span><div class="tool-title">Flashcards</div><div id="lf"></div></div>
    <div class="panel" id="pr"><span class="close" onclick="hide()">✕</span><div class="tool-title">Preguntas de repaso completas</div><div id="lr"></div></div>
  </aside>
</div>
<script>
const UNITS = [{"id": "u1", "title": "Unidad I", "subtitle": "La política como poder y como participación", "intro": "Existe política allí donde una colectividad debe decidir cómo organizarse, distribuir recursos y procesar conflictos. Se estudian poder, participación, liderazgo y el sistema político de Easton.", "glossary": [["Política", "Proceso mediante el cual una sociedad organiza el poder y adopta decisiones colectivas."], ["Poder", "Capacidad de influir sobre conductas o decisiones."], ["Legitimidad", "Creencia de que el ejercicio del poder es válido o justificable."], ["Liderazgo transformacional", "Conducción orientada a modificar valores y objetivos colectivos."], ["Democracia delegativa", "El presidente interpreta la elección como delegación amplia y debilita controles (O'Donnell)."], ["Sistema político", "Conjunto de instituciones y relaciones mediante las cuales se organiza el poder."]], "repaso": [["¿Por qué la política no puede reducirse a elecciones, partidos o cargos públicos?", "Porque existe política donde hay relaciones de poder y decisiones que afectan a otros, no solo en elecciones o cargos formales."], ["¿Qué significa definir la política a partir del poder y la participación?", "Permite preguntar quién decide e influye (poder) y cómo interviene la ciudadanía en los asuntos comunes (participación)."], ["¿Qué diferencias existen entre coerción, influencia y autoridad legítima?", "Coerción usa fuerza o amenaza de sanción; la persuasión usa ideas y prestigio; la autoridad legítima se acepta porque se reconoce el derecho a decidir."], ["¿Cómo se diferencian las miradas de Weber, Arendt y Foucault sobre el poder?", "Weber analiza legitimidad y tipos de autoridad; Arendt distingue poder de violencia; Foucault ve el poder circulando en redes sociales, no solo en el Estado."], ["¿Por qué tener poder no equivale necesariamente a ejercerlo?", "Porque poseer recursos no garantiza usarlos con éxito: el poder se hace observable cuando efectivamente se decide, influye o transforma algo."], ["¿Puede una persona sin cargo público ejercer poder político? Fundamente.", "Sí, mediante visibilidad, prestigio y comunicación (caso Taylor Swift), evitando confundir influencia con causalidad directa."], ["¿Qué formas institucionales y no institucionales de participación existen?", "Institucionales: voto, militancia, peticiones. No institucionales: marchas, protestas, campañas digitales."], ["¿Qué diferencia existe entre inclusión formal e inclusión efectiva en la política?", "Formal es poseer el derecho; efectiva es contar con condiciones reales (educación, recursos) para ejercerlo."], ["¿Por qué liderazgo y autoridad no son sinónimos?", "La autoridad formal no garantiza adhesión; el liderazgo requiere capacidad real de movilizar a otros."], ["¿Qué papel cumplen los seguidores y el contexto en el liderazgo?", "Los seguidores aportan apoyo y movilización; el contexto crea oportunidades o restricciones."], ["¿Diferencia entre liderazgo transaccional y transformacional?", "Transaccional: intercambios concretos. Transformacional: modifica valores y objetivos colectivos."], ["¿Qué limita la visión tradicional del 'gran hombre'?", "Ignora que sin seguidores no hay liderazgo y oculta liderazgos colectivos y de grupos excluidos."], ["¿Cómo se distinguen caudillismo, personalismo, clientelismo y patronazgo?", "Caudillismo: autoridad personal territorial. Personalismo: centralidad del líder. Clientelismo: beneficios por apoyo. Patronazgo: uso de cargos estatales."], ["¿Qué preguntan Platón, Aristóteles, Maquiavelo y Weber sobre el gobierno?", "Platón: filósofo-rey. Aristóteles: bien común vs. interés propio. Maquiavelo: virtud y fortuna. Weber: por qué obedecemos."], ["¿Características del liderazgo presidencial, carismático, partidario e intelectual?", "Presidencial: legitimidad electoral. Carismático: vínculo emocional. Partidario: organización interna. Intelectual: influencia de ideas."], ["¿Por qué una victoria electoral no implica poder ilimitado?", "Porque el gobierno sigue sometido a la Constitución, separación de poderes y controles institucionales."], ["¿Qué es la democracia delegativa de O'Donnell?", "El presidente interpreta su victoria como autorización amplia y debilita controles institucionales."], ["¿Diferencia entre lógica personalista y lógica institucional?", "Personalista: lealtades al líder. Institucional: reglas y competencias definidas, más allá de las personas."], ["¿Cómo funciona el sistema político de Easton?", "Inputs (demandas) se procesan en outputs (decisiones), generando feedback que reingresa como nuevas demandas."], ["¿Diferencias entre Estado, gobierno y nación?", "Estado: estructura permanente. Gobierno: autoridades temporales. Nación: comunidad identitaria."], ["¿Diferencias entre poder, autoridad y legitimidad?", "Poder: capacidad de influir. Autoridad: poder reconocido válido. Legitimidad: creencia de que es justificable."], ["¿Cómo aplicar estos conceptos a la política paraguaya?", "Analizando recursos de la Presidencia, mayorías en el Congreso, partidos y participación social, sin reducir el análisis a personas."]]}, {"id": "u2", "title": "Unidad II", "subtitle": "El análisis de la política", "intro": "Analizar científicamente la política exige comprobabilidad, explicación causal y distinguir hechos de valores (Bobbio). Se estudian las perspectivas normativa, empírica, comparada e histórica, el conflicto, el consenso y la teoría de las élites.", "glossary": [["Ciencia Política", "Disciplina que estudia sistemáticamente fenómenos de poder e instituciones."], ["Comprobabilidad", "Posibilidad de contrastar una afirmación con evidencia."], ["Élite", "Minoría que concentra posiciones o recursos relevantes de poder."], ["Circulación de élites", "Renovación y reemplazo de grupos dirigentes (Pareto)."], ["Ley de hierro de la oligarquía", "Las organizaciones tienden a desarrollar minorías dirigentes (Michels)."]], "repaso": [["¿Diferencia entre opinar sobre política y analizarla científicamente?", "Opinar es preferencia personal; analizar exige comprobabilidad, explicación causal y distinguir hechos de valores."], ["¿Condiciones para que un análisis político sea científico?", "Comprobabilidad, explicación causal y distinción entre hechos y valores (Bobbio)."], ["¿Por qué distinguir hechos de valores?", "Para no presentar preferencias personales como hechos demostrados."], ["¿Diferencia entre pregunta normativa y empírica?", "Normativa evalúa según valores; empírica observa y explica hechos."], ["¿Qué herramientas usa la perspectiva empírica?", "Métodos cuantitativos (estadísticas, encuestas) y cualitativos (entrevistas, estudios de caso)."], ["¿Qué aporta el método comparado?", "Contrastar casos para identificar similitudes, diferencias y patrones generales."], ["¿Por qué es importante el análisis histórico?", "Porque las estructuras actuales resultan de procesos anteriores; ayuda a distinguir cambio y continuidad."], ["¿Cómo aplicar las 4 perspectivas al voto obligatorio/voluntario?", "Normativa: libertad y deber cívico. Empírica: niveles de participación. Comparada: países distintos. Histórica: evolución del sufragio."], ["¿Por qué el conflicto es motor de la política?", "Revela demandas y desigualdades no atendidas, impulsando reformas."], ["¿Por qué es necesario el consenso en democracias plurales?", "Sin acuerdos mínimos, cada conflicto amenazaría la existencia misma del sistema."], ["¿Qué significa que conflicto y consenso sean dinámicos?", "Se combinan: el conflicto expresa tensiones, el consenso las canaliza con procedimientos."], ["¿Qué tensión existe entre democracia y élites?", "La democracia promete igualdad política, pero minorías organizadas concentran las decisiones."], ["¿Qué sostiene Mosca sobre la clase dirigente?", "Una minoría organizada gobierna sobre una mayoría menos organizada."], ["¿Qué es la circulación de las élites de Pareto?", "Las élites se renuevan y reemplazan, pero persiste la diferencia entre gobernantes y gobernados."], ["¿Qué es la ley de hierro de la oligarquía de Michels?", "Incluso organizaciones democráticas tienden a desarrollar minorías dirigentes."], ["¿Cómo limitar la concentración de poder de las élites?", "Mediante competencia electoral, alternancia, transparencia y controles institucionales."], ["¿Cuáles son los campos de la Ciencia Política?", "Teoría Política, Análisis institucional, Comportamiento político, Política comparada y Relaciones Internacionales."], ["¿Cómo estudiar un problema paraguayo con las 4 perspectivas?", "Aplicando enfoque normativo, empírico, comparado e histórico a un mismo fenómeno, como la abstención electoral."]]}, {"id": "u3", "title": "Unidad III", "subtitle": "Estado y sociedad. Poder y legitimidad", "intro": "El Estado y la sociedad son interdependientes. Se estudian las fuentes y caras del poder (Lukes), los tipos de dominación legítima de Weber y la noción de oposición leal.", "glossary": [["Estado moderno", "Organización política institucionalizada con capacidad de coerción legítima."], ["Grupo de interés", "Organización que influye en decisiones públicas sin competir por el gobierno."], ["Control de agenda", "Capacidad de determinar qué temas se discuten (segunda cara del poder de Lukes)."], ["Dominación legal-racional", "Autoridad basada en normas impersonales y procedimientos."], ["Oposición leal", "Oposición que compite con el gobierno pero acepta las reglas democráticas."]], "repaso": [["¿Por qué Estado y sociedad son ámbitos diferentes pero interdependientes?", "El Estado concentra instituciones y decisión; la sociedad produce demandas, conflictos e identidades."], ["¿Continuidad y discontinuidad del Estado moderno?", "Continuidad: el poder político ya existía antes. Discontinuidad: el Estado moderno tiene mayor escala e institucionalización."], ["¿Cómo cambió el protagonismo estatal desde el s. XIX?", "De Estado liberal limitado a Estado de Bienestar (1914-1970) y luego reformas de mercado desde 1980."], ["¿Efectos de la globalización sobre la soberanía?", "La soberanía ya no es absoluta: se comparten competencias mediante tratados y organismos internacionales."], ["¿Principales actores dentro del Estado y de la sociedad?", "Estado: gobierno, Parlamento, Judicial, FF.AA. Sociedad: ciudadanos, empresas, sindicatos, medios, movimientos."], ["¿Por qué los partidos tienen doble naturaleza?", "Nacen en la sociedad civil, pero al ganar elecciones ocupan instituciones estatales."], ["¿Qué son las élites políticas y por qué importa su circulación?", "Grupos reducidos con posiciones de mando; su renovación evita que el poder se cierre."], ["¿Diferencia entre partido político y grupo de interés?", "El partido compite por el gobierno; el grupo de interés influye sin competir directamente."], ["¿Por qué el poder no se reduce a coerción?", "También opera mediante incentivos, persuasión y reglas institucionales."], ["¿Las tres caras del poder de Lukes?", "Primera: decisiones visibles. Segunda: control de agenda. Tercera: influencia sobre preferencias y creencias."], ["¿Fuentes de poder económico, político e ideológico?", "Económico: recursos y capital. Político: instituciones y coerción legítima. Ideológico: conocimiento y medios."], ["¿Relación entre liderazgo y carisma?", "El carisma es una base de legitimidad que sostiene el liderazgo mediante devoción personal (Weber)."], ["¿Por qué obedecen las personas a una autoridad?", "Por miedo, costumbre, conveniencia, o porque creen que la autoridad tiene derecho legítimo a mandar."], ["¿Dominaciones tradicional, carismática y legal-racional de Weber?", "Tradicional: costumbre. Carismática: cualidades del líder. Legal-racional: normas impersonales."], ["¿Relación entre eficacia, efectividad y legitimidad?", "Ambas fortalecen la legitimidad, pero resultados no vuelven democrático a un régimen autoritario."], ["¿Qué significa que una oposición sea leal?", "Critica y compite con el gobierno, pero acepta las reglas democráticas fundamentales."], ["¿Cómo identificar fuentes de poder y legitimidad en Paraguay?", "Observando poder político, económico e ideológico y evaluando si se acepta el régimen democrático más allá del gobierno de turno."]]}, {"id": "u4", "title": "Unidad IV", "subtitle": "Estado, gobierno y nación", "intro": "Estado, gobierno y nación no son sinónimos. Se estudian los elementos del Estado, las formas de gobierno (presidencialismo, parlamentarismo, semipresidencialismo) y la evolución hacia el Estado de Bienestar.", "glossary": [["Estado", "Organización política y jurídica que ejerce autoridad soberana sobre población y territorio."], ["Gobierno", "Autoridades que dirigen temporalmente el Estado."], ["Presidencialismo", "El presidente tiene mandato propio, independiente del Legislativo."], ["Estado de Bienestar", "Modelo que amplia responsabilidades estatales en derechos sociales."]], "repaso": [["¿Por qué Estado, gobierno y nación no son sinónimos?", "Responden a preguntas distintas: organización permanente, autoridades temporales, y comunidad de identidad."], ["¿Elementos fundamentales del Estado?", "Territorio, población, poder político o soberanía, y orden jurídico."], ["¿Diferencia entre poder político y soberanía?", "Poder político: capacidad de decidir obligatoriamente. Soberanía: autoridad superior interna y externa."], ["¿Por qué el Estado permanece aunque cambie el gobierno?", "Sus instituciones y orden jurídico tienen continuidad independiente de quién gobierna."], ["¿Funciones del Estado contemporáneo?", "Orden, justicia, servicios públicos, representación internacional, desarrollo económico y cohesión social."], ["¿Diferencia entre gobierno y administración pública?", "Gobierno define prioridades políticas; administración ejecuta y presta servicios técnicos."], ["¿Presidencialismo, parlamentarismo y semipresidencialismo?", "Presidencial: mandato fijo. Parlamentario: depende de confianza legislativa. Semipresidencial: combina ambos."], ["¿Por qué una nación puede existir sin Estado propio?", "Su dimensión es subjetiva e histórica (identidad, cultura), no depende de instituciones soberanas."], ["¿Puede un Estado contener varias identidades nacionales?", "Sí, muchos Estados son plurinacionales o multiculturales."], ["¿Características del Estado liberal clásico?", "Limitado, garantiza seguridad, propiedad y libertades civiles, como reacción al absolutismo."], ["¿Por qué se amplian funciones con el Estado de Bienestar?", "La igualdad jurídica no bastaba frente a desigualdades económicas de la industrialización."], ["¿Cómo cambia la ciudadanía con derechos sociales?", "Se añade una dimensión social (educación, salud) junto a derechos civiles y políticos."], ["¿Argumentos a favor y en contra de mayor intervención estatal?", "A favor: reduce desigualdad. En contra: costo fiscal, burocratización e ineficiencia."], ["¿Por qué el debate no es solo 'más o menos Estado'?", "Lo relevante es la calidad de la intervención: qué resuelve y cómo se financia."], ["¿Cómo aplicar Estado, gobierno y nación al caso paraguayo?", "Paraguay es el Estado con Constitución; los gobiernos se suceden; la nación es la identidad compartida."]]}, {"id": "u5", "title": "Unidad V", "subtitle": "Sistema político", "intro": "El sistema político incluye las interacciones entre Estado y sociedad. Se estudian el modelo de Easton, los regímenes autoritarios y totalitarios, el golpe de Estado y los procesos de transición y consolidación democrática.", "glossary": [["Sistema político", "Interacciones por las que se procesan demandas y se producen decisiones."], ["Golpe de Estado", "Toma no constitucional del poder mediante ruptura rápida del orden vigente."], ["Democratización", "Proceso de establecimiento de competencia y derechos democráticos."], ["Consolidación democrática", "Estabilización institucional y legitimación de las reglas democráticas."]], "repaso": [["¿Qué aporta la definición de Estado de Max Weber?", "Define al Estado por el monopolio legítimo de la coerción física, no por sus funciones."], ["¿Por qué Estado y sistema político no son sinónimos?", "El Estado es la estructura permanente; el sistema político incluye las interacciones dinámicas con la sociedad."], ["¿Modelo de inputs, outputs y feedback de Easton?", "Demandas ingresan (inputs), se procesan en decisiones (outputs), generando feedback social."], ["¿Diferencia entre régimen democrático, autoritario y totalitario?", "Democrático: pluralismo y alternancia. Autoritario: poder concentrado. Totalitario: control total de la sociedad."], ["¿Por qué la represión no es el único sostén autoritario?", "Se combina con clientelismo, control de medios y legitimación ideológica."], ["¿Variables para analizar sistemas autoritarios?", "Número de actores, justificación ideológica, movilización e institucionalización."], ["¿Diferencia entre golpe de Estado y revolución?", "El golpe es una ruptura rápida por un grupo reducido; la revolución implica movilización social amplia."], ["¿Factores que favorecen rupturas autoritarias?", "Crisis económica, desigualdad, debilidad institucional y polarización, sin ser causas únicas."], ["¿Diferencia entre liberalización y democratización?", "Liberalización: apertura parcial de libertades. Democratización: cambio real de las reglas de acceso al poder."], ["¿Qué actores intervienen en una transición política?", "Sectores duros y blandos del régimen, oposición moderada y radical, Fuerzas Armadas y ciudadanía."], ["¿Diferencia entre instauración, consolidación y persistencia?", "Instauración crea instituciones; consolidación las legitima; persistencia es mantenerse en el tiempo."], ["¿Por qué la legitimidad es clave para la consolidación?", "Los actores deben aceptar resolver disputas dentro de las instituciones democráticas, aun perdiendo."], ["¿Cómo aplicar transición y consolidación al caso paraguayo?", "La dictadura de Stroessner (1954-1989) dio paso a la transición y la Constitución de 1992."]]}, {"id": "u6", "title": "Unidad VI", "subtitle": "Ideologías políticas", "intro": "Las ideologías interpretan la realidad política y proponen normas de acción. Se estudian liberalismo, conservadurismo, socialismo, marxismo, nacionalismo y los nuevos ejes ideológicos contemporáneos.", "glossary": [["Ideología", "Conjunto organizado de ideas que interpreta la realidad política."], ["Plusvalor", "Diferencia entre el valor producido y el salario, apropiada por el capitalista (Marx)."], ["Nacionalismo", "Ideología que coloca a la nación como comunidad política fundamental."], ["Populismo", "Lógica política que opone al pueblo frente a las élites."]], "repaso": [["¿Por qué el liberalismo es una doctrina de limitación del poder?", "Busca impedir el poder arbitrario del Estado, vinculándose al constitucionalismo y la división de poderes."], ["¿Diferencia entre igualdad jurídica e igualdad social?", "Jurídica: igual sometimiento a la ley. Social: condiciones materiales más equitativas."], ["¿Diferencia entre Hobbes y Locke sobre el Estado?", "Hobbes: soberano fuerte contra la inseguridad. Locke: Estado limitado para proteger derechos previos."], ["¿Por qué el conservadurismo valora la tradición?", "Considera que las instituciones condensan experiencia histórica acumulada."], ["¿Qué distingue al socialismo del marxismo?", "El socialismo es amplio y puede ser reformista; el marxismo explica la historia por la lucha de clases."], ["¿Qué son plusvalor y alienación en Marx?", "Plusvalor: diferencia entre valor producido y salario. Alienación: pérdida de control sobre el propio trabajo."], ["¿Por qué el nacionalismo puede ser de izquierda o derecha?", "Responde a quién constituye la comunidad política, combinándose con otras ideologías."], ["¿Diferencia entre nación política, cultural y jurídica?", "Política: ciudadanía común. Cultural: lengua y tradiciones. Jurídica: pertenencia formal a un Estado."], ["¿Por qué el eje izquierda-derecha es insuficiente?", "Los conflictos actuales combinan ejes económico, sociocultural, territorial e institucional."], ["¿Nuevos ejes de conflicto ideológico contemporáneo?", "Económico (Estado/mercado), sociocultural, territorial (soberanía/globalismo) e institucional (democracia/autoritarismo)."]]}];
let cur=0;
function renderNav(){
  document.getElementById('nav').innerHTML = UNITS.map((u,i)=>`<div class="nav-unit ${i===cur?'active':''}" onclick="load(${i})">${u.title}: ${u.subtitle}</div>`).join('');
}
function render(){
  const u=UNITS[cur];
  document.getElementById('frame').innerHTML = `<h1>${u.title}</h1><p><b>${u.subtitle}</b></p><p>${u.intro}</p>`;
  hide();
}
function load(i){cur=i;renderNav();render();}
function showTool(k){
  hide();
  const u=UNITS[cur];
  if(k==='g'){document.getElementById('pg').style.display='block';document.getElementById('lg').innerHTML=u.glossary.map(g=>`<div class="pill" onclick="alert('${g[0].replace(/'/g,"\\'")}: ${g[1].replace(/'/g,"\\'")}')">🔑 ${g[0]}</div>`).join('');}
  else if(k==='f'){document.getElementById('pf').style.display='block';document.getElementById('lf').innerHTML=u.glossary.map((g,i)=>`<div class="card" id="c${i}" data-t="${g[0]}" data-d="${g[1].replace(/"/g,'&quot;')}" data-fl="0" onclick="flip(${i})">${g[0]}</div>`).join('');}
  else if(k==='r'){document.getElementById('pr').style.display='block';document.getElementById('lr').innerHTML=`<div class="cnt">${u.repaso.length} preguntas — ${u.title}</div>`+u.repaso.map((qa,i)=>`<div class="rp"><div class="rp-q" onclick="tg(${i})">${i+1}. ${qa[0]}</div><div class="rp-a" id="a${i}">${qa[1]}</div></div>`).join('');}
}
function tg(i){document.getElementById('a'+i).classList.toggle('open');}
function hide(){['pg','pf','pr'].forEach(id=>document.getElementById(id).style.display='none');}
