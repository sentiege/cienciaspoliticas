<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ICP · Guía Completa I-VI · Lectura + 95 Preguntas</title>
<style>
:root{--bg:#F8F9FA;--card:#fff;--text:#212529;--brand:#0F172A;--accent:#1E3A8A;--soft:#EFF6FF;--border:#E2E8F0;--muted:#64748B;}
[data-theme="dark"]{--bg:#1A202C;--card:#232B3A;--text:#E2E8F0;--brand:#0B1220;--accent:#60A5FA;--soft:#1E293B;--border:#334155;--muted:#94A3B8;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Roboto,Inter,sans-serif;background:var(--bg);color:var(--text);display:grid;grid-template-columns:250px 1fr 320px;height:100vh;overflow:hidden;}
header{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--brand);color:#fff;}
header button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;}
.layout{grid-column:1/4;display:grid;grid-template-columns:250px 1fr 320px;overflow:hidden;}
aside.left{background:var(--card);border-right:1px solid var(--border);padding:16px;overflow-y:auto;}
.nav-unit{padding:9px;border-radius:6px;cursor:pointer;font-size:12.5px;margin-bottom:5px;color:var(--text);}
.nav-unit:hover{background:var(--soft);}
.nav-unit.active{background:var(--accent);color:#fff;font-weight:600;}
main{overflow-y:auto;padding:34px 46px;}
.frame{max-width:720px;margin:0 auto;}
.frame h1{font-family:Georgia,serif;color:var(--accent);font-size:26px;margin-bottom:14px;}
.frame h2{font-family:Georgia,serif;color:var(--accent);font-size:18px;margin-top:26px;}
.frame p{font-size:16.5px;line-height:1.65;margin-bottom:16px;}
.frame table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px;}
.frame td,.frame th{border:1px solid var(--border);padding:6px 8px;text-align:left;}
.frame th{background:var(--soft);}
blockquote{border-left:4px solid var(--accent);background:var(--soft);margin:16px 0;padding:12px 16px;font-style:italic;font-size:14.5px;}
blockquote span{display:block;margin-top:6px;font-style:normal;font-size:11.5px;color:var(--muted);}
aside.right{background:var(--card);border-left:1px solid var(--border);padding:16px;overflow-y:auto;}
.tool-title{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;}
.btn{display:block;width:100%;padding:9px;margin-bottom:8px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;}
.pill{background:var(--soft);border:1px solid var(--border);color:var(--accent);padding:7px 9px;border-radius:6px;font-size:12px;margin-bottom:6px;cursor:pointer;}
.card{background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:14px;min-height:70px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:12.5px;margin-bottom:8px;}
.rp{border:1px solid var(--border);border-radius:8px;margin-bottom:6px;overflow:hidden;}
.rp-q{padding:9px 10px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--bg);}
.rp-a{padding:0 10px;font-size:12px;color:var(--muted);max-height:0;overflow:hidden;background:var(--soft);transition:max-height .2s,padding .2s;}
.rp-a.open{padding:9px 10px;max-height:260px;}
.panel{display:none;}
.close{float:right;cursor:pointer;color:var(--muted);font-size:11px;}
.cnt{font-size:11px;color:var(--muted);margin-bottom:8px;}
</style>
</head>

<header>
  <div>📚 Introducción a las Ciencias Políticas — Guía Completa (Unidades I-VI)</div>
  <button onclick="document.body.setAttribute('data-theme', document.body.getAttribute('data-theme')==='dark'?'light':'dark')">🌙 Modo Noche</button>
</header>

    <div class="panel" id="pg"><span class="close" onclick="hide()">✕</span><div class="tool-title">Glosario</div><div id="lg"></div></div>
    <div class="panel" id="pf"><span class="close" onclick="hide()">✕</span><div class="tool-title">Flashcards</div><div id="lf"></div></div>

  </aside>
</div>
<script>
const UNITS = [{"id": "u1", "title": "Unidad I", "subtitle": "La política como poder y como participación", "sections": [{"h": "1. ¿Qué es la política?", "p": ["Existe política allí donde una colectividad debe decidir cómo organizarse, distribuir recursos, procesar conflictos y establecer reglas comunes. La política no comienza con una elección: comienza cuando aparecen relaciones de poder y decisiones que afectan a otros.", "Aristóteles sostuvo que el ser humano es un animal político: vive en comunidad y desarrolla su existencia dentro de formas de organización colectiva. Max Weber vinculó la política con la dirección o influencia sobre la dirección de una asociación política, especialmente el Estado."], "q": {"t": "La política es el proceso mediante el cual una sociedad organiza el poder, procesa sus conflictos, construye representación, adopta decisiones colectivas y define reglas para convivir.", "c": "Manual de Unidad I"}}, {"h": "2. La política como poder", "p": ["El poder es la capacidad de influir sobre conductas o decisiones. Se distinguen tres formas: coerción (fuerza o amenaza de sanción), persuasión (ideas, discursos, prestigio) y autoridad legítima (reconocimiento del derecho a decidir)."], "tb": [["Forma", "Fundamento", "Ejemplo"], ["Coerción", "Fuerza o amenaza de sanción", "Cumplimiento ante una sanción prevista"], ["Persuasión", "Ideas, prestigio, negociación", "Movimiento que instala un tema en la agenda"], ["Autoridad legítima", "Reconocimiento del derecho a decidir", "Sentencia de un juez competente"]]}, {"h": "3. Tres miradas sobre el poder: Weber, Arendt y Foucault", "p": ["Max Weber distingue autoridad tradicional, carismática y legal-racional. Hannah Arendt distingue poder y violencia: el poder surge de la capacidad humana de actuar conjuntamente. Michel Foucault sostiene que el poder circula a través de redes sociales y no solo reprime, también produce saberes y conductas."]}, {"h": "6. La política como participación", "p": ["Participar significa intentar incidir, opinar, decidir u organizarse respecto de cuestiones públicas. Las formas institucionales (voto, militancia, peticiones) se distinguen de las no institucionales (marchas, protestas, campañas digitales)."], "tb": [["Participación institucional", "Participación no institucional"], ["Voto y elecciones", "Marchas y protestas"], ["Partidos y candidaturas", "Campañas digitales"], ["Peticiones y audiencias públicas", "Movimientos sociales"]]}, {"h": "9. Liderazgo transaccional y transformacional", "p": ["James MacGregor Burns distingue el liderazgo transaccional (intercambios concretos, negociación de intereses) del liderazgo transformacional (modifica valores, expectativas y objetivos colectivos)."]}, {"h": "14.1 Democracia delegativa", "p": ["Guillermo O'Donnell utiliza el concepto de democracia delegativa para analizar presidentes electos que interpretan su victoria como una autorización amplia para gobernar con restricciones institucionales débiles."], "q": {"t": "Elección democrática no equivale a poder ilimitado.", "c": "Unidad I, sección 14"}}, {"h": "17. El sistema político (David Easton)", "p": ["Easton propone analizar la política como un sistema: la sociedad genera inputs (demandas y apoyos), el sistema político los procesa y produce outputs (decisiones, leyes, políticas públicas), y la sociedad genera feedback que reingresa como nuevas demandas."]}], "glossary": [["Política", "Proceso mediante el cual una sociedad organiza el poder y adopta decisiones colectivas."], ["Poder", "Capacidad de influir sobre conductas o decisiones."], ["Autoridad", "Poder reconocido como válido para adoptar decisiones."], ["Legitimidad", "Creencia de que el ejercicio del poder es válido o justificable."], ["Liderazgo transaccional", "Conducción basada en negociación e intercambios concretos."], ["Liderazgo transformacional", "Conducción orientada a modificar valores y objetivos colectivos."], ["Clientelismo", "Intercambio particularizado de beneficios por apoyo político."], ["Democracia delegativa", "El presidente interpreta la elección como delegación amplia (O'Donnell)."], ["Sistema político", "Instituciones y relaciones mediante las cuales se organiza el poder."]], "repaso": [["¿Por qué la política no puede reducirse a elecciones, partidos o cargos públicos?", "Porque existe política donde hay relaciones de poder y decisiones que afectan a otros, no solo en elecciones o cargos formales."], ["¿Qué significa definir la política a partir del poder y la participación?", "Permite preguntar quién decide e influye (poder) y cómo interviene la ciudadanía en los asuntos comunes (participación)."], ["¿Qué diferencias existen entre coerción, influencia y autoridad legítima?", "Coerción usa fuerza o amenaza de sanción; la persuasión usa ideas y prestigio; la autoridad legítima se acepta porque se reconoce el derecho a decidir."], ["¿Cómo se diferencian las miradas de Weber, Arendt y Foucault sobre el poder?", "Weber analiza legitimidad y tipos de autoridad; Arendt distingue poder de violencia; Foucault ve el poder circulando en redes sociales, no solo en el Estado."], ["¿Por qué tener poder no equivale necesariamente a ejercerlo?", "Porque poseer recursos no garantiza usarlos con éxito: el poder se hace observable cuando efectivamente se decide, influye o transforma algo."], ["¿Puede una persona sin cargo público ejercer poder político? Fundamente.", "Sí, mediante visibilidad, prestigio y comunicación (caso Taylor Swift), evitando confundir influencia con causalidad directa."], ["¿Qué formas institucionales y no institucionales de participación existen?", "Institucionales: voto, militancia, peticiones. No institucionales: marchas, protestas, campañas digitales."], ["¿Qué diferencia existe entre inclusión formal e inclusión efectiva en la política?", "Formal es poseer el derecho; efectiva es contar con condiciones reales (educación, recursos) para ejercerlo."], ["¿Por qué liderazgo y autoridad no son sinónimos?", "La autoridad formal no garantiza adhesión; el liderazgo requiere capacidad real de movilizar a otros."], ["¿Qué papel cumplen los seguidores y el contexto en el liderazgo?", "Los seguidores aportan apoyo y movilización; el contexto crea oportunidades o restricciones."], ["¿Diferencia entre liderazgo transaccional y transformacional?", "Transaccional: intercambios concretos. Transformacional: modifica valores y objetivos colectivos."], ["¿Qué limita la visión tradicional del 'gran hombre'?", "Ignora que sin seguidores no hay liderazgo y oculta liderazgos colectivos y de grupos excluidos."], ["¿Cómo se distinguen caudillismo, personalismo, clientelismo y patronazgo?", "Caudillismo: autoridad personal territorial. Personalismo: centralidad del líder. Clientelismo: beneficios por apoyo. Patronazgo: uso de cargos estatales."], ["¿Qué preguntan Platón, Aristóteles, Maquiavelo y Weber sobre el gobierno?", "Platón: filósofo-rey. Aristóteles: bien común vs. interés propio. Maquiavelo: virtud y fortuna. Weber: por qué obedecemos."], ["¿Características del liderazgo presidencial, carismático, partidario e intelectual?", "Presidencial: legitimidad electoral. Carismático: vínculo emocional. Partidario: organización interna. Intelectual: influencia de ideas."], ["¿Por qué una victoria electoral no implica poder ilimitado?", "Porque el gobierno sigue sometido a la Constitución, separación de poderes y controles institucionales."], ["¿Qué es la democracia delegativa de O'Donnell?", "El presidente interpreta su victoria como autorización amplia y debilita controles institucionales."], ["¿Diferencia entre lógica personalista y lógica institucional?", "Personalista: lealtades al líder. Institucional: reglas y competencias definidas, más allá de las personas."], ["¿Cómo funciona el sistema político de Easton?", "Inputs (demandas) se procesan en outputs (decisiones), generando feedback que reingresa como nuevas demandas."], ["¿Diferencias entre Estado, gobierno y nación?", "Estado: estructura permanente. Gobierno: autoridades temporales. Nación: comunidad identitaria."], ["¿Diferencias entre poder, autoridad y legitimidad?", "Poder: capacidad de influir. Autoridad: poder reconocido válido. Legitimidad: creencia de que es justificable."], ["¿Cómo aplicar estos conceptos a la política paraguaya?", "Analizando recursos de la Presidencia, mayorías en el Congreso, partidos y participación social, sin reducir el análisis a personas."]]}, {"id": "u2", "title": "Unidad II", "subtitle": "El análisis de la política", "sections": [{"h": "1.1 ¿Cuándo un análisis político es científico?", "p": ["Siguiendo a Norberto Bobbio, se destacan tres exigencias: comprobabilidad (las afirmaciones deben poder contrastarse con evidencia), explicación (identificar causas, actores e intereses) y distinguir hechos y valores."], "q": {"t": "La objetividad no significa que el investigador carezca de valores personales, sino que debe evitar presentar sus preferencias como si fueran hechos demostrados.", "c": "Manual de Unidad II"}}, {"h": "2. Describir, explicar y evaluar", "tb": [["Tipo de pregunta", "Ejemplo", "Qué busca"], ["Normativa", "¿La decisión es justa?", "Evaluar según valores o principios"], ["Empírica", "¿Qué está ocurriendo realmente?", "Observar y explicar hechos"], ["Comparada", "¿Qué ocurrió en otros países?", "Identificar similitudes y patrones"], ["Histórica", "¿Cómo llegamos hasta acá?", "Reconstruir procesos en el tiempo"]]}, {"h": "9-10. Conflicto y consenso", "p": ["El conflicto expresa demandas y tensiones; el consenso proporciona procedimientos para canalizarlas. John Rawls utiliza la idea de consenso traslapado para explicar cómo personas con concepciones morales distintas pueden coincidir en principios políticos fundamentales."]}, {"h": "12. El surgimiento de las élites", "p": ["Gaetano Mosca sostiene que una minoría organizada (clase dirigente) gobierna sobre una mayoría menos organizada. Vilfredo Pareto propone la circulación de las élites: los grupos dominantes se renuevan pero persiste la diferencia entre gobernantes y gobernados. Robert Michels formula la ley de hierro de la oligarquía: incluso organizaciones democráticas tienden a desarrollar minorías dirigentes."], "tb": [["Autor", "Concepto central", "Idea principal"], ["Gaetano Mosca", "Clase dirigente", "Una minoría organizada gobierna sobre una mayoría menos organizada"], ["Vilfredo Pareto", "Circulación de élites", "Las élites se renuevan, pero persisten minorías dominantes"], ["Robert Michels", "Ley de hierro de la oligarquía", "Las organizaciones tienden a concentrar dirección en una minoría"]]}, {"h": "14. Campos de la Ciencia Política", "tb": [["Campo", "Objeto principal"], ["Teoría Política", "Conceptos, valores e ideas"], ["Análisis institucional", "Instituciones y reglas"], ["Comportamiento político", "Ciudadanía y participación"], ["Política comparada", "Comparación entre sistemas"], ["Relaciones Internacionales", "Política entre Estados y actores"]]}], "glossary": [["Ciencia Política", "Disciplina que estudia sistemáticamente fenómenos de poder e instituciones."], ["Comprobabilidad", "Posibilidad de contrastar una afirmación con evidencia."], ["Conflicto político", "Disputa derivada de diferencias de intereses o valores."], ["Consenso", "Acuerdo mínimo que permite la convivencia política."], ["Élite", "Minoría que concentra posiciones o recursos relevantes de poder."], ["Circulación de élites", "Renovación y reemplazo de grupos dirigentes (Pareto)."], ["Ley de hierro de la oligarquía", "Las organizaciones tienden a desarrollar minorías dirigentes (Michels)."]], "repaso": [["¿Diferencia entre opinar sobre política y analizarla científicamente?", "Opinar es preferencia personal; analizar exige comprobabilidad, explicación causal y distinguir hechos de valores."], ["¿Condiciones para que un análisis político sea científico?", "Comprobabilidad, explicación causal y distinción entre hechos y valores (Bobbio)."], ["¿Por qué distinguir hechos de valores?", "Para no presentar preferencias personales como hechos demostrados."], ["¿Diferencia entre pregunta normativa y empírica?", "Normativa evalúa según valores; empírica observa y explica hechos."], ["¿Qué herramientas usa la perspectiva empírica?", "Métodos cuantitativos (estadísticas, encuestas) y cualitativos (entrevistas, estudios de caso)."], ["¿Qué aporta el método comparado?", "Contrastar casos para identificar similitudes, diferencias y patrones generales."], ["¿Por qué es importante el análisis histórico?", "Porque las estructuras actuales resultan de procesos anteriores; ayuda a distinguir cambio y continuidad."], ["¿Cómo aplicar las 4 perspectivas al voto obligatorio/voluntario?", "Normativa: libertad y deber cívico. Empírica: niveles de participación. Comparada: países distintos. Histórica: evolución del sufragio."], ["¿Por qué el conflicto es motor de la política?", "Revela demandas y desigualdades no atendidas, impulsando reformas."], ["¿Por qué es necesario el consenso en democracias plurales?", "Sin acuerdos mínimos, cada conflicto amenazaría la existencia misma del sistema."], ["¿Qué significa que conflicto y consenso sean dinámicos?", "Se combinan: el conflicto expresa tensiones, el consenso las canaliza con procedimientos."], ["¿Qué tensión existe entre democracia y élites?", "La democracia promete igualdad política, pero minorías organizadas concentran las decisiones."], ["¿Qué sostiene Mosca sobre la clase dirigente?", "Una minoría organizada gobierna sobre una mayoría menos organizada."], ["¿Qué es la circulación de las élites de Pareto?", "Las élites se renuevan y reemplazan, pero persiste la diferencia entre gobernantes y gobernados."], ["¿Qué es la ley de hierro de la oligarquía de Michels?", "Incluso organizaciones democráticas tienden a desarrollar minorías dirigentes."], ["¿Cómo limitar la concentración de poder de las élites?", "Mediante competencia electoral, alternancia, transparencia y controles institucionales."], ["¿Cuáles son los campos de la Ciencia Política?", "Teoría Política, Análisis institucional, Comportamiento político, Política comparada y Relaciones Internacionales."], ["¿Cómo estudiar un problema paraguayo con las 4 perspectivas?", "Aplicando enfoque normativo, empírico, comparado e histórico a un mismo fenómeno, como la abstención electoral."]]}, {"id": "u3", "title": "Unidad III", "subtitle": "Estado y sociedad. Poder y legitimidad", "sections": [{"h": "1. Estado y sociedad", "p": ["El Estado y la sociedad son conceptos diferentes pero inseparables. El Estado surge históricamente de la sociedad, pero una vez institucionalizado también la organiza y transforma: establece reglas, recauda recursos, presta servicios y regula actividades."]}, {"h": "5.1-5.2 Élites políticas y grupos de interés", "p": ["Las élites políticas son grupos reducidos que ocupan posiciones de mando. Los grupos de interés (sindicatos, gremios, ONG) buscan influir sobre decisiones estatales sin competir directamente por el gobierno, mediante lobby, movilización y negociación institucional."]}, {"h": "6-7. ¿Qué es el poder? Las tres caras de Lukes", "p": ["Steven Lukes propone tres niveles de visibilidad del poder: la primera cara son decisiones abiertas y conflictos visibles; la segunda cara es el control de la agenda (decidir qué se discute); la tercera cara es influir sobre las preferencias y creencias de las personas."], "tb": [["Cara del poder", "Pregunta", "Manifestación"], ["Primera", "¿Quién gana una decisión visible?", "Conflictos, votaciones y decisiones abiertas"], ["Segunda", "¿Quién decide qué se discute?", "Control de agenda y exclusión de temas"], ["Tercera", "¿Quién influye sobre lo normal?", "Cultura, valores, discursos y preferencias"]], "q": {"t": "El poder no siempre aparece en una orden directa ni en una decisión observable: puede actuar sobre la forma en que las personas interpretan sus intereses y el mundo político.", "c": "Steven Lukes — Unidad III"}}, {"h": "10-10.1. Obediencia y legitimidad: los tipos de Weber", "p": ["Max Weber distingue tres tipos ideales de dominación legítima: tradicional (costumbre y herencia), carismática (cualidades extraordinarias del líder) y legal-racional (normas y procedimientos impersonales, propia de la burocracia y el Estado moderno)."], "tb": [["Tipo", "Base de legitimidad", "Se obedece a"], ["Tradicional", "Costumbre y herencia", "Autoridad legitimada por la tradición"], ["Carismática", "Cualidades extraordinarias del líder", "Persona del líder"], ["Legal-racional", "Normas y procedimientos impersonales", "Cargo y orden jurídico"]]}, {"h": "11.1 La oposición leal", "p": ["Una democracia necesita oposición, pero también requiere que quienes pierden una elección continúen reconociendo la legitimidad del sistema. La oposición leal critica y compite con el gobierno, pero acepta las reglas fundamentales de la democracia."]}], "glossary": [["Estado moderno", "Organización política institucionalizada con coerción legítima."], ["Sociedad civil", "Individuos y organizaciones no estatales."], ["Grupo de interés", "Organización que influye en decisiones sin competir por el gobierno."], ["Control de agenda", "Determinar qué temas se discuten (2ª cara del poder, Lukes)."], ["Poder ideológico", "Influencia sobre valores, símbolos y preferencias."], ["Carisma", "Autoridad fundada en cualidades extraordinarias del líder."], ["Dominación legal-racional", "Autoridad basada en normas impersonales."], ["Oposición leal", "Compite con el gobierno pero acepta las reglas democráticas."]], "repaso": [["¿Por qué Estado y sociedad son ámbitos diferentes pero interdependientes?", "El Estado concentra instituciones y decisión; la sociedad produce demandas, conflictos e identidades."], ["¿Continuidad y discontinuidad del Estado moderno?", "Continuidad: el poder político ya existía antes. Discontinuidad: el Estado moderno tiene mayor escala e institucionalización."], ["¿Cómo cambió el protagonismo estatal desde el s. XIX?", "De Estado liberal limitado a Estado de Bienestar (1914-1970) y luego reformas de mercado desde 1980."], ["¿Efectos de la globalización sobre la soberanía?", "La soberanía ya no es absoluta: se comparten competencias mediante tratados y organismos internacionales."], ["¿Principales actores dentro del Estado y de la sociedad?", "Estado: gobierno, Parlamento, Judicial, FF.AA. Sociedad: ciudadanos, empresas, sindicatos, medios, movimientos."], ["¿Por qué los partidos tienen doble naturaleza?", "Nacen en la sociedad civil, pero al ganar elecciones ocupan instituciones estatales."], ["¿Qué son las élites políticas y por qué importa su circulación?", "Grupos reducidos con posiciones de mando; su renovación evita que el poder se cierre."], ["¿Diferencia entre partido político y grupo de interés?", "El partido compite por el gobierno; el grupo de interés influye sin competir directamente."], ["¿Por qué el poder no se reduce a coerción?", "También opera mediante incentivos, persuasión y reglas institucionales."], ["¿Las tres caras del poder de Lukes?", "Primera: decisiones visibles. Segunda: control de agenda. Tercera: influencia sobre preferencias y creencias."], ["¿Fuentes de poder económico, político e ideológico?", "Económico: recursos y capital. Político: instituciones y coerción legítima. Ideológico: conocimiento y medios."], ["¿Relación entre liderazgo y carisma?", "El carisma es una base de legitimidad que sostiene el liderazgo mediante devoción personal (Weber)."], ["¿Por qué obedecen las personas a una autoridad?", "Por miedo, costumbre, conveniencia, o porque creen que la autoridad tiene derecho legítimo a mandar."], ["¿Dominaciones tradicional, carismática y legal-racional de Weber?", "Tradicional: costumbre. Carismática: cualidades del líder. Legal-racional: normas impersonales."], ["¿Relación entre eficacia, efectividad y legitimidad?", "Ambas fortalecen la legitimidad, pero resultados no vuelven democrático a un régimen autoritario."], ["¿Qué significa que una oposición sea leal?", "Critica y compite con el gobierno, pero acepta las reglas democráticas fundamentales."], ["¿Cómo identificar fuentes de poder y legitimidad en Paraguay?", "Observando poder político, económico e ideológico y evaluando si se acepta el régimen democrático más allá del gobierno de turno."]]}, {"id": "u4", "title": "Unidad IV", "subtitle": "Estado, gobierno y nación", "sections": [{"h": "1. Tres conceptos que no son sinónimos", "p": ["El Estado responde a la pregunta sobre cuál es la organización institucional y jurídica que ejerce autoridad. El gobierno responde a quién conduce temporalmente esa organización. La nación responde a quiénes se reconocen como una comunidad con vínculos de pertenencia."], "q": {"t": "Si mañana cambia completamente el gobierno paraguayo, el Estado paraguayo no desaparece. Sus instituciones, territorio, población, orden jurídico y personalidad internacional continúan existiendo.", "c": "Manual de Unidad IV"}}, {"h": "5. Formas de gobierno", "p": ["El presidencialismo tiene un presidente con mandato fijo e independiente del Legislativo (caso paraguayo). El parlamentarismo hace depender al gobierno de la confianza parlamentaria. El semipresidencialismo combina presidente electo y primer ministro responsable ante el Parlamento."], "tb": [["Modelo", "Ejecutivo", "Relación con el Legislativo"], ["Presidencialismo", "Presidente elegido separadamente", "Mandato fijo e independencia de origen"], ["Parlamentarismo", "Primer ministro de mayoría parlamentaria", "Depende de confianza parlamentaria"], ["Semipresidencialismo", "Presidente + primer ministro", "Ejecutivo dual"]]}, {"h": "7. Del Estado liberal clásico al Estado de Bienestar", "p": ["El Estado liberal se construyó contra el absolutismo, enfatizando derechos civiles y libertad económica. La industrialización mostró nuevas desigualdades, lo que impulsó el Estado de Bienestar: salud, educación, seguridad social y protección laboral como responsabilidades públicas."]}, {"h": "8. La transformación de la ciudadanía", "tb": [["Dimensión de ciudadanía", "Ejemplos"], ["Derechos civiles", "Libertad personal, expresión, propiedad, igualdad ante la ley"], ["Derechos políticos", "Sufragio, participación, representación"], ["Derechos sociales", "Educación, salud, seguridad social, protección laboral"]]}, {"h": "11. El caso paraguayo", "p": ["La Constitución de 1992 organiza jurídicamente al Estado paraguayo con una forma de gobierno democrática, representativa, participativa y pluralista, bajo un modelo presidencial."]}], "glossary": [["Estado", "Organización política y jurídica soberana sobre población y territorio."], ["Gobierno", "Autoridades que dirigen temporalmente el Estado."], ["Nación", "Comunidad con vínculos de pertenencia e identidad."], ["Soberanía", "Autoridad política superior dentro del territorio."], ["Presidencialismo", "El presidente tiene mandato propio e independiente del Legislativo."], ["Parlamentarismo", "El Ejecutivo depende de la confianza parlamentaria."], ["Estado de Bienestar", "Amplía responsabilidades estatales en derechos sociales."]], "repaso": [["¿Por qué Estado, gobierno y nación no son sinónimos?", "Responden a preguntas distintas: organización permanente, autoridades temporales, y comunidad de identidad."], ["¿Elementos fundamentales del Estado?", "Territorio, población, poder político o soberanía, y orden jurídico."], ["¿Diferencia entre poder político y soberanía?", "Poder político: capacidad de decidir obligatoriamente. Soberanía: autoridad superior interna y externa."], ["¿Por qué el Estado permanece aunque cambie el gobierno?", "Sus instituciones y orden jurídico tienen continuidad independiente de quién gobierna."], ["¿Funciones del Estado contemporáneo?", "Orden, justicia, servicios públicos, representación internacional, desarrollo económico y cohesión social."], ["¿Diferencia entre gobierno y administración pública?", "Gobierno define prioridades políticas; administración ejecuta y presta servicios técnicos."], ["¿Presidencialismo, parlamentarismo y semipresidencialismo?", "Presidencial: mandato fijo. Parlamentario: depende de confianza legislativa. Semipresidencial: combina ambos."], ["¿Por qué una nación puede existir sin Estado propio?", "Su dimensión es subjetiva e histórica (identidad, cultura), no depende de instituciones soberanas."], ["¿Puede un Estado contener varias identidades nacionales?", "Sí, muchos Estados son plurinacionales o multiculturales."], ["¿Características del Estado liberal clásico?", "Limitado, garantiza seguridad, propiedad y libertades civiles, como reacción al absolutismo."], ["¿Por qué se amplian funciones con el Estado de Bienestar?", "La igualdad jurídica no bastaba frente a desigualdades económicas de la industrialización."], ["¿Cómo cambia la ciudadanía con derechos sociales?", "Se añade una dimensión social (educación, salud) junto a derechos civiles y políticos."], ["¿Argumentos a favor y en contra de mayor intervención estatal?", "A favor: reduce desigualdad. En contra: costo fiscal, burocratización e ineficiencia."], ["¿Por qué el debate no es solo 'más o menos Estado'?", "Lo relevante es la calidad de la intervención: qué resuelve y cómo se financia."], ["¿Cómo aplicar Estado, gobierno y nación al caso paraguayo?", "Paraguay es el Estado con Constitución; los gobiernos se suceden; la nación es la identidad compartida."]]}, {"id": "u5", "title": "Unidad V", "subtitle": "Sistema político", "sections": [{"h": "1.1 Poder político y definición de Max Weber", "p": ["Weber define al Estado por el medio específico del que dispone: la coerción física legítima. El Estado es una organización política cuyos funcionarios reclaman con éxito el monopolio legítimo de la violencia dentro de un territorio determinado."], "q": {"t": "La coerción no es necesariamente el recurso cotidiano ni el primero que utiliza el Estado. Es el recurso de última instancia.", "c": "Manual de Unidad V"}}, {"h": "3.1 David Easton y la teoría de sistemas", "p": ["El modelo de Easton representa el sistema político como un proceso de entradas, conversión, salidas y retroalimentación."], "tb": [["Elemento", "Contenido", "Ejemplo"], ["Inputs", "Demandas y apoyos de la sociedad", "Reclamo ciudadano por seguridad"], ["Procesamiento", "Instituciones transforman demandas", "Debate legislativo"], ["Outputs", "Decisiones y políticas públicas", "Ley, presupuesto, programa"], ["Feedback", "Respuesta social a las decisiones", "Apoyo, protesta o voto"]]}, {"h": "4.2 Autoritarismo y totalitarismo", "p": ["El autoritarismo busca controlar la vida política y neutralizar la oposición, permitiendo ciertos márgenes de autonomía social. El totalitarismo pretende transformar la sociedad mediante ideología oficial, movilización intensa y control extensivo de la vida social."], "tb": [["Autoritarismo", "Totalitarismo"], ["Pluralismo limitado", "Pretensión de eliminación del pluralismo"], ["Movilización baja o controlada", "Movilización intensa y permanente"], ["Ideología débil o pragmática", "Ideología oficial fuerte y totalizante"]]}, {"h": "6. Golpe de Estado", "p": ["El golpe de Estado es una ruptura rápida e ilegal del orden político mediante la cual un grupo relativamente reducido desplaza a las autoridades existentes. Debe distinguirse de una revolución, que supone movilización social amplia y busca transformar profundamente el orden político, social o económico."]}, {"h": "11. Aplicación al caso paraguayo", "p": ["La dictadura de Alfredo Stroessner (1954-1989) constituyó un régimen autoritario de fuerte liderazgo personalista, sostenido por la articulación entre Presidencia, Fuerzas Armadas y Partido Colorado. Su caída en 1989 abrió un proceso de transición que culminó con la Constitución de 1992."]}], "glossary": [["Sistema político", "Interacciones por las que se procesan demandas y decisiones."], ["Monopolio legítimo de la violencia", "Uso legítimo de la coerción física dentro de un territorio (Weber)."], ["Régimen político", "Reglas que organizan el acceso y ejercicio del poder."], ["Golpe de Estado", "Toma no constitucional del poder mediante ruptura rápida."], ["Liberalización", "Apertura parcial de libertades sin plena democratización."], ["Democratización", "Establecimiento de competencia y derechos democráticos."], ["Consolidación democrática", "Estabilización y legitimación de las reglas democráticas."]], "repaso": [["¿Qué aporta la definición de Estado de Max Weber?", "Define al Estado por el monopolio legítimo de la coerción física, no por sus funciones."], ["¿Por qué Estado y sistema político no son sinónimos?", "El Estado es la estructura permanente; el sistema político incluye las interacciones dinámicas con la sociedad."], ["¿Modelo de inputs, outputs y feedback de Easton?", "Demandas ingresan (inputs), se procesan en decisiones (outputs), generando feedback social."], ["¿Diferencia entre régimen democrático, autoritario y totalitario?", "Democrático: pluralismo y alternancia. Autoritario: poder concentrado. Totalitario: control total de la sociedad."], ["¿Por qué la represión no es el único sostén autoritario?", "Se combina con clientelismo, control de medios y legitimación ideológica."], ["¿Variables para analizar sistemas autoritarios?", "Número de actores, justificación ideológica, movilización e institucionalización."], ["¿Diferencia entre golpe de Estado y revolución?", "El golpe es una ruptura rápida por un grupo reducido; la revolución implica movilización social amplia."], ["¿Factores que favorecen rupturas autoritarias?", "Crisis económica, desigualdad, debilidad institucional y polarización, sin ser causas únicas."], ["¿Diferencia entre liberalización y democratización?", "Liberalización: apertura parcial de libertades. Democratización: cambio real de las reglas de acceso al poder."], ["¿Qué actores intervienen en una transición política?", "Sectores duros y blandos del régimen, oposición moderada y radical, Fuerzas Armadas y ciudadanía."], ["¿Diferencia entre instauración, consolidación y persistencia?", "Instauración crea instituciones; consolidación las legitima; persistencia es mantenerse en el tiempo."], ["¿Por qué la legitimidad es clave para la consolidación?", "Los actores deben aceptar resolver disputas dentro de las instituciones democráticas, aun perdiendo."], ["¿Cómo aplicar transición y consolidación al caso paraguayo?", "La dictadura de Stroessner (1954-1989) dio paso a la transición y la Constitución de 1992."]]}, {"id": "u6", "title": "Unidad VI", "subtitle": "Ideologías políticas", "sections": [{"h": "2. Liberalismo", "p": ["El liberalismo afirma que el individuo posee derechos y libertades que no dependen de la voluntad del gobernante. Su núcleo fundamental es la limitación del poder, vinculándose con el constitucionalismo, la división de poderes y el Estado de Derecho. Locke sostiene que el Estado existe para proteger derechos anteriores (vida, libertad, propiedad), no para anularlos."], "q": {"t": "Antes de ser una doctrina económica, el liberalismo es una doctrina política orientada a impedir que el poder estatal sea arbitrario.", "c": "Manual de Unidad VI"}}, {"h": "3. Conservadurismo: Edmund Burke", "p": ["Para Burke, la sociedad puede entenderse como una comunidad entre los vivos, los muertos y los que están por nacer. Las instituciones no son inventos arbitrarios: condensan experiencias, equilibrios y aprendizajes de generaciones anteriores. Las reformas son posibles, pero deben ser prudentes y orgánicas."]}, {"h": "4-5. Socialismo y marxismo", "p": ["El socialismo es una familia amplia (utópico, anarquismo, socialdemocracia) que prioriza igualdad y justicia social. El marxismo es una corriente específica: explica la historia mediante la lucha de clases. El plusvalor es la diferencia entre el valor producido por el trabajador y su salario, apropiada por el capitalista. La alienación describe la pérdida de control del trabajador sobre su propia actividad."]}, {"h": "6. Nacionalismo", "p": ["El nacionalismo sostiene que la nación debe expresar su voluntad política mediante un Estado propio, autonomía o reconocimiento. Puede adoptar formas cívicas, culturales, anticoloniales o excluyentes."], "tb": [["Forma", "Características"], ["Nacionalismo cívico o político", "Ciudadanía e instituciones comunes"], ["Nacionalismo cultural", "Lengua, memoria y símbolos compartidos"], ["Nacionalismo anticolonial", "Autodeterminación frente a dominación extranjera"], ["Nacionalismo excluyente", "Criterios cerrados, riesgo de discriminación"]]}, {"h": "9-10. Izquierda, centro, derecha y nuevos ejes", "p": ["El espectro izquierda-derecha es útil pero insuficiente. Los conflictos contemporáneos combinan varios ejes analíticos simultáneamente."], "tb": [["Eje", "Polo 1", "Polo 2"], ["Económico", "Mayor intervención estatal", "Mayor libertad de mercado"], ["Sociocultural", "Progresismo", "Conservadurismo cultural"], ["Territorial", "Globalismo/integración", "Nacionalismo/soberanía"], ["Institucional", "Democracia pluralista", "Autoritarismo/iliberalismo"]]}], "glossary": [["Ideología", "Conjunto organizado de ideas que interpreta la realidad política."], ["Estado de Derecho", "El poder público está sometido a normas jurídicas."], ["Plusvalor", "Diferencia entre valor producido y salario, apropiada por el capitalista (Marx)."], ["Alienación", "Pérdida de control del trabajador sobre su propio trabajo."], ["Socialdemocracia", "Corriente socialista reformista que impulsa el Estado de Bienestar."], ["Nacionalismo", "Ideología que coloca a la nación como comunidad política fundamental."], ["Populismo", "Lógica política que opone al pueblo frente a las élites."]], "repaso": [["¿Por qué el liberalismo es una doctrina de limitación del poder?", "Busca impedir el poder arbitrario del Estado, vinculándose al constitucionalismo y la división de poderes."], ["¿Diferencia entre igualdad jurídica e igualdad social?", "Jurídica: igual sometimiento a la ley. Social: condiciones materiales más equitativas."], ["¿Diferencia entre Hobbes y Locke sobre el Estado?", "Hobbes: soberano fuerte contra la inseguridad. Locke: Estado limitado para proteger derechos previos."], ["¿Por qué el conservadurismo valora la tradición?", "Considera que las instituciones condensan experiencia histórica acumulada."], ["¿Qué distingue al socialismo del marxismo?", "El socialismo es amplio y puede ser reformista; el marxismo explica la historia por la lucha de clases."], ["¿Qué son plusvalor y alienación en Marx?", "Plusvalor: diferencia entre valor producido y salario. Alienación: pérdida de control sobre el propio trabajo."], ["¿Por qué el nacionalismo puede ser de izquierda o derecha?", "Responde a quién constituye la comunidad política, combinándose con otras ideologías."], ["¿Diferencia entre nación política, cultural y jurídica?", "Política: ciudadanía común. Cultural: lengua y tradiciones. Jurídica: pertenencia formal a un Estado."], ["¿Por qué el eje izquierda-derecha es insuficiente?", "Los conflictos actuales combinan ejes económico, sociocultural, territorial e institucional."], ["¿Nuevos ejes de conflicto ideológico contemporáneo?", "Económico (Estado/mercado), sociocultural, territorial (soberanía/globalismo) e institucional (democracia/autoritarismo)."]]}];
let cur=0;
function renderNav(){
  document.getElementById('nav').innerHTML = UNITS.map((u,i)=>`<div class="nav-unit ${i===cur?'active':''}" onclick="load(${i})">${u.title}: ${u.subtitle}</div>`).join('');
}
function render(){
  const u=UNITS[cur];
  let html = `<h1>${u.title}: ${u.subtitle}</h1>`;
  u.sections.forEach(s=>{
    html += `<h2>${s.h}</h2>`;
    if(s.p) s.p.forEach(p=>html+=`<p>${p}</p>`);
    if(s.q) html += `<blockquote>"${s.q.t}"<span>— ${s.q.c}</span></blockquote>`;
    if(s.tb){
      html += '<table><tr>'+s.tb[0].map(h=>`<th>${h}</th>`).join('')+'</tr>';
      s.tb.slice(1).forEach(r=>html+='<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>');
      html += '</table>';
    }
  });
  document.getElementById('frame').innerHTML = html;
  hide();
}
function load(i){cur=i;renderNav();render();}
function showTool(k){
  hide();
  const u=UNITS[cur];
  if(k==='g'){document.getElementById('pg').style.display='block';document.getElementById('lg').innerHTML=u.glossary.map(g=>`<div class="pill" onclick="alert('${g[0].replace(/'/g,"\\'")}: ${g[1].replace(/'/g,"\\'")}')">🔑 ${g[0]}</div>`).join('');}
  else if(k==='f'){document.getElementById('pf').style.display='block';document.getElementById('lf').innerHTML=u.glossary.map((g,i)=>`<div class="card" id="c${i}" data-t="${g[0]}" data-d="${g[1].replace(/"/g,'&quot;')}" data-fl="0" onclick="flip(${i})">${g[0]}</div>`).join('');}
  else if(k==='r'){document.getElementById('pr').style.display='block';document.getElementById('lr').innerHTML=`<div class="cnt">${u.repaso.length} preguntas — ${u.title}</div>`+u.repaso.map((qa,i)=>`<div class="rp"><div class="rp-q" onclick="tg(${i})">${i+1}. ${qa[0]}</div><div class="rp-a" id="a${i}">${qa[1]}</div></div>`).join('');}
}
function tg(i){document.getElementById('a'+i).classList.toggle('open');}
function hide(){['pg','pf','pr'].forEach(id=>document.getElementById(id).style.display='none');}
function flip(i){const el=document.getElementById('c'+i);const fl=el.getAttribute('data-fl')==='1';el.innerHTML=fl?el.getAttribute('data-t'):el.getAttribute('data-d');el.setAttribute('data-fl',fl?'0':'1');}
renderNav();render();
</script>
