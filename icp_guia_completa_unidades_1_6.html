<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICP · Guía Completa Unidades I-VI · Herramienta de Estudio</title>
<style>
:root{
  --bg-canvas:#F8F9FA; --bg-card:#FFFFFF; --text-main:#212529;
  --brand-color:#0F172A; --accent:#1E3A8A; --accent-soft:#EFF6FF;
  --border:#E2E8F0; --muted:#64748B;
}
[data-theme="dark"]{
  --bg-canvas:#1A202C; --bg-card:#232B3A; --text-main:#E2E8F0;
  --brand-color:#0B1220; --accent:#60A5FA; --accent-soft:#1E293B;
  --border:#334155; --muted:#94A3B8;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Segoe UI',Roboto,Inter,Tahoma,sans-serif;
  background:var(--bg-canvas); color:var(--text-main);
  display:grid; grid-template-columns:280px 1fr 340px; height:100vh; overflow:hidden;
  transition:background .3s,color .3s;
}
header.topbar{
  grid-column:1/4; display:flex; align-items:center; justify-content:space-between;
  padding:10px 22px; background:var(--brand-color); color:#fff;
}
header.topbar .brand{font-weight:700; font-size:15px;}
header.topbar .actions button{
  background:none; border:1px solid rgba(255,255,255,.3); color:#fff;
  padding:6px 12px; border-radius:6px; margin-left:8px; cursor:pointer; font-size:13px;
}
.layout{grid-column:1/4; display:grid; grid-template-columns:280px 1fr 340px; overflow:hidden;}
