<script>
const UNITS = [{"id": "u1", "title": "Unidad I", "subtitle": "La política como poder y como participación", "sections": [{"h": "1. ¿Qué es la política?", "p": ["La pregunta por la política atraviesa la historia del pensamiento occidental. Aristóteles sostuvo que el ser humano es un animal político: vive en comunidad y desarrolla su existencia dentro de formas de organización colectiva. Desde esta perspectiva, imaginar una sociedad completamente carente de política resulta difícil, porque toda convivencia plantea problemas de decisión, autoridad, cooperación y conflicto.", "Max Weber vinculó la política con la dirección o influencia sobre la dirección de una asociación política, especialmente el Estado. Esta definición coloca en el centro la disputa por orientar decisiones colectivas. Las perspectivas contemporáneas amplan todavía más el concepto: la política puede estudiarse como conflicto y decisión, como representación y negociación, como distribución de recursos escasos y como mecanismo para procesar conflictos colectivos.", "En consecuencia, la política aparece también en la vida cotidiana cuando una comunidad reclama una obra pública, cuando estudiantes eligen representantes, cuando una organización intenta modificar una ley o cuando ciudadanos discuten prioridades presupuestarias."], "q": {"t": "La política es el proceso mediante el cual una sociedad organiza el poder, procesa sus conflictos, construye representación, adopta decisiones colectivas y define reglas para convivir.", "c": "Manual de Unidad I"}}, {"h": "2. La política como poder", "p": ["El poder es uno de los elementos centrales de la política. Organizar, decidir, imponer, persuadir o negociar implica relaciones en las que determinados actores poseen capacidad para incidir sobre otros o sobre resultados colectivos. En un sentido introductorio, podemos definir el poder como la capacidad de influir sobre conductas o decisiones. Esa influencia puede provenir de una posición institucional, de recursos materiales, del prestigio, del conocimiento, de la capacidad de movilización o de la posibilidad de aplicar sanciones.", "El poder no debe entenderse automáticamente como algo negativo. Toda organización política necesita capacidad para adoptar y ejecutar decisiones. El problema democrático no es eliminar el poder, sino determinar cómo se obtiene, cómo se ejerce, con qué límites y bajo qué controles.", "El material de cátedra distingue tres formas básicas de ejercicio del poder. El poder coercitivo obtiene obediencia mediante fuerza o amenaza de sanción. El poder persuasivo modifica conductas mediante ideas, discursos, símbolos, información o prestigio. El poder legítimo es aceptado porque quienes obedecen consideran válido el derecho de una autoridad a decidir. Un mismo actor puede combinar estas dimensiones: un presidente electo posee autoridad derivada de reglas constitucionales, puede persuadir mediante discursos y negociación, y dispone, dentro de límites jurídicos, de instituciones capaces de hacer cumplir determinadas decisiones."], "tb": [["Forma", "Fundamento", "Ejemplo"], ["Coerción", "Fuerza, amenaza o sanción", "Cumplimiento ante una sanción prevista"], ["Persuasión/influencia", "Ideas, prestigio, información o negociación", "Movimiento que instala un tema en la agenda"], ["Autoridad legítima", "Reconocimiento del derecho a decidir", "Sentencia de un juez competente"]]}, {"h": "3. Tres miradas sobre el poder: Weber, Arendt y Foucault", "p": ["Max Weber estudia el poder y, especialmente, las razones por las que la dominación puede ser considerada legítima. Distingue autoridad tradicional, carismática y legal-racional. La primera se apoya en costumbres heredadas; la segunda, en cualidades extraordinarias atribuidas a una persona; la tercera, en reglas impersonales, cargos e instituciones.", "Hannah Arendt propone distinguir poder y violencia. Para ella, el poder surge de la capacidad humana de actuar conjuntamente y depende del apoyo y la acción colectiva. La violencia puede destruir poder, pero no equivale a él. Esta mirada permite pensar la política no solamente como dominación, sino también como cooperación.", "Michel Foucault cuestiona la idea de que el poder se encuentre concentrado únicamente en el Estado o en una autoridad superior. El poder circula a través de redes y relaciones sociales; aparece en instituciones como escuelas, hospitales, prisiones y otros espacios. Además, no actúa únicamente reprimiendo: también produce saberes, categorías y conductas.", "Las tres perspectivas permiten observar dimensiones diferentes: Weber ayuda a comprender autoridad y legitimidad; Arendt, la acción colectiva; Foucault, las relaciones difusas y cotidianas de poder."]}, {"h": "4-5. Tener poder y ejercer poder", "p": ["Tener una posición, recursos o prestigio no significa necesariamente utilizarlos con éxito. El poder se vuelve observable cuando un actor consigue decidir, influir, negociar, movilizar, imponer o transformar. El ejemplo utilizado en clase sobre Taylor Swift permite mostrar esta diferencia: una figura pública no necesita ocupar un cargo para producir efectos políticos. Puede carecer de autoridad formal y de capacidad coercitiva, pero influir sobre conductas mediante visibilidad, prestigio y capacidad de comunicación.", "El poder político puede adoptar diversas formas prácticas. Decidir significa elegir entre alternativas que afectan a una colectividad. Distribuir supone asignar recursos, derechos, cargas u oportunidades. Regular implica establecer reglas y límites. Negociar consiste en construir acuerdos entre actores con intereses diferentes. Movilizar significa generar apoyo y acción colectiva. Transformar supone modificar políticas, instituciones o relaciones sociales."]}, {"h": "6. La política como participación", "p": ["La política no consiste únicamente en observar quién manda. También comprende las formas en que la ciudadanía interviene en los asuntos comunes. Participar significa intentar incidir, opinar, decidir u organizarse respecto de cuestiones públicas. La participación es una dimensión fundamental de la democracia porque permite expresar demandas, seleccionar representantes, controlar autoridades y construir acción colectiva.", "Las formas institucionales utilizan canales formalmente reconocidos por el sistema político: el voto, la militancia y afiliación partidaria, las candidaturas, las peticiones a autoridades y las audiencias públicas. Las formas no institucionales utilizan canales menos formalizados, aunque no necesariamente ilegales: marchas, protestas, campañas digitales, movimientos sociales y otras formas de movilización."], "tb": [["Participación institucional", "Participación no institucional"], ["Voto y elecciones", "Marchas y protestas"], ["Partidos y candidaturas", "Campañas digitales"], ["Peticiones y audiencias públicas", "Movimientos sociales"]]}, {"h": "7-8. Del poder al liderazgo", "p": ["El poder necesita actores que lo ejerzan. Aquí aparece el liderazgo político como una relación entre poder y sociedad. Tener autoridad formal no equivale necesariamente a conseguir que otros acompañen una orientación política. Un gobernante ocupa un cargo y posee competencias establecidas por normas; un líder, en cambio, necesita adhesión, seguimiento y capacidad para orientar conductas.", "Las razones del seguimiento son diversas: la legitimidad produce apoyo cuando se reconoce el derecho de alguien a conducir; la identificación aparece cuando una persona siente que el líder representa sus valores; las ideas generan adhesión a un programa; los intereses también importan; los resultados pueden fortalecer el liderazgo cuando existe percepción de eficacia; finalmente, el carisma produce una relación emocional y personal particularmente intensa entre líder y seguidores."]}, {"h": "9-11. Liderazgo transaccional, transformacional y tradiciones latinoamericanas", "p": ["James MacGregor Burns distingue dos formas ideales de liderazgo. El liderazgo transaccional se construye mediante intercambios concretos, negociación de intereses, acuerdos y recompensas. El liderazgo transformacional busca modificar valores, expectativas y objetivos colectivos, construyendo una visión de cambio.", "La historia política latinoamericana ha conocido formas de liderazgo fuertemente personalizadas. El caudillismo organiza el poder alrededor de una figura con fuerte autoridad personal. El personalismo coloca al líder por encima del partido, el programa y las instituciones. El clientelismo se basa en intercambios particularizados de recursos por apoyo político. El patronazgo utiliza cargos y recursos públicos para construir redes de apoyo."], "tb": [["Concepto", "Rasgo central"], ["Caudillismo", "Autoridad política concentrada en una figura personal"], ["Personalismo", "Centralidad del líder frente al programa o instituciones"], ["Clientelismo", "Intercambio particularizado de beneficios por apoyo político"], ["Patronazgo", "Uso de cargos y recursos estatales para construir apoyos"]]}, {"h": "12-13. Miradas clásicas y tipos de liderazgo político", "p": ["Platón propone el ideal del filósofo-rey: gobernar correctamente requiere conocimiento y virtud. Aristóteles desplaza la pregunta desde quién gobierna hacia para quién gobierna, distinguiendo formas correctas (orientadas al bien común) y formas desviadas (orientadas al interés particular). Maquiavelo introduce una mirada realista: la virtud (capacidad, decisión, audacia) y la fortuna (circunstancias no controladas) explican la conquista y conservación del poder. Weber, finalmente, distingue legitimidades tradicional, carismática y legal-racional.", "El material distingue liderazgo presidencial (legitimidad electoral y recursos institucionales), carismático (relación personal y emocional), partidario (surge de la organización interna) e intelectual (las ideas también ejercen poder; la noción gramsciana de intelectual orgánico vincula producción de ideas con intereses de grupos sociales)."], "tb": [["¿Quién gobierna?", "Busca el bien común", "Busca interés propio"], ["Uno", "Monarquía", "Tiranía"], ["Pocos", "Aristocracia", "Oligarquía"], ["Muchos", "Politeia", "Democracia (desviada)"]]}, {"h": "14. Liderazgo y democracia: democracia delegativa", "p": ["Las democracias necesitan capacidad de conducción, pero esa necesidad genera una pregunta decisiva: ¿quién controla a quien lidera? Guillermo O'Donnell utiliza el concepto de democracia delegativa para analizar situaciones en las que un presidente electo interpreta su victoria como una autorización amplia para gobernar con restricciones institucionales débiles, considerando los controles como obstáculos."], "q": {"t": "Elección democrática no equivale a poder ilimitado. La fortaleza de un liderazgo debe evaluarse no solamente por su capacidad de actuar, sino también por la forma en que reconoce límites y contrapesos.", "c": "Regla fundamental — Unidad I, sección 14"}}, {"h": "16-17. Lógica personalista, institucional y el sistema político de Easton", "p": ["La lógica personalista coloca a la persona en el centro: predominan lealtades personales, decisiones concentradas y dependencia del proyecto respecto de su figura. La lógica institucional coloca las reglas en el centro: competencias definidas, organizaciones estables y continuidad más allá de las personas.", "El sistema político es el conjunto de instituciones, actores, normas y relaciones mediante los cuales se organiza y ejerce el poder político. David Easton propone analizar la política como un sistema: la sociedad genera inputs en forma de demandas y apoyos; el sistema político procesa esos estímulos y produce outputs (decisiones, leyes, políticas públicas); la sociedad evalúa los resultados y genera feedback, que puede convertirse en nuevas demandas."]}, {"h": "18-21. Conceptos básicos y aplicación al caso paraguayo", "p": ["Estado, gobierno y nación no son sinónimos: el Estado es una organización política y jurídica relativamente permanente; el gobierno es el conjunto temporal de autoridades; la nación es una comunidad construida alrededor de elementos históricos y simbólicos. Poder, autoridad y legitimidad tampoco significan lo mismo: el poder es capacidad de influir; la autoridad es poder reconocido como válido; la legitimidad es la creencia de que el ejercicio del poder es válido o justificable.", "Los conceptos de la unidad permiten formular preguntas sobre la realidad paraguaya sin reducir el análisis a personas concretas: qué recursos institucionales posee la Presidencia, cómo se construyen mayorías en el Congreso, qué papel cumplen los partidos, cómo participan organizaciones sociales y qué actores consiguen instalar temas en la agenda."]}], "glossary": [["Política", "Proceso mediante el cual una sociedad organiza el poder y adopta decisiones colectivas."], ["Poder", "Capacidad de influir sobre conductas o decisiones."], ["Autoridad", "Poder reconocido como válido para adoptar decisiones."], ["Legitimidad", "Creencia de que el ejercicio del poder es válido o justificable."], ["Liderazgo transaccional", "Conducción basada en negociación e intercambios concretos."], ["Liderazgo transformacional", "Conducción orientada a modificar valores y objetivos colectivos."], ["Clientelismo", "Intercambio particularizado de recursos o beneficios por apoyo político."], ["Democracia delegativa", "El presidente interpreta la elección como delegación amplia (O'Donnell)."], ["Sistema político", "Instituciones y relaciones mediante las cuales se organiza el poder."]], "repaso": [["¿Por qué la política no puede reducirse a elecciones, partidos o cargos públicos?", "Porque existe política donde hay relaciones de poder y decisiones que afectan a otros, no solo en elecciones o cargos formales."], ["¿Qué significa definir la política a partir del poder y la participación?", "Permite preguntar quién decide e influye (poder) y cómo interviene la ciudadanía en los asuntos comunes (participación)."], ["¿Qué diferencias existen entre coerción, influencia y autoridad legítima?", "Coerción usa fuerza o amenaza de sanción; la persuasión usa ideas y prestigio; la autoridad legítima se acepta porque se reconoce el derecho a decidir."], ["¿Cómo se diferencian las miradas de Weber, Arendt y Foucault sobre el poder?", "Weber analiza legitimidad y tipos de autoridad; Arendt distingue poder de violencia; Foucault ve el poder circulando en redes sociales, no solo en el Estado."], ["¿Por qué tener poder no equivale necesariamente a ejercerlo?", "Porque poseer recursos no garantiza usarlos con éxito: el poder se hace observable cuando efectivamente se decide, influye o transforma algo."], ["¿Puede una persona sin cargo público ejercer poder político? Fundamente.", "Sí, mediante visibilidad, prestigio y comunicación (caso Taylor Swift), evitando confundir influencia con causalidad directa."], ["¿Qué formas institucionales y no institucionales de participación existen?", "Institucionales: voto, militancia, peticiones. No institucionales: marchas, protestas, campañas digitales."], ["¿Qué diferencia existe entre inclusión formal e inclusión efectiva en la política?", "Formal es poseer el derecho; efectiva es contar con condiciones reales (educación, recursos) para ejercerlo."], ["¿Por qué liderazgo y autoridad no son sinónimos?", "La autoridad formal no garantiza adhesión; el liderazgo requiere capacidad real de movilizar a otros."], ["¿Qué papel cumplen los seguidores y el contexto en el liderazgo?", "Los seguidores aportan apoyo y movilización; el contexto crea oportunidades o restricciones."], ["¿Diferencia entre liderazgo transaccional y transformacional?", "Transaccional: intercambios concretos. Transformacional: modifica valores y objetivos colectivos."], ["¿Qué limita la visión tradicional del 'gran hombre'?", "Ignora que sin seguidores no hay liderazgo y oculta liderazgos colectivos y de grupos excluidos."], ["¿Cómo se distinguen caudillismo, personalismo, clientelismo y patronazgo?", "Caudillismo: autoridad personal territorial. Personalismo: centralidad del líder. Clientelismo: beneficios por apoyo. Patronazgo: uso de cargos estatales."], ["¿Qué preguntan Platón, Aristóteles, Maquiavelo y Weber sobre el gobierno?", "Platón: filósofo-rey. Aristóteles: bien común vs. interés propio. Maquiavelo: virtud y fortuna. Weber: por qué obedecemos."], ["¿Características del liderazgo presidencial, carismático, partidario e intelectual?", "Presidencial: legitimidad electoral. Carismático: vínculo emocional. Partidario: organización interna. Intelectual: influencia de ideas."], ["¿Por qué una victoria electoral no implica poder ilimitado?", "Porque el gobierno sigue sometido a la Constitución, separación de poderes y controles institucionales."], ["¿Qué es la democracia delegativa de O'Donnell?", "El presidente interpreta su victoria como autorización amplia y debilita controles institucionales."], ["¿Diferencia entre lógica personalista y lógica institucional?", "Personalista: lealtades al líder. Institucional: reglas y competencias definidas, más allá de las personas."], ["¿Cómo funciona el sistema político de Easton?", "Inputs (demandas) se procesan en outputs (decisiones), generando feedback que reingresa como nuevas demandas."], ["¿Diferencias entre Estado, gobierno y nación?", "Estado: estructura permanente. Gobierno: autoridades temporales. Nación: comunidad identitaria."], ["¿Diferencias entre poder, autoridad y legitimidad?", "Poder: capacidad de influir. Autoridad: poder reconocido válido. Legitimidad: creencia de que es justificable."], ["¿Cómo aplicar estos conceptos a la política paraguaya?", "Analizando recursos de la Presidencia, mayorías en el Congreso, partidos y participación social, sin reducir el análisis a personas."]]}, {"id": "u2", "title": "Unidad II", "subtitle": "El análisis de la política", "sections": [{"h": "1. La política como objeto de estudio científico", "p": ["La reflexión sobre la política es muy antigua. Desde la Antigüedad, filósofos, juristas e historiadores se preguntaron cuál era la mejor forma de gobierno, qué hacía legítima a una autoridad y cuáles eran las causas de los conflictos políticos. La Ciencia Política contemporánea conserva muchas de esas preguntas, pero se consolida como disciplina autónoma principalmente durante el siglo XX, recibiendo aportes de la filosofía, el Derecho, la sociología, la economía y la historia.", "Su campo incluye el poder, las instituciones, las decisiones colectivas, el comportamiento político, la participación y la representación. También estudia elecciones, partidos, políticas públicas, movimientos sociales, regímenes políticos y relaciones internacionales."], "q": {"t": "La objetividad no significa que el investigador carezca de valores personales, sino que debe evitar presentar sus preferencias como si fueran hechos demostrados.", "c": "Manual de Unidad II"}}, {"h": "1.1 ¿Cuándo un análisis político puede considerarse científico?", "p": ["Siguiendo a Norberto Bobbio, se destacan tres exigencias básicas. La primera es la comprobabilidad: las afirmaciones deben poder contrastarse con evidencia. La segunda es la explicación: la Ciencia Política no se limita a narrar acontecimientos, sino que intenta identificar causas, actores, intereses e instituciones. La tercera consiste en distinguir hechos y valores: el investigador debe separar lo que ocurre de lo que considera deseable.", "Estas tres ideas pueden resumirse en una fórmula útil: evidencia, explicación y objetividad analítica."]}, {"h": "2. Describir, explicar y evaluar", "p": ["Un mismo fenómeno político puede generar preguntas diferentes. Si el Congreso aprueba una reforma que provoca protestas, una pregunta normativa sería ¿la reforma es justa?; una pregunta empírica sería ¿qué sectores protestan y cuáles apoyan la medida?; una pregunta comparada investigaría qué ocurrió con reformas semejantes en otros países; y una pregunta histórica reconstruiría cómo se llegó a esa situación."], "tb": [["Tipo de pregunta", "Ejemplo", "Qué busca"], ["Normativa", "¿La decisión es justa?", "Evaluar según valores o principios"], ["Empírica", "¿Qué está ocurriendo realmente?", "Observar y explicar hechos"], ["Comparada", "¿Qué ocurrió en otros países?", "Identificar similitudes y patrones"], ["Histórica", "¿Cómo llegamos hasta acá?", "Reconstruir procesos en el tiempo"]]}, {"h": "3-7. Métodos y perspectivas del análisis político", "p": ["El método empírico se apoya en observación y recolección sistemática de datos (estadísticas, encuestas, entrevistas). El método comparado contrasta casos para identificar similitudes y diferencias, permitiendo estudiar cómo determinadas instituciones se relacionan con resultados políticos. El método histórico analiza procesos a través del tiempo, ayudando a distinguir cambio y continuidad. El enfoque normativo utiliza razonamiento filosófico para discutir principios como justicia, libertad e igualdad.", "La perspectiva normativa utiliza filosofía política y teorías de justicia: Platón se preguntó por el gobierno de los sabios; Rousseau reflexionó sobre la voluntad general; John Rawls formuló una teoría de la justicia basada en principios de equidad. La perspectiva empírica utiliza métodos cuantitativos (estadísticas, encuestas) y cualitativos (entrevistas, estudios de caso). La perspectiva comparada contrasta países, instituciones o períodos históricos. La perspectiva histórica estudia documentos, archivos y fuentes para comprender la evolución de instituciones y prácticas."]}, {"h": "9-10. Conflicto y consenso", "p": ["La política surge, en buena medida, porque las sociedades contienen diversidad. Cuando esas diferencias afectan decisiones colectivas aparece el conflicto político, que puede manifestarse socialmente (huelgas, protestas), institucionalmente (debates parlamentarios) o internacionalmente (tensiones entre Estados). Carl Schmitt enfatiza la distinción política entre amigo y enemigo; las perspectivas marxistas destacan el conflicto entre clases sociales.", "La existencia de conflicto no elimina la necesidad de acuerdos. Una Constitución puede funcionar como pacto básico de convivencia. John Rawls utiliza la idea de consenso traslapado para explicar cómo personas con concepciones morales distintas pueden coincidir en principios políticos fundamentales. La vida política requiere un equilibrio dinámico entre conflicto y consenso: el conflicto expresa demandas; el consenso proporciona procedimientos para canalizarlas."], "tb": [["Conflicto", "Consenso"], ["Expresa diferencias de intereses y valores", "Establece acuerdos mínimos para convivir"], ["Puede impulsar cambios", "Aporta estabilidad y legitimidad"], ["Se manifiesta en protestas y disputas", "Se manifiesta en reglas y procedimientos"]]}, {"h": "11-13. Democracia y élites: Mosca, Pareto y Michels", "p": ["El material de cátedra define la democracia a partir de soberanía popular, igualdad política y participación ciudadana. Sin embargo, las sociedades modernas son demasiado complejas para que todas las personas participen directamente en cada decisión, lo que crea una tensión entre participación amplia y concentración de decisiones en grupos relativamente pequeños.", "Gaetano Mosca sostiene que en las sociedades existe una minoría organizada —la clase dirigente— que gobierna sobre una mayoría más numerosa pero menos organizada. Vilfredo Pareto propone la circulación de las élites: los grupos dominantes se renuevan y son reemplazados por nuevas minorías, sin que desaparezca la diferencia entre gobernantes y gobernados. Robert Michels formula la ley de hierro de la oligarquía: incluso organizaciones creadas con ideales democráticos tienden a desarrollar minorías dirigentes, porque las organizaciones complejas necesitan coordinación, experiencia e información que otorgan ventajas a quienes las controlan."], "tb": [["Autor", "Concepto central", "Idea principal"], ["Gaetano Mosca", "Clase dirigente", "Una minoría organizada gobierna sobre una mayoría menos organizada"], ["Vilfredo Pareto", "Circulación de élites", "Las élites se renuevan, pero persisten minorías dominantes"], ["Robert Michels", "Ley de hierro de la oligarquía", "Las organizaciones tienden a concentrar dirección en una minoría"]]}, {"h": "14. Campos de análisis en Ciencia Política", "p": ["La Ciencia Política se organiza en diferentes campos especializados que no son compartimentos completamente separados. La Teoría Política reflexiona sobre conceptos como poder, justicia y legitimidad. El Análisis institucional estudia estructuras políticas y su funcionamiento. El Comportamiento político analiza voto, abstención y opinión pública. La Política comparada contrasta sistemas de diferentes países. Las Relaciones Internacionales estudian diplomacia, cooperación y organismos internacionales como la ONU, la OEA o el MERCOSUR."], "tb": [["Campo", "Objeto principal"], ["Teoría Política", "Conceptos, valores e ideas"], ["Análisis institucional", "Instituciones y reglas"], ["Comportamiento político", "Ciudadanía y participación"], ["Política comparada", "Comparación entre sistemas"], ["Relaciones Internacionales", "Política entre Estados y actores"]]}, {"h": "16. Aplicación al caso paraguayo", "p": ["La abstención electoral paraguaya puede abordarse empíricamente mediante datos de participación, comparativamente mediante contraste con otros países, históricamente mediante evolución de elecciones anteriores, y normativamente mediante el debate sobre deber cívico y libertad. La relación entre democracia y élites también puede analizarse observando quiénes ocupan posiciones de liderazgo y qué mecanismos existen para controlar a quienes ejercen poder."]}], "glossary": [["Ciencia Política", "Disciplina que estudia sistemáticamente fenómenos de poder e instituciones."], ["Comprobabilidad", "Posibilidad de contrastar una afirmación con evidencia."], ["Conflicto político", "Disputa derivada de diferencias de intereses o valores."], ["Consenso", "Acuerdo mínimo que permite la convivencia política."], ["Élite", "Minoría que concentra posiciones o recursos relevantes de poder."], ["Circulación de élites", "Renovación y reemplazo de grupos dirigentes (Pareto)."], ["Ley de hierro de la oligarquía", "Las organizaciones tienden a desarrollar minorías dirigentes (Michels)."]], "repaso": [["¿Diferencia entre opinar sobre política y analizarla científicamente?", "Opinar es preferencia personal; analizar exige comprobabilidad, explicación causal y distinguir hechos de valores."], ["¿Condiciones para que un análisis político sea científico?", "Comprobabilidad, explicación causal y distinción entre hechos y valores (Bobbio)."], ["¿Por qué distinguir hechos de valores?", "Para no presentar preferencias personales como hechos demostrados."], ["¿Diferencia entre pregunta normativa y empírica?", "Normativa evalúa según valores; empírica observa y explica hechos."], ["¿Qué herramientas usa la perspectiva empírica?", "Métodos cuantitativos (estadísticas, encuestas) y cualitativos (entrevistas, estudios de caso)."], ["¿Qué aporta el método comparado?", "Contrastar casos para identificar similitudes, diferencias y patrones generales."], ["¿Por qué es importante el análisis histórico?", "Porque las estructuras actuales resultan de procesos anteriores; ayuda a distinguir cambio y continuidad."], ["¿Cómo aplicar las 4 perspectivas al voto obligatorio/voluntario?", "Normativa: libertad y deber cívico. Empírica: niveles de participación. Comparada: países distintos. Histórica: evolución del sufragio."], ["¿Por qué el conflicto es motor de la política?", "Revela demandas y desigualdades no atendidas, impulsando reformas."], ["¿Por qué es necesario el consenso en democracias plurales?", "Sin acuerdos mínimos, cada conflicto amenazaría la existencia misma del sistema."], ["¿Qué significa que conflicto y consenso sean dinámicos?", "Se combinan: el conflicto expresa tensiones, el consenso las canaliza con procedimientos."], ["¿Qué tensión existe entre democracia y élites?", "La democracia promete igualdad política, pero minorías organizadas concentran las decisiones."], ["¿Qué sostiene Mosca sobre la clase dirigente?", "Una minoría organizada gobierna sobre una mayoría menos organizada."], ["¿Qué es la circulación de las élites de Pareto?", "Las élites se renuevan y reemplazan, pero persiste la diferencia entre gobernantes y gobernados."], ["¿Qué es la ley de hierro de la oligarquía de Michels?", "Incluso organizaciones democráticas tienden a desarrollar minorías dirigentes."], ["¿Cómo limitar la concentración de poder de las élites?", "Mediante competencia electoral, alternancia, transparencia y controles institucionales."], ["¿Cuáles son los campos de la Ciencia Política?", "Teoría Política, Análisis institucional, Comportamiento político, Política comparada y Relaciones Internacionales."], ["¿Cómo estudiar un problema paraguayo con las 4 perspectivas?", "Aplicando enfoque normativo, empírico, comparado e histórico a un mismo fenómeno, como la abstención electoral."]]}, {"id": "u3", "title": "Unidad III", "subtitle": "Estado y sociedad. Poder y legitimidad", "sections": [{"h": "1. Estado y sociedad", "p": ["La política puede comprenderse, en gran medida, a partir de la relación entre Estado y sociedad. El Estado concentra instituciones, normas y capacidades de decisión; la sociedad está integrada por individuos, organizaciones, empresas, asociaciones, movimientos, iglesias, medios de comunicación y múltiples grupos que formulan demandas, defienden intereses y producen valores. El Estado surge históricamente de la sociedad, pero una vez institucionalizado también organiza y transforma la vida social: establece reglas, recauda recursos, presta servicios, reconoce derechos y adopta decisiones obligatorias.", "Norberto Bobbio permite presentar dos maneras de interpretar la aparición del Estado moderno: como continuidad y como discontinuidad respecto de organizaciones políticas anteriores. La discontinuidad destaca que el Estado moderno posee mayor concentración del poder, administración profesional y monopolio de la coerción. La continuidad recuerda que antes del Estado moderno ya existían ciudades, imperios y reinos capaces de gobernar y recaudar recursos."]}, {"h": "2. Expansión y límites del Estado", "p": ["El Estado no ha tenido siempre el mismo protagonismo. Durante el siglo XX, especialmente con la expansión del Estado de Bienestar, aumentaron las responsabilidades públicas en salud, educación, seguridad social y regulación económica. La tecnología y las comunicaciones también ampliaron la capacidad estatal para administrar información y prestar servicios a gran escala.", "Sin embargo, mayor capacidad no significa poder ilimitado. Las constituciones, los derechos, la división de poderes, la sociedad civil, el mercado y el entorno internacional imponen límites a la acción estatal. La soberanía, en el mundo contemporáneo, coexiste con organizaciones internacionales, tratados y procesos de integración que implican compartir determinadas competencias, como demuestra el caso de la Unión Europea."]}, {"h": "3-5. Mapa de actores: el Estado, la sociedad y los partidos", "p": ["El Estado no actúa como un actor único: está compuesto por instituciones con funciones diferentes. El gobierno dirige la acción estatal y formula políticas públicas. El Parlamento debate y aprueba leyes y controla al Ejecutivo. El Poder Judicial resuelve conflictos y controla la constitucionalidad de normas. Las Fuerzas Armadas y cuerpos de seguridad poseen recursos coercitivos específicos. La administración pública implementa normas y aporta continuidad más allá de los cambios de gobierno.", "La sociedad tampoco es un actor único: ciudadanos, empresas, sindicatos, iglesias, medios y movimientos sociales participan con intereses y recursos diferentes. Los partidos políticos ocupan una posición particular porque se originan en la sociedad civil pero buscan acceder a las instituciones estatales: son organizaciones de ciudadanos que compiten por el poder mediante elecciones y articulan demandas, programas y liderazgos."]}, {"h": "5.1-5.2 Élites políticas y grupos de interés", "p": ["Las élites políticas son grupos relativamente reducidos de personas que ocupan posiciones de mando y poseen capacidad significativa para influir sobre decisiones públicas. La existencia de élites es compatible con la democracia; el problema democrático se relaciona con la forma en que son seleccionadas, controladas y reemplazadas. La circulación de élites —cuando existe competencia y alternancia— es un indicador de que el poder se encuentra menos cerrado.", "Los grupos de interés son actores colectivos organizados que buscan influir sobre decisiones estatales sin necesariamente competir directamente por el gobierno. Sindicatos, asociaciones empresariales, gremios profesionales y ONG son ejemplos frecuentes. Sus estrategias incluyen lobby, movilización social, campañas públicas y negociación institucional."]}, {"h": "6-7. ¿Qué es el poder? Las tres caras de Lukes", "p": ["El poder es uno de los conceptos más discutidos de las ciencias políticas: es polisémico porque puede referirse a dominación, capacidad de actuar, cooperación, autonomía o control de recursos. Una definición clásica entiende el poder como una relación en la que un actor A logra que otro actor B actúe de una manera que de otro modo no habría elegido. El poder puede ejercerse mediante coerción, incentivos, persuasión o reglas institucionales.", "Steven Lukes propone comprender el poder a partir de diferentes niveles de visibilidad. La primera cara del poder se observa en decisiones abiertas y conflictos visibles. La segunda cara se relaciona con el control de la agenda: un actor puede ejercer poder evitando que determinados temas lleguen a discutirse. La tercera cara es más profunda: consiste en influir sobre las preferencias, percepciones y creencias de las personas, mediante la cultura, los valores y el sentido común."], "tb": [["Cara del poder", "Pregunta", "Manifestación"], ["Primera", "¿Quién gana una decisión visible?", "Conflictos, votaciones y decisiones abiertas"], ["Segunda", "¿Quién decide qué se discute?", "Control de agenda y exclusión de temas"], ["Tercera", "¿Quién influye sobre lo que consideramos normal?", "Cultura, valores, discursos y preferencias"]], "q": {"t": "El poder no siempre aparece en una orden directa ni en una decisión observable: puede actuar sobre la forma en que las personas interpretan sus intereses y el mundo político.", "c": "Steven Lukes — Manual de Unidad III"}}, {"h": "8. Fuentes y tipos de poder", "p": ["El poder no tiene una única fuente. El poder económico deriva del control de recursos, propiedad, capital y capacidad de gestión. El poder político se vincula con el control de instituciones estatales y, en última instancia, el monopolio legítimo de la coerción. El poder ideológico o intelectual se apoya en conocimiento, símbolos, información y capacidad de definir interpretaciones: medios de comunicación, instituciones educativas y productores culturales pueden influir sobre percepciones y preferencias.", "El poder puede analizarse en diferentes escalas: en el nivel micro aparece en relaciones interpersonales; en el nivel meso, dentro de organizaciones; en el nivel macro, en grandes estructuras como el Estado o el sistema de medios."]}, {"h": "9-10. Liderazgo, obediencia y los tipos de dominación de Weber", "p": ["En las democracias, el acceso a posiciones centrales de poder político se produce principalmente mediante elecciones, pero ganar una elección no depende solamente de programas partidarios: el liderazgo, la capacidad de persuasión y la confianza también influyen. Max Weber utilizó el concepto de carisma para describir una forma de autoridad basada en la creencia en cualidades extraordinarias de un líder.", "Todo orden político necesita algún grado de obediencia, que puede provenir del miedo, la costumbre, el interés o la legitimidad. Weber distingue tres tipos ideales de dominación legítima: la tradicional se basa en la creencia en costumbres heredadas; la carismática se apoya en la devoción hacia cualidades extraordinarias de un líder; la legal-racional se basa en normas impersonales y procedimientos, característica de la burocracia y el Estado moderno."], "tb": [["Tipo", "Base de legitimidad", "Se obedece a"], ["Tradicional", "Costumbre y herencia", "Autoridad legitimada por la tradición"], ["Carismática", "Cualidades extraordinarias atribuidas al líder", "Persona del líder"], ["Legal-racional", "Normas y procedimientos impersonales", "Cargo y orden jurídico"]]}, {"h": "11. Legitimidad democrática contemporánea y la oposición leal", "p": ["En las democracias actuales, la legitimidad no depende de una única fuente. Juan Linz destaca la socialización política, la eficacia (capacidad de diseñar respuestas) y la efectividad (capacidad de implementarlas) como factores que fortalecen o debilitan la aceptación de un régimen. Obtener resultados no vuelve democrático a un régimen autoritario: la legitimidad democrática requiere también reglas, derechos y competencia.", "Una democracia necesita oposición, pero también requiere que los actores que pierden una elección continúen reconociendo la legitimidad del sistema. La oposición leal critica al gobierno y compite por reemplazarlo, pero acepta las reglas fundamentales de la democracia. Cuando los adversarios comienzan a tratarse como enemigos ilegítimos, la estabilidad democrática puede debilitarse."]}, {"h": "13. Aplicación al caso paraguayo", "p": ["El caso paraguayo permite observar las interacciones entre Estado y sociedad: las instituciones estatales incluyen Poder Ejecutivo, Congreso y Poder Judicial, mientras partidos, empresas, sindicatos y organizaciones sociales buscan influir sobre decisiones públicas. Los partidos paraguayos muestran claramente la frontera porosa entre sociedad y Estado. Desde la perspectiva de la legitimidad, lo relevante para la estabilidad del sistema es que los actores continúen reconociendo procedimientos constitucionales, elecciones y oposición legítima, más allá de la crítica a un gobierno concreto."]}], "glossary": [["Estado moderno", "Organización política institucionalizada con coerción legítima."], ["Sociedad civil", "Individuos y organizaciones no estatales."], ["Grupo de interés", "Organización que influye en decisiones sin competir por el gobierno."], ["Control de agenda", "Determinar qué temas se discuten (2ª cara del poder, Lukes)."], ["Poder ideológico", "Influencia sobre valores, símbolos y preferencias."], ["Carisma", "Autoridad fundada en cualidades extraordinarias del líder."], ["Dominación legal-racional", "Autoridad basada en normas impersonales."], ["Oposición leal", "Compite con el gobierno pero acepta las reglas democráticas."]], "repaso": [["¿Por qué Estado y sociedad son ámbitos diferentes pero interdependientes?", "El Estado concentra instituciones y decisión; la sociedad produce demandas, conflictos e identidades."], ["¿Continuidad y discontinuidad del Estado moderno?", "Continuidad: el poder político ya existía antes. Discontinuidad: el Estado moderno tiene mayor escala e institucionalización."], ["¿Cómo cambió el protagonismo estatal desde el s. XIX?", "De Estado liberal limitado a Estado de Bienestar (1914-1970) y luego reformas de mercado desde 1980."], ["¿Efectos de la globalización sobre la soberanía?", "La soberanía ya no es absoluta: se comparten competencias mediante tratados y organismos internacionales."], ["¿Principales actores dentro del Estado y de la sociedad?", "Estado: gobierno, Parlamento, Judicial, FF.AA. Sociedad: ciudadanos, empresas, sindicatos, medios, movimientos."], ["¿Por qué los partidos tienen doble naturaleza?", "Nacen en la sociedad civil, pero al ganar elecciones ocupan instituciones estatales."], ["¿Qué son las élites políticas y por qué importa su circulación?", "Grupos reducidos con posiciones de mando; su renovación evita que el poder se cierre."], ["¿Diferencia entre partido político y grupo de interés?", "El partido compite por el gobierno; el grupo de interés influye sin competir directamente."], ["¿Por qué el poder no se reduce a coerción?", "También opera mediante incentivos, persuasión y reglas institucionales."], ["¿Las tres caras del poder de Lukes?", "Primera: decisiones visibles. Segunda: control de agenda. Tercera: influencia sobre preferencias y creencias."], ["¿Fuentes de poder económico, político e ideológico?", "Económico: recursos y capital. Político: instituciones y coerción legítima. Ideológico: conocimiento y medios."], ["¿Relación entre liderazgo y carisma?", "El carisma es una base de legitimidad que sostiene el liderazgo mediante devoción personal (Weber)."], ["¿Por qué obedecen las personas a una autoridad?", "Por miedo, costumbre, conveniencia, o porque creen que la autoridad tiene derecho legítimo a mandar."], ["¿Dominaciones tradicional, carismática y legal-racional de Weber?", "Tradicional: costumbre. Carismática: cualidades del líder. Legal-racional: normas impersonales."], ["¿Relación entre eficacia, efectividad y legitimidad?", "Ambas fortalecen la legitimidad, pero resultados no vuelven democrático a un régimen autoritario."], ["¿Qué significa que una oposición sea leal?", "Critica y compite con el gobierno, pero acepta las reglas democráticas fundamentales."], ["¿Cómo identificar fuentes de poder y legitimidad en Paraguay?", "Observando poder político, económico e ideológico y evaluando si se acepta el régimen democrático más allá del gobierno de turno."]]}];
let cur=0;
function renderNav(){
  document.getElementById('nav').innerHTML = UNITS.map((u,i)=>`<div class="nav-unit ${i===cur?'active':''}" onclick="load(${i})">${u.title}: ${u.subtitle}</div>`).join('');
}
function render(){
  const u=UNITS[cur];
  let html = `<h1>${u.title}: ${u.subtitle}</h1>`;
  u.sections.forEach(s=>{
    html += `<h2>${s.h}</h2>`;
    if(s.p) s.p.forEach(p=>html+=`<p>${p}</p>`);
    if(s.q) html += `<blockquote>"${s.q.t}"<span>— ${s.q.c}</span></blockquote>`;
    if(s.tb){
      html += '<table><tr>'+s.tb[0].map(h=>`<th>${h}</th>`).join('')+'</tr>';
      s.tb.slice(1).forEach(r=>html+='<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>');
      html += '</table>';
    }
  });
  document.getElementById('frame').innerHTML = html;
  hide();
}
function load(i){cur=i;renderNav();render();}
function showTool(k){
  hide();
  const u=UNITS[cur];
  if(k==='g'){document.getElementById('pg').style.display='block';document.getElementById('lg').innerHTML=u.glossary.map(g=>`<div class="pill" onclick="alert('${g[0].replace(/'/g,"\\'")}: ${g[1].replace(/'/g,"\\'")}')">🔑 ${g[0]}</div>`).join('');}
  else if(k==='f'){document.getElementById('pf').style.display='block';document.getElementById('lf').innerHTML=u.glossary.map((g,i)=>`<div class="card" id="c${i}" data-t="${g[0]}" data-d="${g[1].replace(/"/g,'&quot;')}" data-fl="0" onclick="flip(${i})">${g[0]}</div>`).join('');}
  else if(k==='r'){document.getElementById('pr').style.display='block';document.getElementById('lr').innerHTML=`<div class="cnt">${u.repaso.length} preguntas — ${u.title}</div>`+u.repaso.map((qa,i)=>`<div class="rp"><div class="rp-q" onclick="tg(${i})">${i+1}. ${qa[0]}</div><div class="rp-a" id="a${i}">${qa[1]}</div></div>`).join('');}
}
function tg(i){document.getElementById('a'+i).classList.toggle('open');}
function hide(){['pg','pf','pr'].forEach(id=>document.getElementById(id).style.display='none');}
function flip(i){const el=document.getElementById('c'+i);const fl=el.getAttribute('data-fl')==='1';el.innerHTML=fl?el.getAttribute('data-t'):el.getAttribute('data-d');el.setAttribute('data-fl',fl?'0':'1');}
renderNav();render();
</script>
