ius:22px;padding:clamp(22px,4vw,40px);box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:220px;height:220px;border:40px solid #ffffff14;border-radius:50%;right:-80px;top:-100px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;opacity:.75;font-weight:800}.hero h1{font-family:Georgia,serif;font-size:clamp(27px,4vw,42px);line-height:1.12;margin:10px 0}.hero p{max-width:650px;line-height:1.6;color:#dce8ff;margin:0}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}.primary,.ghost{border-radius:12px;padding:10px 13px;font-weight:750;cursor:pointer;border:0}.primary{background:#fff;color:var(--blue2)}.ghost{background:#ffffff17;color:#fff;border:1px solid #ffffff35}.content{margin-top:18px}.section{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 4px 14px rgba(15,23,42,.035)}.section-head{width:100%;border:0;background:transparent;color:var(--ink);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;text-align:left;cursor:pointer;font-size:15px;font-weight:800}.section-head:hover{background:var(--sky)}.chev{color:var(--blue);font-size:18px}.section-body{display:none;padding:0 18px 20px}.section.open .section-body{display:block}.section.open .chev{transform:rotate(180deg)}.section p{font-size:16px;line-height:1.78;margin:13px 0;color:var(--ink)}blockquote{margin:18px 0;padding:16px 18px;border-left:4px solid var(--blue);background:var(--sky);border-radius:0 12px 12px 0;font-family:Georgia,serif;font-size:16px;line-height:1.55}blockquote span{display:block;margin-top:9px;font-family:Inter,system-ui,sans-serif;font-size:12px;color:var(--muted);font-weight:700}.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:16px}table{border-collapse:collapse;width:100%;min-width:490px;font-size:13px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--sky);color:var(--blue2)}tr:last-child td{border-bottom:0}.tool-card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px;margin-bottom:10px}.tool-card h3{font-size:13px;margin:0 0 10px}.tool{width:100%;border:0;border-radius:10px;padding:11px;text-align:left;font-weight:750;color:#fff;background:var(--blue);cursor:pointer;margin-top:7px}.tool.green{background:var(--good)}.tool.orange{background:var(--warm)}.tool:hover{filter:brightness(1.05);transform:translateY(-1px)}.chip{display:block;width:100%;border:1px solid var(--line);background:var(--sky);color:var(--blue2);border-radius:9px;padding:9px;text-align:left;cursor:pointer;font-size:12px;margin:6px 0}.panel{display:none;margin-top:12px}.panel.show{display:block}.glossary-open{display:flex;flex-direction:column;gap:8px;margin-top:8px}.gloss-item{border:1px solid var(--line);background:var(--sky);border-radius:12px;padding:10px 12px}.gloss-item b{display:block;color:var(--blue2);font-size:13px;margin-bottom:3px}.gloss-item span{display:block;font-size:12.5px;color:var(--muted);line-height:1.5}.question{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:8px 0}.question button{width:100%;border:0;background:var(--card);padding:11px;text-align:left;color:var(--ink);font-size:12px;font-weight:750;cursor:pointer}.answer{display:none;padding:11px;background:var(--sky);font-size:12px;line-height:1.5;color:var(--muted)}.answer.show{display:block}.bottom{display:none}.scrim{display:none}.chapter-mark{display:flex;gap:9px;align-items:center;margin-bottom:12px}.chapter-mark .n{font-size:11px;font-weight:800;background:var(--sky);color:var(--blue2);padding:6px 8px;border-radius:8px}.mobile-tools{display:none}

<script>
const UNITS=[{"id": "u1", "title": "Unidad I", "subtitle": "La política como poder y como participación", "sections": [{"h": "1. ¿Qué es la política?", "p": ["La pregunta por la política atraviesa la historia del pensamiento occidental. Aristóteles sostuvo que el ser humano es un animal político: vive en comunidad y desarrolla su existencia dentro de formas de organización colectiva. Desde esta perspectiva, imaginar una sociedad completamente carente de política resulta difícil, porque toda convivencia plantea problemas de decisión, autoridad, cooperación y conflicto.", "Max Weber vinculó la política con la dirección o influencia sobre la dirección de una asociación política, especialmente el Estado. Esta definición coloca en el centro la disputa por orientar decisiones colectivas. Las perspectivas contemporáneas amplan todavía más el concepto: la política puede estudiarse como conflicto y decisión, como representación y negociación, como distribución de recursos escasos y como mecanismo para procesar conflictos colectivos.", "En consecuencia, la política aparece también en la vida cotidiana cuando una comunidad reclama una obra pública, cuando estudiantes eligen representantes, cuando una organización intenta modificar una ley o cuando ciudadanos discuten prioridades presupuestarias."], "q": {"t": "La política es el proceso mediante el cual una sociedad organiza el poder, procesa sus conflictos, construye representación, adopta decisiones colectivas y define reglas para convivir.", "c": "Manual de Unidad I"}}, {"h": "2. La política como poder", "p": ["El poder es uno de los elementos centrales de la política. Organizar, decidir, imponer, persuadir o negociar implica relaciones en las que determinados actores poseen capacidad para incidir sobre otros o sobre resultados colectivos. En un sentido introductorio, podemos definir el poder como la capacidad de influir sobre conductas o decisiones. Esa influencia puede provenir de una posición institucional, de recursos materiales, del prestigio, del conocimiento, de la capacidad de movilización o de la posibilidad de aplicar sanciones.", "El poder no debe entenderse automáticamente como algo negativo. Toda organización política necesita capacidad para adoptar y ejecutar decisiones. El problema democrático no es eliminar el poder, sino determinar cómo se obtiene, cómo se ejerce, con qué límites y bajo qué controles.", "El material de cátedra distingue tres formas básicas de ejercicio del poder. El poder coercitivo obtiene obediencia mediante fuerza o amenaza de sanción. El poder persuasivo modifica conductas mediante ideas, discursos, símbolos, información o prestigio. El poder legítimo es aceptado porque quienes obedecen consideran válido el derecho de una autoridad a decidir. Un mismo actor puede combinar estas dimensiones: un presidente electo posee autoridad derivada de reglas constitucionales, puede persuadir mediante discursos y negociación, y dispone, dentro de límites jurídicos, de instituciones capaces de hacer cumplir determinadas decisiones."], "tb": [["Forma", "Fundamento", "Ejemplo"], ["Coerción", "Fuerza, amenaza o sanción", "Cumplimiento ante una sanción prevista"], ["Persuasión/influencia", "Ideas, prestigio, información o negociación", "Movimiento que instala un tema en la agenda"], ["Autoridad legítima", "Reconocimiento del derecho a decidir", "Sentencia de un juez competente"]]}, {"h": "3. Tres miradas sobre el poder: Weber, Arendt y Foucault", "p": ["Max Weber estudia el poder y, especialmente, las razones por las que la dominación puede ser considerada legítima. Distingue autoridad tradicional, carismática y legal-racional. La primera se apoya en costumbres heredadas; la segunda, en cualidades extraordinarias atribuidas a una persona; la tercera, en reglas impersonales, cargos e instituciones.", "Hannah Arendt propone distinguir poder y violencia. Para ella, el poder surge de la capacidad humana de actuar conjuntamente y depende del apoyo y la acción colectiva. La violencia puede destruir poder, pero no equivale a él. Esta mirada permite pensar la política no solamente como dominación, sino también como cooperación.", "Michel Foucault cuestiona la idea de que el poder se encuentre concentrado únicamente en el Estado o en una autoridad superior. El poder circula a través de redes y relaciones sociales; aparece en instituciones como escuelas, hospitales, prisiones y otros espacios. Además, no actúa únicamente reprimiendo: también produce saberes, categorías y conductas.", "Las tres perspectivas permiten observar dimensiones diferentes: Weber ayuda a comprender autoridad y legitimidad; Arendt, la acción colectiva; Foucault, las relaciones difusas y cotidianas de poder."]}, {"h": "4-5. Tener poder y ejercer poder", "p": ["Tener una posición, recursos o prestigio no significa necesariamente utilizarlos con éxito. El poder se vuelve observable cuando un actor consigue decidir, influir, negociar, movilizar, imponer o transformar. El ejemplo utilizado en clase sobre Taylor Swift permite mostrar esta diferencia: una figura pública no necesita ocupar un cargo para producir efectos políticos. Puede carecer de autoridad formal y de capacidad coercitiva, pero influir sobre conductas mediante visibilidad, prestigio y capacidad de comunicación.", "El poder político puede adoptar diversas formas prácticas. Decidir significa elegir entre alternativas que afectan a una colectividad. Distribuir supone asignar recursos, derechos, cargas u oportunidades. Regular implica establecer reglas y límites. Negociar consiste en construir acuerdos entre actores con intereses diferentes. Movilizar significa generar apoyo y acción colectiva. Transformar supone modificar políticas, instituciones o relaciones sociales."]}, {"h": "6. La política como participación", "p": ["La política no consiste únicamente en observar quién manda. También comprende las formas en que la ciudadanía interviene en los asuntos comunes. Participar significa intentar incidir, opinar, decidir u organizarse respecto de cuestiones públicas. La participación es una dimensión fundamental de la democracia porque permite expresar demandas, seleccionar representantes, controlar autoridades y construir acción colectiva.", "Las formas institucionales utilizan canales formalmente reconocidos por el sistema político: el voto, la militancia y afiliación partidaria, las candidaturas, las peticiones a autoridades y las audiencias públicas. Las formas no institucionales utilizan canales menos formalizados, aunque no necesariamente ilegales: marchas, protestas, campañas digitales, movimientos sociales y otras formas de movilización."], "tb": [["Participación institucional", "Participación no institucional"], ["Voto y elecciones", "Marchas y protestas"], ["Partidos y candidaturas", "Campañas digitales"], ["Peticiones y audiencias públicas", "Movimientos sociales"]]}, {"h": "7-8. Del poder al liderazgo", "p": ["El poder necesita actores que lo ejerzan. Aquí aparece el liderazgo político como una relación entre poder y sociedad. Tener autoridad formal no equivale necesariamente a conseguir que otros acompañen una orientación política. Un gobernante ocupa un cargo y posee competencias establecidas por normas; un líder, en cambio, necesita adhesión, seguimiento y capacidad para orientar conductas.", "Las razones del seguimiento son diversas: la legitimidad produce apoyo cuando se reconoce el derecho de alguien a conducir; la identificación aparece cuando una persona siente que el líder representa sus valores; las ideas generan adhesión a un programa; los intereses también importan; los resultados pueden fortalecer el liderazgo cuando existe percepción de eficacia; finalmente, el carisma produce una relación emocional y personal particularmente intensa entre líder y seguidores."]}, {"h": "9-11. Liderazgo transaccional, transformacional y tradiciones latinoamericanas", "p": ["James MacGregor Burns distingue dos formas ideales de liderazgo. El liderazgo transaccional se construye mediante intercambios concretos, negociación de intereses, acuerdos y recompensas. El liderazgo transformacional busca modificar valores, expectativas y objetivos colectivos, construyendo una visión de cambio.", "La historia política latinoamericana ha conocido formas de liderazgo fuertemente personalizadas. El caudillismo organiza el poder alrededor de una figura con fuerte autoridad personal. El personalismo coloca al líder por encima del partido, el programa y las instituciones. El clientelismo se basa en intercambios particularizados de recursos por apoyo político. El patronazgo utiliza cargos y recursos públicos para construir redes de apoyo."], "tb": [["Concepto", "Rasgo central"], ["Caudillismo", "Autoridad política concentrada en una figura personal"], ["Personalismo", "Centralidad del líder frente al programa o instituciones"], ["Clientelismo", "Intercambio particularizado de beneficios por apoyo político"], ["Patronazgo", "Uso de cargos y recursos estatales para construir apoyos"]]}, {"h": "12-13. Miradas clásicas y tipos de liderazgo político", "p": ["Platón propone el ideal del filósofo-rey: gobernar correctamente requiere conocimiento y virtud. Aristóteles desplaza la pregunta desde quién gobierna hacia para quién gobierna, distinguiendo formas correctas (orientadas al bien común) y formas desviadas (orientadas al interés particular). Maquiavelo introduce una mirada realista: la virtud (capacidad, decisión, audacia) y la fortuna (circunstancias no controladas) explican la conquista y conservación del poder. Weber, finalmente, distingue legitimidades tradicional, carismática y legal-racional.", "El material distingue liderazgo presidencial (legitimidad electoral y recursos institucionales), carismático (relación personal y emocional), partidario (surge de la organización interna) e intelectual (las ideas también ejercen poder; la noción gramsciana de intelectual orgánico vincula producción de ideas con intereses de grupos sociales)."], "tb": [["¿Quién gobierna?", "Busca el bien común", "Busca interés propio"], ["Uno", "Monarquía", "Tiranía"], ["Pocos", "Aristocracia", "Oligarquía"], ["Muchos", "Politeia", "Democracia (desviada)"]]}, {"h": "14. Liderazgo y democracia: democracia delegativa", "p": ["Las democracias necesitan capacidad de conducción, pero esa necesidad genera una pregunta decisiva: ¿quién controla a quien lidera? Guillermo O'Donnell utiliza el concepto de democracia delegativa para analizar situaciones en las que un presidente electo interpreta su victoria como una autorización amplia para gobernar con restricciones institucionales débiles, considerando los controles como obstáculos."], "q": {"t": "Elección democrática no equivale a poder ilimitado. La fortaleza de un liderazgo debe evaluarse no solamente por su capacidad de actuar, sino también por la forma en que reconoce límites y contrapesos.", "c": "Regla fundamental — Unidad I, sección 14"}}, {"h": "16-17. Lógica personalista, institucional y el sistema político de Easton", "p": ["La lógica personalista coloca a la persona en el centro: predominan lealtades personales, decisiones concentradas y dependencia del proyecto respecto de su figura. La lógica institucional coloca las reglas en el centro: competencias definidas, organizaciones estables y continuidad más allá de las personas.", "El sistema político es el conjunto de instituciones, actores, normas y relaciones mediante los cuales se organiza y ejerce el poder político. David Easton propone analizar la política como un sistema: la sociedad genera inputs en forma de demandas y apoyos; el sistema político procesa esos estímulos y produce outputs (decisiones, leyes, políticas públicas); la sociedad evalúa los resultados y genera feedback, que puede convertirse en nuevas demandas."]}, {"h": "18-21. Conceptos básicos y aplicación al caso paraguayo", "p": ["Estado, gobierno y nación no son sinónimos: el Estado es una organización política y jurídica relativamente permanente; el gobierno es el conjunto temporal de autoridades; la nación es una comunidad construida alrededor de elementos históricos y simbólicos. Poder, autoridad y legitimidad tampoco significan lo mismo: el poder es capacidad de influir; la autoridad es poder reconocido como válido; la legitimidad es la creencia de que el ejercicio del poder es válido o justificable.", "Los conceptos de la unidad permiten formular preguntas sobre la realidad paraguaya sin reducir el análisis a personas concretas: qué recursos institucionales posee la Presidencia, cómo se construyen mayorías en el Congreso, qué papel cumplen los partidos, cómo participan organizaciones sociales y qué actores consiguen instalar temas en la agenda."]}], "glossary": [["Política", "Proceso mediante el cual una sociedad organiza el poder y adopta decisiones colectivas."], ["Poder", "Capacidad de influir sobre conductas o decisiones."], ["Autoridad", "Poder reconocido como válido para adoptar decisiones."], ["Legitimidad", "Creencia de que el ejercicio del poder es válido o justificable."], ["Liderazgo transaccional", "Conducción basada en negociación e intercambios concretos."], ["Liderazgo transformacional", "Conducción orientada a modificar valores y objetivos colectivos."], ["Clientelismo", "Intercambio particularizado de recursos o beneficios por apoyo político."], ["Democracia delegativa", "El presidente interpreta la elección como delegación amplia (O'Donnell)."], ["Sistema político", "Instituciones y relaciones mediante las cuales se organiza el poder."]], "repaso": [["¿Por qué la política no puede reducirse a elecciones, partidos o cargos públicos?", "Porque existe política donde hay relaciones de poder y decisiones que afectan a otros, no solo en elecciones o cargos formales."], ["¿Qué significa definir la política a partir del poder y la participación?", "Permite preguntar quién decide e influye (poder) y cómo interviene la ciudadanía en los asuntos comunes (participación)."], ["¿Qué diferencias existen entre coerción, influencia y autoridad legítima?", "Coerción usa fuerza o amenaza de sanción; la persuasión usa ideas y prestigio; la autoridad legítima se acepta porque se reconoce el derecho a decidir."], ["¿Cómo se diferencian las miradas de Weber, Arendt y Foucault sobre el poder?", "Weber analiza legitimidad y tipos de autoridad; Arendt distingue poder de violencia; Foucault ve el poder circulando en redes sociales, no solo en el Estado."], ["¿Por qué tener poder no equivale necesariamente a ejercerlo?", "Porque poseer recursos no garantiza usarlos con éxito: el poder se hace observable cuando efectivamente se decide, influye o transforma algo."], ["¿Puede una persona sin cargo público ejercer poder político? Fundamente.", "Sí, mediante visibilidad, prestigio y comunicación (caso Taylor Swift), evitando confundir influencia con causalidad directa."], ["¿Qué formas institucionales y no institucionales de participación existen?", "Institucionales: voto, militancia, peticiones. No institucionales: marchas, protestas, campañas digitales."], ["¿Qué diferencia existe entre inclusión formal e inclusión efectiva en la política?", "Formal es poseer el derecho; efectiva es contar con condiciones reales (educación, recursos) para ejercerlo."], ["¿Por qué liderazgo y autoridad no son sinónimos?", "La autoridad formal no garantiza adhesión; el liderazgo requiere capacidad real de movilizar a otros."], ["¿Qué papel cumplen los seguidores y el contexto en el liderazgo?", "Los seguidores aportan apoyo y movilización; el contexto crea oportunidades o restricciones."], ["¿Diferencia entre liderazgo transaccional y transformacional?", "Transaccional: intercambios concretos. Transformacional: modifica valores y objetivos colectivos."], ["¿Qué limita la visión tradicional del 'gran hombre'?", "Ignora que sin seguidores no hay liderazgo y oculta liderazgos colectivos y de grupos excluidos."], ["¿Cómo se distinguen caudillismo, personalismo, clientelismo y patronazgo?", "Caudillismo: autoridad personal territorial. Personalismo: centralidad del líder. Clientelismo: beneficios por apoyo. Patronazgo: uso de cargos estatales."], ["¿Qué preguntan Platón, Aristóteles, Maquiavelo y Weber sobre el gobierno?", "Platón: filósofo-rey. Aristóteles: bien común vs. interés propio. Maquiavelo: virtud y fortuna. Weber: por qué obedecemos."], ["¿Características del liderazgo presidencial, carismático, partidario e intelectual?", "Presidencial: legitimidad electoral. Carismático: vínculo emocional. Partidario: organización interna. Intelectual: influencia de ideas."], ["¿Por qué una victoria electoral no implica poder ilimitado?", "Porque el gobierno sigue sometido a la Constitución, separación de poderes y controles institucionales."], ["¿Qué es la democracia delegativa de O'Donnell?", "El presidente interpreta su victoria como autorización amplia y debilita controles institucionales."], ["¿Diferencia entre lógica personalista y lógica institucional?", "Personalista: lealtades al líder. Institucional: reglas y competencias definidas, más allá de las personas."], ["¿Cómo funciona el sistema político de Easton?", "Inputs (demandas) se procesan en outputs (decisiones), generando feedback que reingresa como nuevas demandas."], ["¿Diferencias entre Estado, gobierno y nación?", "Estado: estructura permanente. Gobierno: autoridades temporales. Nación: comunidad identitaria."], ["¿Diferencias entre poder, autoridad y legitimidad?", "Poder: capacidad de influir. Autoridad: poder reconocido válido. Legitimidad: creencia de que es justificable."], ["¿Cómo aplicar estos conceptos a la política paraguaya?", "Analizando recursos de la Presidencia, mayorías en el Congreso, partidos y participación social, sin reducir el análisis a personas."]]}, {"id": "u2", "title": "Unidad II", "subtitle": "El análisis de la política", "sections": [{"h": "1. La política como objeto de estudio científico", "p": ["La reflexión sobre la política es muy antigua. Desde la Antigüedad, filósofos, juristas e historiadores se preguntaron cuál era la mejor forma de gobierno, qué hacía legítima a una autoridad y cuáles eran las causas de los conflictos políticos. La Ciencia Política contemporánea conserva muchas de esas preguntas, pero se consolida como disciplina autónoma principalmente durante el siglo XX, recibiendo aportes de la filosofía, el Derecho, la sociología, la economía y la historia.", "Su campo incluye el poder, las instituciones, las decisiones colectivas, el comportamiento político, la participación y la representación. También estudia elecciones, partidos, políticas públicas, movimientos sociales, regímenes políticos y relaciones internacionales."], "q": {"t": "La objetividad no significa que el investigador carezca de valores personales, sino que debe evitar presentar sus preferencias como si fueran hechos demostrados.", "c": "Manual de Unidad II"}}, {"h": "1.1 ¿Cuándo un análisis político puede considerarse científico?", "p": ["Siguiendo a Norberto Bobbio, se destacan tres exigencias básicas. La primera es la comprobabilidad: las afirmaciones deben poder contrastarse con evidencia. La segunda es la explicación: la Ciencia Política no se limita a narrar acontecimientos, sino que intenta identificar causas, actores, intereses e instituciones. La tercera consiste en distinguir hechos y valores: el investigador debe separar lo que ocurre de lo que considera deseable.", "Estas tres ideas pueden resumirse en una fórmula útil: evidencia, explicación y objetividad analítica."]}, {"h": "2. Describir, explicar y evaluar", "p": ["Un mismo fenómeno político puede generar preguntas diferentes. Si el Congreso aprueba una reforma que provoca protestas, una pregunta normativa sería ¿la reforma es justa?; una pregunta empírica sería ¿qué sectores protestan y cuáles apoyan la medida?; una pregunta comparada investigaría qué ocurrió con reformas semejantes en otros países; y una pregunta histórica reconstruiría cómo se llegó a esa situación."], "tb": [["Tipo de pregunta", "Ejemplo", "Qué busca"], ["Normativa", "¿La decisión es justa?", "Evaluar según valores o principios"], ["Empírica", "¿Qué está ocurriendo realmente?", "Observar y explicar hechos"], ["Comparada", "¿Qué ocurrió en otros países?", "Identificar similitudes y patrones"], ["Histórica", "¿Cómo llegamos hasta acá?", "Reconstruir procesos en el tiempo"]]}, {"h": "3-7. Métodos y perspectivas del análisis político", "p": ["El método empírico se apoya en observación y recolección sistemática de datos (estadísticas, encuestas, entrevistas). El método comparado contrasta casos para identificar similitudes y diferencias, permitiendo estudiar cómo determinadas instituciones se relacionan con resultados políticos. El método histórico analiza procesos a través del tiempo, ayudando a distinguir cambio y continuidad. El enfoque normativo utiliza razonamiento filosófico para discutir principios como justicia, libertad e igualdad.", "La perspectiva normativa utiliza filosofía política y teorías de justicia: Platón se preguntó por el gobierno de los sabios; Rousseau reflexionó sobre la voluntad general; John Rawls formuló una teoría de la justicia basada en principios de equidad. La perspectiva empírica utiliza métodos cuantitativos (estadísticas, encuestas) y cualitativos (entrevistas, estudios de caso). La perspectiva comparada contrasta países, instituciones o períodos históricos. La perspectiva histórica estudia documentos, archivos y fuentes para comprender la evolución de instituciones y prácticas."]}, {"h": "9-10. Conflicto y consenso", "p": ["La política surge, en buena medida, porque las sociedades contienen diversidad. Cuando esas diferencias afectan decisiones colectivas aparece el conflicto político, que puede manifestarse socialmente (huelgas, protestas), institucionalmente (debates parlamentarios) o internacionalmente (tensiones entre Estados). Carl Schmitt enfatiza la distinción política entre amigo y enemigo; las perspectivas marxistas destacan el conflicto entre clases sociales.", "La existencia de conflicto no elimina la necesidad de acuerdos. Una Constitución puede funcionar como pacto básico de convivencia. John Rawls utiliza la idea de consenso traslapado para explicar cómo personas con concepciones morales distintas pueden coincidir en principios políticos fundamentales. La vida política requiere un equilibrio dinámico entre conflicto y consenso: el conflicto expresa demandas; el consenso proporciona procedimientos para canalizarlas."], "tb": [["Conflicto", "Consenso"], ["Expresa diferencias de intereses y valores", "Establece acuerdos mínimos para convivir"], ["Puede impulsar cambios", "Aporta estabilidad y legitimidad"], ["Se manifiesta en protestas y disputas", "Se manifiesta en reglas y procedimientos"]]}, {"h": "11-13. Democracia y élites: Mosca, Pareto y Michels", "p": ["El material de cátedra define la democracia a partir de soberanía popular, igualdad política y participación ciudadana. Sin embargo, las sociedades modernas son demasiado complejas para que todas las personas participen directamente en cada decisión, lo que crea una tensión entre participación amplia y concentración de decisiones en grupos relativamente pequeños.", "Gaetano Mosca sostiene que en las sociedades existe una minoría organizada —la clase dirigente— que gobierna sobre una mayoría más numerosa pero menos organizada. Vilfredo Pareto propone la circulación de las élites: los grupos dominantes se renuevan y son reemplazados por nuevas minorías, sin que desaparezca la diferencia entre gobernantes y gobernados. Robert Michels formula la ley de hierro de la oligarquía: incluso organizaciones creadas con ideales democráticos tienden a desarrollar minorías dirigentes, porque las organizaciones complejas necesitan coordinación, experiencia e información que otorgan ventajas a quienes las controlan."], "tb": [["Autor", "Concepto central", "Idea principal"], ["Gaetano Mosca", "Clase dirigente", "Una minoría organizada gobierna sobre una mayoría menos organizada"], ["Vilfredo Pareto", "Circulación de élites", "Las élites se renuevan, pero persisten minorías dominantes"], ["Robert Michels", "Ley de hierro de la oligarquía", "Las organizaciones tienden a concentrar dirección en una minoría"]]}, {"h": "14. Campos de análisis en Ciencia Política", "p": ["La Ciencia Política se organiza en diferentes campos especializados que no son compartimentos completamente separados. La Teoría Política reflexiona sobre conceptos como poder, justicia y legitimidad. El Análisis institucional estudia estructuras políticas y su funcionamiento. El Comportamiento político analiza voto, abstención y opinión pública. La Política comparada contrasta sistemas de diferentes países. Las Relaciones Internacionales estudian diplomacia, cooperación y organismos internacionales como la ONU, la OEA o el MERCOSUR."], "tb": [["Campo", "Objeto principal"], ["Teoría Política", "Conceptos, valores e ideas"], ["Análisis institucional", "Instituciones y reglas"], ["Comportamiento político", "Ciudadanía y participación"], ["Política comparada", "Comparación entre sistemas"], ["Relaciones Internacionales", "Política entre Estados y actores"]]}, {"h": "16. Aplicación al caso paraguayo", "p": ["La abstención electoral paraguaya puede abordarse empíricamente mediante datos de participación, comparativamente mediante contraste con otros países, históricamente mediante evolución de elecciones anteriores, y normativamente mediante el debate sobre deber cívico y libertad. La relación entre democracia y élites también puede analizarse observando quiénes ocupan posiciones de liderazgo y qué mecanismos existen para controlar a quienes ejercen poder."]}], "glossary": [["Ciencia Política", "Disciplina que estudia sistemáticamente fenómenos de poder e instituciones."], ["Comprobabilidad", "Posibilidad de contrastar una afirmación con evidencia."], ["Conflicto político", "Disputa derivada de diferencias de intereses o valores."], ["Consenso", "Acuerdo mínimo que permite la convivencia política."], ["Élite", "Minoría que concentra posiciones o recursos relevantes de poder."], ["Circulación de élites", "Renovación y reemplazo de grupos dirigentes (Pareto)."], ["Ley de hierro de la oligarquía", "Las organizaciones tienden a desarrollar minorías dirigentes (Michels)."]], "repaso": [["¿Diferencia entre opinar sobre política y analizarla científicamente?", "Opinar es preferencia personal; analizar exige comprobabilidad, explicación causal y distinguir hechos de valores."], ["¿Condiciones para que un análisis político sea científico?", "Comprobabilidad, explicación causal y distinción entre hechos y valores (Bobbio)."], ["¿Por qué distinguir hechos de valores?", "Para no presentar preferencias personales como hechos demostrados."], ["¿Diferencia entre pregunta normativa y empírica?", "Normativa evalúa según valores; empírica observa y explica hechos."], ["¿Qué herramientas usa la perspectiva empírica?", "Métodos cuantitativos (estadísticas, encuestas) y cualitativos (entrevistas, estudios de caso)."], ["¿Qué aporta el método comparado?", "Contrastar casos para identificar similitudes, diferencias y patrones generales."], ["¿Por qué es importante el análisis histórico?", "Porque las estructuras actuales resultan de procesos anteriores; ayuda a distinguir cambio y continuidad."], ["¿Cómo aplicar las 4 perspectivas al voto obligatorio/voluntario?", "Normativa: libertad y deber cívico. Empírica: niveles de participación. Comparada: países distintos. Histórica: evolución del sufragio."], ["¿Por qué el conflicto es motor de la política?", "Revela demandas y desigualdades no atendidas, impulsando reformas."], ["¿Por qué es necesario el consenso en democracias plurales?", "Sin acuerdos mínimos, cada conflicto amenazaría la existencia misma del sistema."], ["¿Qué significa que conflicto y consenso sean dinámicos?", "Se combinan: el conflicto expresa tensiones, el consenso las canaliza con procedimientos."], ["¿Qué tensión existe entre democracia y élites?", "La democracia promete igualdad política, pero minorías organizadas concentran las decisiones."], ["¿Qué sostiene Mosca sobre la clase dirigente?", "Una minoría organizada gobierna sobre una mayoría menos organizada."], ["¿Qué es la circulación de las élites de Pareto?", "Las élites se renuevan y reemplazan, pero persiste la diferencia entre gobernantes y gobernados."], ["¿Qué es la ley de hierro de la oligarquía de Michels?", "Incluso organizaciones democráticas tienden a desarrollar minorías dirigentes."], ["¿Cómo limitar la concentración de poder de las élites?", "Mediante competencia electoral, alternancia, transparencia y controles institucionales."], ["¿Cuáles son los campos de la Ciencia Política?", "Teoría Política, Análisis institucional, Comportamiento político, Política comparada y Relaciones Internacionales."], ["¿Cómo estudiar un problema paraguayo con las 4 perspectivas?", "Aplicando enfoque normativo, empírico, comparado e histórico a un mismo fenómeno, como la abstención electoral."]]}, {"id": "u3", "title": "Unidad III", "subtitle": "Estado y sociedad. Poder y legitimidad", "sections": [{"h": "1. Estado y sociedad", "p": ["La política puede comprenderse, en gran medida, a partir de la relación entre Estado y sociedad. El Estado concentra instituciones, normas y capacidades de decisión; la sociedad está integrada por individuos, organizaciones, empresas, asociaciones, movimientos, iglesias, medios de comunicación y múltiples grupos que formulan demandas, defienden intereses y producen valores. El Estado surge históricamente de la sociedad, pero una vez institucionalizado también organiza y transforma la vida social: establece reglas, recauda recursos, presta servicios, reconoce derechos y adopta decisiones obligatorias.", "Norberto Bobbio permite presentar dos maneras de interpretar la aparición del Estado moderno: como continuidad y como discontinuidad respecto de organizaciones políticas anteriores. La discontinuidad destaca que el Estado moderno posee mayor concentración del poder, administración profesional y monopolio de la coerción. La continuidad recuerda que antes del Estado moderno ya existían ciudades, imperios y reinos capaces de gobernar y recaudar recursos."]}, {"h": "2. Expansión y límites del Estado", "p": ["El Estado no ha tenido siempre el mismo protagonismo. Durante el siglo XX, especialmente con la expansión del Estado de Bienestar, aumentaron las responsabilidades públicas en salud, educación, seguridad social y regulación económica. La tecnología y las comunicaciones también ampliaron la capacidad estatal para administrar información y prestar servicios a gran escala.", "Sin embargo, mayor capacidad no significa poder ilimitado. Las constituciones, los derechos, la división de poderes, la sociedad civil, el mercado y el entorno internacional imponen límites a la acción estatal. La soberanía, en el mundo contemporáneo, coexiste con organizaciones internacionales, tratados y procesos de integración que implican compartir determinadas competencias, como demuestra el caso de la Unión Europea."]}, {"h": "3-5. Mapa de actores: el Estado, la sociedad y los partidos", "p": ["El Estado no actúa como un actor único: está compuesto por instituciones con funciones diferentes. El gobierno dirige la acción estatal y formula políticas públicas. El Parlamento debate y aprueba leyes y controla al Ejecutivo. El Poder Judicial resuelve conflictos y controla la constitucionalidad de normas. Las Fuerzas Armadas y cuerpos de seguridad poseen recursos coercitivos específicos. La administración pública implementa normas y aporta continuidad más allá de los cambios de gobierno.", "La sociedad tampoco es un actor único: ciudadanos, empresas, sindicatos, iglesias, medios y movimientos sociales participan con intereses y recursos diferentes. Los partidos políticos ocupan una posición particular porque se originan en la sociedad civil pero buscan acceder a las instituciones estatales: son organizaciones de ciudadanos que compiten por el poder mediante elecciones y articulan demandas, programas y liderazgos."]}, {"h": "5.1-5.2 Élites políticas y grupos de interés", "p": ["Las élites políticas son grupos relativamente reducidos de personas que ocupan posiciones de mando y poseen capacidad significativa para influir sobre decisiones públicas. La existencia de élites es compatible con la democracia; el problema democrático se relaciona con la forma en que son seleccionadas, controladas y reemplazadas. La circulación de élites —cuando existe competencia y alternancia— es un indicador de que el poder se encuentra menos cerrado.", "Los grupos de interés son actores colectivos organizados que buscan influir sobre decisiones estatales sin necesariamente competir directamente por el gobierno. Sindicatos, asociaciones empresariales, gremios profesionales y ONG son ejemplos frecuentes. Sus estrategias incluyen lobby, movilización social, campañas públicas y negociación institucional."]}, {"h": "6-7. ¿Qué es el poder? Las tres caras de Lukes", "p": ["El poder es uno de los conceptos más discutidos de las ciencias políticas: es polisémico porque puede referirse a dominación, capacidad de actuar, cooperación, autonomía o control de recursos. Una definición clásica entiende el poder como una relación en la que un actor A logra que otro actor B actúe de una manera que de otro modo no habría elegido. El poder puede ejercerse mediante coerción, incentivos, persuasión o reglas institucionales.", "Steven Lukes propone comprender el poder a partir de diferentes niveles de visibilidad. La primera cara del poder se observa en decisiones abiertas y conflictos visibles. La segunda cara se relaciona con el control de la agenda: un actor puede ejercer poder evitando que determinados temas lleguen a discutirse. La tercera cara es más profunda: consiste en influir sobre las preferencias, percepciones y creencias de las personas, mediante la cultura, los valores y el sentido común."], "tb": [["Cara del poder", "Pregunta", "Manifestación"], ["Primera", "¿Quién gana una decisión visible?", "Conflictos, votaciones y decisiones abiertas"], ["Segunda", "¿Quién decide qué se discute?", "Control de agenda y exclusión de temas"], ["Tercera", "¿Quién influye sobre lo que consideramos normal?", "Cultura, valores, discursos y preferencias"]], "q": {"t": "El poder no siempre aparece en una orden directa ni en una decisión observable: puede actuar sobre la forma en que las personas interpretan sus intereses y el mundo político.", "c": "Steven Lukes — Manual de Unidad III"}}, {"h": "8. Fuentes y tipos de poder", "p": ["El poder no tiene una única fuente. El poder económico deriva del control de recursos, propiedad, capital y capacidad de gestión. El poder político se vincula con el control de instituciones estatales y, en última instancia, el monopolio legítimo de la coerción. El poder ideológico o intelectual se apoya en conocimiento, símbolos, información y capacidad de definir interpretaciones: medios de comunicación, instituciones educativas y productores culturales pueden influir sobre percepciones y preferencias.", "El poder puede analizarse en diferentes escalas: en el nivel micro aparece en relaciones interpersonales; en el nivel meso, dentro de organizaciones; en el nivel macro, en grandes estructuras como el Estado o el sistema de medios."]}, {"h": "9-10. Liderazgo, obediencia y los tipos de dominación de Weber", "p": ["En las democracias, el acceso a posiciones centrales de poder político se produce principalmente mediante elecciones, pero ganar una elección no depende solamente de programas partidarios: el liderazgo, la capacidad de persuasión y la confianza también influyen. Max Weber utilizó el concepto de carisma para describir una forma de autoridad basada en la creencia en cualidades extraordinarias de un líder.", "Todo orden político necesita algún grado de obediencia, que puede provenir del miedo, la costumbre, el interés o la legitimidad. Weber distingue tres tipos ideales de dominación legítima: la tradicional se basa en la creencia en costumbres heredadas; la carismática se apoya en la devoción hacia cualidades extraordinarias de un líder; la legal-racional se basa en normas impersonales y procedimientos, característica de la burocracia y el Estado moderno."], "tb": [["Tipo", "Base de legitimidad", "Se obedece a"], ["Tradicional", "Costumbre y herencia", "Autoridad legitimada por la tradición"], ["Carismática", "Cualidades extraordinarias atribuidas al líder", "Persona del líder"], ["Legal-racional", "Normas y procedimientos impersonales", "Cargo y orden jurídico"]]}, {"h": "11. Legitimidad democrática contemporánea y la oposición leal", "p": ["En las democracias actuales, la legitimidad no depende de una única fuente. Juan Linz destaca la socialización política, la eficacia (capacidad de diseñar respuestas) y la efectividad (capacidad de implementarlas) como factores que fortalecen o debilitan la aceptación de un régimen. Obtener resultados no vuelve democrático a un régimen autoritario: la legitimidad democrática requiere también reglas, derechos y competencia.", "Una democracia necesita oposición, pero también requiere que los actores que pierden una elección continúen reconociendo la legitimidad del sistema. La oposición leal critica al gobierno y compite por reemplazarlo, pero acepta las reglas fundamentales de la democracia. Cuando los adversarios comienzan a tratarse como enemigos ilegítimos, la estabilidad democrática puede debilitarse."]}, {"h": "13. Aplicación al caso paraguayo", "p": ["El caso paraguayo permite observar las interacciones entre Estado y sociedad: las instituciones estatales incluyen Poder Ejecutivo, Congreso y Poder Judicial, mientras partidos, empresas, sindicatos y organizaciones sociales buscan influir sobre decisiones públicas. Los partidos paraguayos muestran claramente la frontera porosa entre sociedad y Estado. Desde la perspectiva de la legitimidad, lo relevante para la estabilidad del sistema es que los actores continúen reconociendo procedimientos constitucionales, elecciones y oposición legítima, más allá de la crítica a un gobierno concreto."]}], "glossary": [["Estado moderno", "Organización política institucionalizada con coerción legítima."], ["Sociedad civil", "Individuos y organizaciones no estatales."], ["Grupo de interés", "Organización que influye en decisiones sin competir por el gobierno."], ["Control de agenda", "Determinar qué temas se discuten (2ª cara del poder, Lukes)."], ["Poder ideológico", "Influencia sobre valores, símbolos y preferencias."], ["Carisma", "Autoridad fundada en cualidades extraordinarias del líder."], ["Dominación legal-racional", "Autoridad basada en normas impersonales."], ["Oposición leal", "Compite con el gobierno pero acepta las reglas democráticas."]], "repaso": [["¿Por qué Estado y sociedad son ámbitos diferentes pero interdependientes?", "El Estado concentra instituciones y decisión; la sociedad produce demandas, conflictos e identidades."], ["¿Continuidad y discontinuidad del Estado moderno?", "Continuidad: el poder político ya existía antes. Discontinuidad: el Estado moderno tiene mayor escala e institucionalización."], ["¿Cómo cambió el protagonismo estatal desde el s. XIX?", "De Estado liberal limitado a Estado de Bienestar (1914-1970) y luego reformas de mercado desde 1980."], ["¿Efectos de la globalización sobre la soberanía?", "La soberanía ya no es absoluta: se comparten competencias mediante tratados y organismos internacionales."], ["¿Principales actores dentro del Estado y de la sociedad?", "Estado: gobierno, Parlamento, Judicial, FF.AA. Sociedad: ciudadanos, empresas, sindicatos, medios, movimientos."], ["¿Por qué los partidos tienen doble naturaleza?", "Nacen en la sociedad civil, pero al ganar elecciones ocupan instituciones estatales."], ["¿Qué son las élites políticas y por qué importa su circulación?", "Grupos reducidos con posiciones de mando; su renovación evita que el poder se cierre."], ["¿Diferencia entre partido político y grupo de interés?", "El partido compite por el gobierno; el grupo de interés influye sin competir directamente."], ["¿Por qué el poder no se reduce a coerción?", "También opera mediante incentivos, persuasión y reglas institucionales."], ["¿Las tres caras del poder de Lukes?", "Primera: decisiones visibles. Segunda: control de agenda. Tercera: influencia sobre preferencias y creencias."], ["¿Fuentes de poder económico, político e ideológico?", "Económico: recursos y capital. Político: instituciones y coerción legítima. Ideológico: conocimiento y medios."], ["¿Relación entre liderazgo y carisma?", "El carisma es una base de legitimidad que sostiene el liderazgo mediante devoción personal (Weber)."], ["¿Por qué obedecen las personas a una autoridad?", "Por miedo, costumbre, conveniencia, o porque creen que la autoridad tiene derecho legítimo a mandar."], ["¿Dominaciones tradicional, carismática y legal-racional de Weber?", "Tradicional: costumbre. Carismática: cualidades del líder. Legal-racional: normas impersonales."], ["¿Relación entre eficacia, efectividad y legitimidad?", "Ambas fortalecen la legitimidad, pero resultados no vuelven democrático a un régimen autoritario."], ["¿Qué significa que una oposición sea leal?", "Critica y compite con el gobierno, pero acepta las reglas democráticas fundamentales."], ["¿Cómo identificar fuentes de poder y legitimidad en Paraguay?", "Observando poder político, económico e ideológico y evaluando si se acepta el régimen democrático más allá del gobierno de turno."]]}, {"id": "u4", "title": "Unidad IV", "subtitle": "Estado, gobierno y nación", "sections": [{"h": "1. Tres conceptos que no son sinónimos", "p": ["Estado, gobierno y nación son conceptos fundamentales de las ciencias políticas, pero en el lenguaje cotidiano suelen utilizarse como si fueran equivalentes. Esta confusión dificulta comprender fenómenos básicos: un cambio de gobierno no implica la desaparición del Estado; una nación puede existir sin contar con un Estado propio; y un mismo Estado puede contener diversas identidades nacionales.", "El Estado responde a la pregunta sobre cuál es la organización institucional y jurídica que ejerce autoridad, con relativa permanencia institucional. El gobierno responde a quién conduce temporalmente esa organización, con temporalidad y dirección política. La nación responde a quiénes se reconocen como una comunidad con vínculos de pertenencia e identidad colectiva."], "q": {"t": "Si mañana cambia completamente el gobierno paraguayo, el Estado paraguayo no desaparece. Sus instituciones, territorio, población, orden jurídico y personalidad internacional continúan existiendo. Tampoco desaparece la comunidad nacional.", "c": "Manual de Unidad IV"}}, {"h": "2. El Estado: territorio, población, poder político y orden jurídico", "p": ["El Estado moderno se caracteriza por la concentración e institucionalización del poder: la autoridad deja de depender exclusivamente de relaciones personales y se organiza mediante normas, cargos y burocracias relativamente permanentes. Esta institucionalización permite que el Estado continúe existiendo aunque cambien las personas que ocupan el gobierno.", "El territorio es el espacio geográfico dentro del cual el Estado ejerce su autoridad; posee una dimensión física y también jurídica y política. La población está constituida por las personas sometidas al orden jurídico estatal, y no debe confundirse automáticamente con la nación: incluye ciudadanos, extranjeros y residentes con diferentes derechos y obligaciones. El poder político es la capacidad de adoptar decisiones obligatorias y asegurar su cumplimiento; en el Estado moderno se institucionaliza y se ejerce mediante cargos definidos por el orden jurídico.", "La soberanía expresa la existencia de una autoridad política superior dentro del territorio estatal, con una dimensión interna (autoridad sobre población y territorio) y una externa (independencia frente a otros Estados). En los Estados constitucionales contemporáneos, soberanía no significa poder ilimitado del gobierno: la autoridad está sometida a la Constitución, los derechos fundamentales y la división de poderes."]}, {"h": "3. Funciones del Estado", "p": ["Las funciones estatales han cambiado históricamente y no existe una lista universal e inmutable. Entre las funciones fundamentales se encuentran mantener el orden y la seguridad, garantizar la vigencia del Derecho, administrar justicia, proteger el territorio, representar internacionalmente a la comunidad política y organizar la administración pública. Los Estados contemporáneos también prestan servicios públicos en educación, salud, infraestructura y protección social, y promueven cohesión social reduciendo desigualdades."], "tb": [["Función", "Contenido"], ["Orden y seguridad", "Protección de personas, bienes y convivencia social"], ["Justicia y legalidad", "Aplicación de normas y resolución de conflictos"], ["Servicios públicos", "Educación, salud, infraestructura"], ["Representación internacional", "Relaciones diplomáticas y tratados"], ["Cohesión social", "Protección social y reducción de desigualdades"]]}, {"h": "4-4.1. El gobierno y la administración pública", "p": ["El gobierno es el conjunto de autoridades que dirige y administra temporalmente el Estado. A diferencia del Estado, que posee continuidad institucional, el gobierno tiene una duración limitada y puede ser reemplazado mediante los mecanismos previstos por el régimen político. Gobernar significa orientar la acción estatal: establecer prioridades, tomar decisiones e impulsar políticas públicas.", "Gobierno y administración pública tampoco son exactamente lo mismo. El gobierno posee una función principalmente política: define orientaciones y prioridades. La administración pública ejecuta políticas, presta servicios y desarrolla tareas técnicas de manera relativamente permanente. Una administración profesional evita que cada cambio de gobierno implique reconstruir completamente el aparato estatal."]}, {"h": "5. Formas de gobierno: presidencialismo, parlamentarismo y semipresidencialismo", "p": ["En el presidencialismo, el presidente es elegido independientemente del Poder Legislativo y ejerce la jefatura del Poder Ejecutivo por un período determinado, reuniendo habitualmente las funciones de jefe de Estado y jefe de gobierno. Su mandato tiene duración fija. Paraguay, al igual que la mayoría de los países latinoamericanos, adopta una forma presidencial de gobierno.", "En el parlamentarismo, el gobierno surge de la mayoría parlamentaria y necesita conservar su confianza para permanecer en funciones; el jefe de gobierno suele ser un primer ministro. Si el gobierno pierde apoyo parlamentario, puede ser reemplazado sin esperar el final de un mandato fijo.", "El semipresidencialismo combina elementos presidenciales y parlamentarios: existe un presidente elegido popularmente y, al mismo tiempo, un primer ministro y un gabinete que dependen de la confianza parlamentaria. Cuando el presidente y la mayoría legislativa pertenecen a fuerzas diferentes puede producirse una situación de cohabitación."], "tb": [["Modelo", "Ejecutivo", "Relación con el Legislativo"], ["Presidencialismo", "Presidente elegido separadamente", "Mandato fijo e independencia de origen"], ["Parlamentarismo", "Primer ministro de mayoría parlamentaria", "Gobierno depende de confianza parlamentaria"], ["Semipresidencialismo", "Presidente + primer ministro", "Ejecutivo dual"]]}, {"h": "6. La nación y su relación con el Estado", "p": ["La nación es una comunidad humana que desarrolla un sentido de pertenencia colectiva, vinculado con historia, cultura, lengua, tradiciones, símbolos y memoria. Posee una dimensión subjetiva: existe en la medida en que un conjunto de personas se reconoce como parte de una comunidad. El nacionalismo es la ideología que coloca a la nación como comunidad política fundamental, pero nación y nacionalismo no son conceptos idénticos.", "Estado y nación pueden coincidir, pero no necesariamente. El ideal del Estado-nación supone que las fronteras estatales coinciden con una comunidad nacional, pero numerosos Estados contienen diferentes identidades nacionales, culturales o étnicas. También existen naciones sin Estado soberano propio, lo que puede producir demandas de autonomía, federalismo o independencia."]}, {"h": "7. Del Estado liberal clásico al Estado de Bienestar", "p": ["Durante el desarrollo del liberalismo clásico se consolidó una concepción de Estado limitado, centrada en garantizar seguridad, propiedad, contratos y libertades individuales, como reacción al absolutismo. Sin embargo, la industrialización planteó nuevos problemas: la igualdad jurídica coexistía con desigualdades económicas, condiciones laborales precarias y ausencia de protección frente a enfermedad o desempleo.", "El Estado de Bienestar amplía las responsabilidades estatales en salud, educación, seguridad social y políticas sociales, bajo la premisa de que ciertos riesgos no deben depender exclusivamente de la capacidad económica individual. Existen diferentes modelos: algunos se apoyan en sistemas universales financiados mediante impuestos, otros en contribuciones laborales, y otros focalizan la asistencia en sectores de menores ingresos."]}, {"h": "8-9. Transformación de la ciudadanía y el debate sobre la intervención estatal", "p": ["La ciudadanía moderna se vinculó primero con derechos civiles (libertad personal, propiedad, igualdad ante la ley); luego se expandieron los derechos políticos (sufragio, participación); y con el Estado social se incorporaron los derechos sociales (educación, salud, seguridad social) como componentes de una ciudadanía efectiva.", "La expansión estatal genera un debate permanente: quienes defienden mayor intervención sostienen que el mercado no garantiza por sí solo igualdad de oportunidades; quienes cuestionan una expansión excesiva señalan costo fiscal, burocratización e ineficiencia. El debate contemporáneo se desplaza hacia la calidad de la intervención: qué problema resuelve, cómo se financia y qué resultados y controles produce."], "tb": [["Dimensión de ciudadanía", "Ejemplos"], ["Derechos civiles", "Libertad personal, propiedad, igualdad ante la ley"], ["Derechos políticos", "Sufragio, participación, representación"], ["Derechos sociales", "Educación, salud, seguridad social"]]}, {"h": "11. El caso paraguayo", "p": ["Paraguay permite observar claramente la diferencia entre Estado, gobierno y nación. La República del Paraguay constituye el Estado: posee territorio, población, soberanía, Constitución e instituciones. Los gobiernos se suceden dentro de ese marco. La nación paraguaya remite a una identidad colectiva construida históricamente. La Constitución de 1992 organiza jurídicamente al Estado paraguayo bajo un modelo presidencial, y el análisis del caso permite observar la ampliación de responsabilidades estatales en educación, salud y programas sociales."]}], "glossary": [["Estado", "Organización política y jurídica soberana sobre población y territorio."], ["Gobierno", "Autoridades que dirigen temporalmente el Estado."], ["Nación", "Comunidad con vínculos de pertenencia e identidad."], ["Soberanía", "Autoridad política superior dentro del territorio."], ["Presidencialismo", "El presidente tiene mandato propio e independiente del Legislativo."], ["Parlamentarismo", "El Ejecutivo depende de la confianza parlamentaria."], ["Estado de Bienestar", "Amplía responsabilidades estatales en derechos sociales."]], "repaso": [["¿Por qué Estado, gobierno y nación no son sinónimos?", "Responden a preguntas distintas: organización permanente, autoridades temporales, y comunidad de identidad."], ["¿Elementos fundamentales del Estado?", "Territorio, población, poder político o soberanía, y orden jurídico."], ["¿Diferencia entre poder político y soberanía?", "Poder político: capacidad de decidir obligatoriamente. Soberanía: autoridad superior interna y externa."], ["¿Por qué el Estado permanece aunque cambie el gobierno?", "Sus instituciones y orden jurídico tienen continuidad independiente de quién gobierna."], ["¿Funciones del Estado contemporáneo?", "Orden, justicia, servicios públicos, representación internacional, desarrollo económico y cohesión social."], ["¿Diferencia entre gobierno y administración pública?", "Gobierno define prioridades políticas; administración ejecuta y presta servicios técnicos."], ["¿Presidencialismo, parlamentarismo y semipresidencialismo?", "Presidencial: mandato fijo. Parlamentario: depende de confianza legislativa. Semipresidencial: combina ambos."], ["¿Por qué una nación puede existir sin Estado propio?", "Su dimensión es subjetiva e histórica (identidad, cultura), no depende de instituciones soberanas."], ["¿Puede un Estado contener varias identidades nacionales?", "Sí, muchos Estados son plurinacionales o multiculturales."], ["¿Características del Estado liberal clásico?", "Limitado, garantiza seguridad, propiedad y libertades civiles, como reacción al absolutismo."], ["¿Por qué se amplian funciones con el Estado de Bienestar?", "La igualdad jurídica no bastaba frente a desigualdades económicas de la industrialización."], ["¿Cómo cambia la ciudadanía con derechos sociales?", "Se añade una dimensión social (educación, salud) junto a derechos civiles y políticos."], ["¿Argumentos a favor y en contra de mayor intervención estatal?", "A favor: reduce desigualdad. En contra: costo fiscal, burocratización e ineficiencia."], ["¿Por qué el debate no es solo 'más o menos Estado'?", "Lo relevante es la calidad de la intervención: qué resuelve y cómo se financia."], ["¿Cómo aplicar Estado, gobierno y nación al caso paraguayo?", "Paraguay es el Estado con Constitución; los gobiernos se suceden; la nación es la identidad compartida."]]}, {"id": "u5", "title": "Unidad V", "subtitle": "Sistema político", "sections": [{"h": "1. El Estado como organización política y la definición de Weber", "p": ["El sistema político es el espacio en el que instituciones, actores, normas, demandas sociales y decisiones públicas se relacionan de manera permanente. El Estado es una de las instituciones fundamentales de la política moderna, aunque no existe una única forma histórica de Estado. Una aproximación básica identifica tres componentes clásicos: población, territorio y poder soberano.", "Una de las definiciones más influyentes es la de Max Weber, quien no define al Estado por las funciones que realiza sino por el medio específico del que dispone: la coerción física legítima. En esta perspectiva, el Estado es una organización política cuyos funcionarios reclaman con éxito el monopolio legítimo de la violencia dentro de un territorio determinado."], "q": {"t": "La coerción no es necesariamente el recurso cotidiano ni el primero que utiliza el Estado. Es el recurso de última instancia.", "c": "Manual de Unidad V"}}, {"h": "1.2-2. Soberanía y formación del Estado moderno", "p": ["La soberanía es una característica central del Estado moderno, aunque hoy no debe pensarse como una capacidad absoluta e ilimitada: la interdependencia económica, los organismos internacionales y los procesos de integración regional muestran que la capacidad efectiva de los Estados varía. El Estado moderno no apareció de manera instantánea: fue el resultado de un proceso histórico de centralización del poder, delimitación territorial y desarrollo de burocracias, vinculado a guerras y competencia territorial en Europa. La Paz de Westfalia de 1648 suele utilizarse como referencia simbólica del sistema internacional moderno basado en Estados soberanos."]}, {"h": "3-3.1. Del Estado al sistema político: David Easton", "p": ["El enfoque de sistema político amplía la mirada del Estado y observa las relaciones dinámicas entre el Estado, la sociedad y los diferentes actores que intervienen en la vida política: partidos, movimientos sociales, grupos de interés, medios de comunicación y ciudadanía. David Easton definió al sistema político como el conjunto de interacciones mediante las cuales se realiza la asignación autoritativa de valores en una sociedad.", "El modelo de Easton representa el sistema político como un proceso de entradas, conversión, salidas y retroalimentación. Las entradas o inputs son demandas y apoyos provenientes del entorno social; las instituciones políticas procesan esas entradas y producen outputs (leyes, políticas públicas); la retroalimentación o feedback ocurre cuando las decisiones generan reacciones en la sociedad, que vuelven a ingresar al sistema."], "tb": [["Elemento", "Contenido", "Ejemplo"], ["Inputs", "Demandas y apoyos provenientes de la sociedad", "Reclamo ciudadano por mayor seguridad"], ["Procesamiento", "Instituciones transforman demandas en decisiones", "Debate legislativo y diseño de una política"], ["Outputs", "Decisiones y políticas públicas", "Ley, presupuesto, programa público"], ["Feedback", "Respuesta social a las decisiones", "Apoyo, protesta, nuevas demandas o voto"]]}, {"h": "4. Régimen político, democracia, autoritarismo y totalitarismo", "p": ["El régimen político refiere al conjunto de reglas e instituciones que determinan cómo se accede al poder, cómo se ejerce y cuáles son los límites de la autoridad. En una democracia, la competencia política, el pluralismo y la alternancia constituyen elementos centrales; en los regímenes autoritarios, el poder se concentra y la competencia se encuentra limitada.", "Una dictadura concentra el poder en una persona o grupo reducido y elimina los controles institucionales. El autoritarismo es una categoría analítica que describe regímenes con pluralismo limitado; puede mantener ciertas instituciones o elecciones, pero limita la competencia real. El totalitarismo supone una pretensión de control y transformación mucho más extensa de la sociedad, mediante ideología oficial y movilización intensa. La estabilidad autoritaria no depende exclusivamente de la represión: puede combinar coerción con clientelismo, control de medios y legitimación ideológica."], "tb": [["Autoritarismo", "Totalitarismo"], ["Pluralismo limitado", "Pretensión de eliminación del pluralismo"], ["Movilización baja, controlada o selectiva", "Movilización intensa y permanente"], ["Ideología débil, pragmática o limitada", "Ideología oficial fuerte y totalizante"], ["Busca obediencia y estabilidad", "Busca transformar integralmente sociedad e individuo"]]}, {"h": "5. Análisis de los sistemas autoritarios", "p": ["Los sistemas autoritarios presentan gran diversidad y pueden analizarse observando variables como el número de actores que ejercen el poder (liderazgo personalista o coalición dominante), la justificación ideológica (fuerte o pragmática), el nivel de movilización social y el grado de institucionalización (desde un liderazgo personal hasta partidos dominantes y burocracias estables)."]}, {"h": "6-6.1. Golpe de Estado: condiciones y factores asociados", "p": ["El golpe de Estado es una forma de ruptura del orden político mediante la cual un grupo relativamente reducido desplaza de manera rápida e ilegal a las autoridades existentes y se apodera de los centros decisivos del poder. Históricamente, las Fuerzas Armadas han tenido un papel central, aunque también pueden intervenir actores civiles. El golpe debe distinguirse de una revolución, que supone una movilización social más amplia y busca transformar profundamente el orden político, social o económico.", "No existe una causa única de los golpes de Estado. Entre los factores que pueden contribuir se encuentran crisis económicas, desigualdad, debilidad institucional, polarización política, pérdida de legitimidad y conflictos entre élites. En América Latina, los golpes militares del siglo XX se vincularon con frecuencia a conflictos distributivos, polarización ideológica y contextos internacionales como la Guerra Fría."]}, {"h": "7-8. Formas de gobierno autoritarias y transición política", "p": ["Entre las formas de gobierno autoritarias estudiadas se encuentran regímenes tradicionales (apoyados en estructuras históricas o patrimoniales), teocráticos (legitimidad vinculada a una doctrina religiosa), militares (las Fuerzas Armadas ocupan directamente el gobierno), cívico-militares (combinan actores civiles y militares) y de partido único (concentran el poder en una organización partidaria).", "Una transición política es un proceso de cambio de un régimen hacia otro, no un acontecimiento instantáneo. Las transiciones pueden dirigirse hacia una democracia, hacia un nuevo autoritarismo o hacia formas híbridas. Suelen comenzar cuando un régimen pierde capacidad para reproducir sus reglas: pérdida de legitimidad, divisiones dentro de la élite gobernante, crisis económica o movilización social."]}, {"h": "8.2-9. Liberalización, democratización y consolidación democrática", "p": ["Liberalización y democratización no son sinónimos: la liberalización consiste en una apertura parcial del régimen autoritario (ampliar libertades, tolerar cierta oposición) sin aceptar todavía una competencia plenamente democrática. La democratización implica un cambio más profundo en las reglas de acceso y ejercicio del poder: elecciones libres, pluralismo partidario y posibilidad real de alternancia.", "La caída de un régimen autoritario y la celebración de elecciones no significan automáticamente que una democracia esté consolidada. La instauración democrática refiere a la construcción inicial de nuevas instituciones; la consolidación comienza cuando esas estructuras se fijan y aumentan su aceptación social. Leonardo Morlino destaca que la consolidación debe analizarse tanto en el nivel institucional como en la relación entre régimen y sociedad civil: una democracia se consolida cuando aumenta la legitimidad de las reglas democráticas como mecanismo para resolver pacíficamente los conflictos."], "tb": [["Liberalización", "Democratización"], ["Apertura parcial de derechos y libertades", "Transformación de las reglas de acceso al poder"], ["Puede mantenerse la élite autoritaria", "Competencia política efectiva"], ["No garantiza democracia", "Implica construcción de un régimen democrático"]]}, {"h": "11. Aplicación al caso paraguayo", "p": ["La dictadura de Alfredo Stroessner, entre 1954 y 1989, constituyó un régimen autoritario de fuerte liderazgo personalista, sostenido por la articulación entre Presidencia, Fuerzas Armadas y Partido Colorado, con severa restricción de la oposición y las libertades políticas. La caída de Stroessner en febrero de 1989 abrió un proceso de transición que incluyó reformas institucionales y culminó con la Constitución de 1992. Desde la perspectiva de la consolidación, el análisis no termina con la aprobación de una Constitución: debe observarse la calidad de las instituciones, la independencia de los poderes y la capacidad del sistema para resolver conflictos sin recurrir a rupturas autoritarias."]}], "glossary": [["Sistema político", "Interacciones por las que se procesan demandas y decisiones."], ["Monopolio legítimo de la violencia", "Uso legítimo de la coerción física dentro de un territorio (Weber)."], ["Régimen político", "Reglas que organizan el acceso y ejercicio del poder."], ["Golpe de Estado", "Toma no constitucional del poder mediante ruptura rápida."], ["Liberalización", "Apertura parcial de libertades sin plena democratización."], ["Democratización", "Establecimiento de competencia y derechos democráticos."], ["Consolidación democrática", "Estabilización y legitimación de las reglas democráticas."]], "repaso": [["¿Qué aporta la definición de Estado de Max Weber?", "Define al Estado por el monopolio legítimo de la coerción física, no por sus funciones."], ["¿Por qué Estado y sistema político no son sinónimos?", "El Estado es la estructura permanente; el sistema político incluye las interacciones dinámicas con la sociedad."], ["¿Modelo de inputs, outputs y feedback de Easton?", "Demandas ingresan (inputs), se procesan en decisiones (outputs), generando feedback social."], ["¿Diferencia entre régimen democrático, autoritario y totalitario?", "Democrático: pluralismo y alternancia. Autoritario: poder concentrado. Totalitario: control total de la sociedad."], ["¿Por qué la represión no es el único sostén autoritario?", "Se combina con clientelismo, control de medios y legitimación ideológica."], ["¿Variables para analizar sistemas autoritarios?", "Número de actores, justificación ideológica, movilización e institucionalización."], ["¿Diferencia entre golpe de Estado y revolución?", "El golpe es una ruptura rápida por un grupo reducido; la revolución implica movilización social amplia."], ["¿Factores que favorecen rupturas autoritarias?", "Crisis económica, desigualdad, debilidad institucional y polarización, sin ser causas únicas."], ["¿Diferencia entre liberalización y democratización?", "Liberalización: apertura parcial de libertades. Democratización: cambio real de las reglas de acceso al poder."], ["¿Qué actores intervienen en una transición política?", "Sectores duros y blandos del régimen, oposición moderada y radical, Fuerzas Armadas y ciudadanía."], ["¿Diferencia entre instauración, consolidación y persistencia?", "Instauración crea instituciones; consolidación las legitima; persistencia es mantenerse en el tiempo."], ["¿Por qué la legitimidad es clave para la consolidación?", "Los actores deben aceptar resolver disputas dentro de las instituciones democráticas, aun perdiendo."], ["¿Cómo aplicar transición y consolidación al caso paraguayo?", "La dictadura de Stroessner (1954-1989) dio paso a la transición y la Constitución de 1992."]]}, {"id": "u6", "title": "Unidad VI", "subtitle": "Ideologías políticas", "sections": [{"h": "1. Ideología y pensamiento político", "p": ["Una ideología política es un conjunto relativamente organizado de ideas, valores, principios y expectativas sobre la sociedad, el poder, el Estado, la economía y la forma en que debería organizarse la convivencia colectiva. Toda ideología ofrece una interpretación de la realidad y, al mismo tiempo, una propuesta normativa: describe qué considera injusto, qué debe conservarse y qué medios resultan legítimos para transformar un orden político.", "Las ideologías modernas se consolidan especialmente a partir de las grandes transformaciones de los siglos XVIII y XIX: la crisis del absolutismo, la Revolución Francesa, la expansión del capitalismo y la Revolución Industrial. Una ideología política suele tener cuatro dimensiones: una visión de la naturaleza humana, una visión del poder, una visión del Estado y una visión del cambio social (gradual, revolucionario o reformista)."]}, {"h": "2. Liberalismo: bases filosóficas, Hobbes, Locke y Kant", "p": ["El liberalismo surge como reacción frente al absolutismo, los privilegios estamentales y el feudalismo. Frente a ese mundo, afirma que el individuo posee derechos y libertades que no dependen de la voluntad del gobernante. Su núcleo fundamental es la limitación del poder, vinculándose con el constitucionalismo, la división de poderes, los derechos individuales y la igualdad ante la ley.", "Thomas Hobbes y John Locke son autores fundamentales para comprender la transición del absolutismo al pensamiento moderno. Para Hobbes, el problema central es la inseguridad: en ausencia de un poder común, los individuos viven sometidos al miedo, por lo que transfieren poder a un soberano fuerte. Locke, en cambio, es una figura central del liberalismo político: los individuos poseen derechos anteriores al Estado —vida, libertad y propiedad— y el gobierno se crea para proteger esos derechos, no para anularlos; si se vuelve arbitrario, pierde legitimidad.", "Immanuel Kant aporta una concepción jurídica y moral de la libertad: la libertad no significa ausencia de reglas, sino sometimiento a leyes racionales que puedan valer para todos. Esto se traduce en la idea de Estado de Derecho: el poder debe estar jurídicamente limitado por una Constitución, derechos fundamentales y mecanismos de control."], "q": {"t": "Antes de ser una doctrina económica, el liberalismo es una doctrina política orientada a impedir que el poder estatal sea arbitrario.", "c": "Manual de Unidad VI"}}, {"h": "2.4-2.5. Liberalismo económico y su evolución", "p": ["El liberalismo económico se asocia principalmente con Adam Smith y la defensa de la economía de mercado: propiedad privada, división del trabajo, libre competencia. La idea de la mano invisible expresa que la búsqueda del interés individual puede contribuir, mediante el intercambio, a resultados socialmente beneficiosos, aunque el Estado conserva funciones esenciales como garantizar seguridad y contratos.", "El liberalismo clásico del siglo XIX se centró en limitar el poder político y proteger la propiedad privada. Durante el siglo XX, el liberalismo social incorporó una pregunta distinta: ¿puede una persona ser realmente libre si carece de educación, salud o trabajo? Por eso acepta mayor intervención estatal para reducir desigualdades. Hoy conviven liberalismo clásico, liberalismo social, neoliberalismo (que enfatiza el mercado) y liberalismo progresista (que combina libertades individuales con pluralismo y protección de minorías)."]}, {"h": "3. Conservadurismo: Edmund Burke, tradición y democracia", "p": ["El conservadurismo surge como reacción frente a las revoluciones modernas, especialmente la Revolución Francesa. No debe entenderse como apego irracional al pasado: es una forma de pensamiento que valora la continuidad histórica y la prudencia frente a proyectos de transformación radical, sosteniendo que las instituciones políticas son el resultado de experiencias acumuladas.", "Edmund Burke es el gran referente del conservadurismo moderno. Para él, la sociedad puede entenderse como una comunidad entre los vivos, los muertos y los que están por nacer: una generación no debería destruir irresponsablemente la herencia institucional recibida. Las reformas son posibles, pero deben ser prudentes y orgánicas, sin fundar el orden político exclusivamente en principios racionales abstractos.", "Históricamente, algunas corrientes conservadoras desconfiaron de la democracia de masas y el sufragio universal, temiendo que la movilización destruyera el orden social. Sin embargo, el conservadurismo evolucionó y se integró en sistemas democráticos, manteniendo énfasis en orden, autoridad, propiedad y tradición."]}, {"h": "4. Socialismo: orígenes, corrientes y socialdemocracia", "p": ["El socialismo surge entre fines del siglo XVIII y el siglo XIX como respuesta a las desigualdades producidas por la industrialización y el capitalismo. A diferencia del liberalismo clásico, que pone el acento en la libertad individual, el socialismo pregunta si puede existir libertad real en una sociedad marcada por pobreza y explotación. Es una familia amplia que incluye socialismo utópico, anarquismo, socialismo inglés, marxismo y socialdemocracia.", "El socialismo utópico (Owen, Fourier) imaginó modelos alternativos basados en cooperación y comunidad. El anarquismo (Bakunin, Kropotkin) comparte la crítica a la desigualdad pero rechaza el Estado como forma de dominación, aspirando a una sociedad de asociaciones libres. La socialdemocracia representa una corriente reformista que sostiene que la transformación social puede realizarse mediante democracia, elecciones y políticas públicas, impulsando el Estado de Bienestar, los derechos laborales y la seguridad social."]}, {"h": "5. Marxismo: materialismo histórico, plusvalor y alienación", "p": ["El marxismo es una corriente específica dentro del socialismo, desarrollada por Karl Marx y Friedrich Engels, que aporta una crítica estructural del capitalismo y una teoría de la historia basada en el conflicto entre clases sociales. El materialismo histórico sostiene que la historia está atravesada por conflictos vinculados al modo en que se organiza la producción; la lucha de clases —entre burguesía y proletariado— es el motor de la historia.", "El plusvalor es central en la crítica marxista: el trabajador produce un valor mayor que el salario que recibe, y esa diferencia es apropiada por el capitalista, lo que constituye la explotación capitalista. La alienación describe la pérdida de control del trabajador sobre su propia actividad: no controla el producto de su trabajo ni el proceso productivo, quedando reducido a una pieza del sistema.", "En la teoría marxista, el socialismo aparece como una etapa de transición hacia el comunismo: una sociedad sin clases, sin explotación y sin propiedad privada de los medios de producción. Es fundamental distinguir socialismo y marxismo: todo marxismo es socialista, pero no todo socialismo es marxista (una socialdemocracia que defiende el Estado de Bienestar es socialista sin ser necesariamente marxista)."]}, {"h": "6. Nacionalismo: formas y evolución", "p": ["El nacionalismo se vincula estrechamente con el Estado moderno y sostiene que la nación debe expresar su voluntad política, ya sea mediante un Estado propio, autonomía o reconocimiento. A diferencia del liberalismo o el socialismo, no responde a cuánto Estado o mercado debe existir, sino a quién constituye la comunidad política: su respuesta es la nación.", "Puede distinguirse la nación política (basada en ciudadanía e instituciones comunes), la nación cultural (lengua, tradiciones, símbolos) y la dimensión jurídico-estatal (pertenencia formal a un Estado). Durante el siglo XIX, el nacionalismo impulsó la unificación de territorios (Italia, Alemania); en el siglo XX fue utilizado por movimientos anticoloniales y también por regímenes autoritarios y expansionistas."], "tb": [["Forma", "Características"], ["Nacionalismo cívico o político", "Ciudadanía, instituciones y voluntad política común"], ["Nacionalismo cultural", "Lengua, memoria y símbolos compartidos"], ["Nacionalismo anticolonial", "Reclama autodeterminación frente a dominación extranjera"], ["Nacionalismo conservador", "Vincula nación con tradición, orden o religión"], ["Nacionalismo excluyente", "Define la nación con criterios cerrados, riesgo de discriminación"]]}, {"h": "7-8. Otras tradiciones ideológicas: anarquismo, fascismo y democracia cristiana", "p": ["El anarquismo rechaza el Estado y las formas coercitivas de autoridad, proponiendo formas de organización voluntaria y autogestión. El fascismo es una ideología autoritaria, ultranacionalista y antiliberal que rechaza el pluralismo político y exalta el liderazgo fuerte; sus ejemplos más conocidos son el fascismo italiano y el nazismo alemán. La democracia cristiana se inspira en el pensamiento social cristiano, defendiendo la dignidad de la persona, la subsidiariedad y una economía social de mercado.", "El ecologismo introduce la cuestión ambiental como problema político central, cuestionando modelos de desarrollo y consumo. Los feminismos cuestionan las desigualdades de género y las estructuras patriarcales, con corrientes liberal, socialista, radical e interseccional. El populismo no es necesariamente una ideología completa, sino una lógica política que construye una oposición entre el pueblo y las élites, pudiendo combinarse con ideologías de izquierda o derecha."]}, {"h": "9-10. Izquierda, derecha y nuevos ejes de conflicto ideológico", "p": ["El espectro izquierda-derecha nació en el contexto de la Revolución Francesa y hoy se usa para analizar partidos y discursos. La izquierda suele asociarse con igualdad y redistribución; la derecha, con orden, propiedad y tradición; el centro, con moderación y pragmatismo. Sin embargo, esta clasificación es insuficiente si se usa rígidamente: un partido puede ser liberal en economía, conservador en temas culturales y nacionalista en política exterior.", "Los conflictos contemporáneos combinan varios ejes analíticos: el eje económico opone mayor intervención estatal a mayor libertad de mercado; el eje sociocultural distingue posiciones progresistas y conservadoras; el eje territorial contrapone g
