lobalización o integración frente a soberanía y nacionalismo; y el eje político-institucional distingue compromiso democrático frente a tendencias autoritarias o iliberales."], "tb": [["Eje", "Polo 1", "Polo 2"], ["Económico", "Mayor intervención estatal", "Mayor libertad de mercado"], ["Sociocultural", "Progresismo", "Conservadurismo cultural"], ["Territorial", "Globalismo/integración", "Nacionalismo/soberanía"], ["Institucional", "Democracia pluralista", "Autoritarismo/iliberalismo"]]}], "glossary": [["Ideología", "Conjunto organizado de ideas que interpreta la realidad política."], ["Estado de Derecho", "El poder público está sometido a normas jurídicas."], ["Plusvalor", "Diferencia entre valor producido y salario, apropiada por el capitalista (Marx)."], ["Alienación", "Pérdida de control del trabajador sobre su propio trabajo."], ["Socialdemocracia", "Corriente socialista reformista que impulsa el Estado de Bienestar."], ["Nacionalismo", "Ideología que coloca a la nación como comunidad política fundamental."], ["Populismo", "Lógica política que opone al pueblo frente a las élites."]], "repaso": [["¿Por qué el liberalismo es una doctrina de limitación del poder?", "Busca impedir el poder arbitrario del Estado, vinculándose al constitucionalismo y la división de poderes."], ["¿Diferencia entre igualdad jurídica e igualdad social?", "Jurídica: igual sometimiento a la ley. Social: condiciones materiales más equitativas."], ["¿Diferencia entre Hobbes y Locke sobre el Estado?", "Hobbes: soberano fuerte contra la inseguridad. Locke: Estado limitado para proteger derechos previos."], ["¿Por qué el conservadurismo valora la tradición?", "Considera que las instituciones condensan experiencia histórica acumulada."], ["¿Qué distingue al socialismo del marxismo?", "El socialismo es amplio y puede ser reformista; el marxismo explica la historia por la lucha de clases."], ["¿Qué son plusvalor y alienación en Marx?", "Plusvalor: diferencia entre valor producido y salario. Alienación: pérdida de control sobre el propio trabajo."], ["¿Por qué el nacionalismo puede ser de izquierda o derecha?", "Responde a quién constituye la comunidad política, combinándose con otras ideologías."], ["¿Diferencia entre nación política, cultural y jurídica?", "Política: ciudadanía común. Cultural: lengua y tradiciones. Jurídica: pertenencia formal a un Estado."], ["¿Por qué el eje izquierda-derecha es insuficiente?", "Los conflictos actuales combinan ejes económico, sociocultural, territorial e institucional."], ["¿Nuevos ejes de conflicto ideológico contemporáneo?", "Económico (Estado/mercado), sociocultural, territorial (soberanía/globalismo) e institucional (democracia/autoritarismo)."]]}];
let current=0;
function toggleTheme(){const b=document.body;b.dataset.theme=b.dataset.theme==='dark'?'light':'dark'}
function toggleSide(side,force){const el=document.getElementById(side==='left'?'leftSide':'rightSide');const isOpen=force===true||!el.classList.contains('open');closeSides();if(isOpen){el.classList.add('open');document.getElementById('scrim').classList.add('show')}}
function closeSides(){document.querySelectorAll('.side').forEach(x=>x.classList.remove('open'));document.getElementById('scrim').classList.remove('show')}
function renderNav(){document.getElementById('unitNav').innerHTML=UNITS.map((u,i)=>`<button class="unit-btn ${i===current?'active':''}" onclick="selectUnit(${i})"><strong>${u.title}</strong><span>${u.subtitle}</span></button>`).join('')}
function selectUnit(i){current=i;renderNav();renderUnit();closeSides()}
function renderUnit(){const u=UNITS[current];document.getElementById('unitBadge').textContent='U'+(current+1);document.getElementById('heroTitle').textContent=u.title;document.getElementById('heroSubtitle').textContent=u.subtitle;document.getElementById('content').innerHTML=u.sections.map((s,i)=>`<article class="section ${i===0?'open':''}"><button class="section-head" onclick="this.parentNode.classList.toggle('open')"><span>${s.h}</span><span class="chev">⌄</span></button><div class="section-body">${(s.p||[]).map(p=>`<p>${p}</p>`).join('')}${s.q?`<blockquote>“${s.q.t}”<span>— ${s.q.c}</span></blockquote>`:''}${s.tb?`<div class="table-scroll"><table><thead><tr>${s.tb[0].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${s.tb.slice(1).map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}</div></article>`).join('');renderGlossary(u);hidePanels();document.querySelector('.reader').scrollTop=0}
function openAll(){document.querySelectorAll('.section').forEach(s=>s.classList.add('open'))}
function hidePanels(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'))}
function renderGlossary(u){document.getElementById('glossary').innerHTML=u.glossary.map(g=>`<div class="gloss-item"><b>${g[0]}</b><span>${g[1]}</span></div>`).join('')}
function showPanel(name){hidePanels();const u=UNITS[current],el=document.getElementById(name);el.classList.add('show');if(name==='review')el.innerHTML=`<div class="tool-card"><h3>❓ ${u.repaso.length} preguntas de repaso</h3>${u.repaso.map((q,i)=>`<div class="question"><button onclick="document.getElementById('ans-${i}').classList.toggle('show')">${i+1}. ${q[0]}</button><div class="answer" id="ans-${i}">${q[1]}</div></div>`).join('')}</div>`}

renderNav();renderUnit();
</script>
